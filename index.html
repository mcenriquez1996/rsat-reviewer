<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f131c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RSAT Reviewer">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>RSAT Reviewer</title>
<style>
  /* Layout: card home (topics + full tests) -> topic with Review/Practice tabs -> one-at-a-time quiz. Math set in LaTeX via MathJax; diagrams inline SVG. */
  :root{
    --bg:#f5f7fb; --surface:#ffffff; --surface-2:#eef1f8; --fg:#1b2230; --muted:#5b6475;
    --border:#e3e7f0; --accent:#454f9c; --on-accent:#ffffff; --accent-soft:#e9ebf8;
    --correct:#1b875a; --correct-soft:#e4f3ea; --wrong:#c0392b; --wrong-soft:#fbe9e6;
    --radius:16px; --shadow:0 1px 2px rgba(20,25,45,.05),0 8px 24px rgba(20,25,45,.06);
    --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-head:"Space Grotesk","Inter",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0f131c; --surface:#171d29; --surface-2:#1e2533; --fg:#e8ecf4; --muted:#9aa4b8;
    --border:#2a3242; --accent:#9aa5ff; --on-accent:#0f131c; --accent-soft:#222b45;
    --correct:#4cc38a; --correct-soft:#15271e; --wrong:#f0897d; --wrong-soft:#2a1917;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0f131c; --surface:#171d29; --surface-2:#1e2533; --fg:#e8ecf4; --muted:#9aa4b8;
    --border:#2a3242; --accent:#9aa5ff; --on-accent:#0f131c; --accent-soft:#222b45;
    --correct:#4cc38a; --correct-soft:#15271e; --wrong:#f0897d; --wrong-soft:#2a1917;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;
    -webkit-font-smoothing:antialiased;font-size:15px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
    background:var(--surface);z-index:20}
  .app{max-width:620px;margin:0 auto;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-bottom:44px}
  .topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;
    display:flex;align-items:center;gap:10px;min-height:52px;
    background:var(--surface);border-bottom:1px solid var(--border);
    margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0 calc(-1*max(16px,env(safe-area-inset-right,0px)));
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar .brand{font-family:var(--font-head);font-weight:600;letter-spacing:.2px}
  .topbar .tag{font-size:11px;color:var(--muted);font-weight:500}
  .iconbtn{appearance:none;border:1px solid var(--border);background:var(--surface-2);
    color:var(--fg);width:34px;height:34px;border-radius:10px;font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .iconbtn:active{transform:scale(.96)}
  .themebtn{margin-left:auto;appearance:none;border:1px solid var(--border);background:var(--surface-2);color:var(--fg);font-family:var(--font-head);font-weight:600;font-size:12px;padding:7px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto}
  .themebtn:active{transform:scale(.97)}
  h1,h2,h3{font-family:var(--font-head);text-wrap:balance;margin:0}
  .brandmark{display:flex;gap:16px;justify-content:center;align-items:center;padding:16px 0 2px}
  .brandmark img{height:48px;width:auto;display:block}
  .credit{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);color:var(--muted);font-size:11.5px;line-height:1.7}
  .credit b{color:var(--fg);font-family:var(--font-head)}
  .hero{padding:22px 0 8px}
  .hero h1{font-size:25px;letter-spacing:-.3px}
  .hero p{color:var(--muted);margin:6px 0 0;font-size:14px}
  .progress-wrap{margin:16px 0 4px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
  .progress-top b{color:var(--fg);font-size:15px;font-family:var(--font-head)}
  .bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:10px}
  .bar>span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s}
  .section-label{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);
    font-weight:600;margin:22px 2px 10px}
  .cards{display:flex;flex-direction:column;gap:12px}
  .card-btn{appearance:none;text-align:left;width:100%;cursor:pointer;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;color:inherit}
  .card-btn:disabled{cursor:default;opacity:.72}
  .card-btn:not(:disabled):active{transform:translateY(1px)}
  .badge{flex:0 0 auto;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;
    justify-content:center;font-family:var(--font-head);font-weight:600;font-size:14px;
    background:var(--accent-soft);color:var(--accent)}
  .card-body{min-width:0;flex:1}
  .card-body h3{font-size:15.5px;letter-spacing:-.1px}
  .card-body p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
  .chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .chip.soon{background:var(--surface-2);color:var(--muted)}
  .chip.live{background:var(--accent);color:var(--on-accent)}
  .chip.done{background:var(--correct-soft);color:var(--correct)}
  .tabs{display:flex;gap:6px;background:var(--surface-2);padding:5px;border-radius:12px;margin:16px 0}
  .tab{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);font-weight:600;
    font-family:var(--font-head);padding:9px;border-radius:9px;cursor:pointer;font-size:14px}
  .tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
  .lesson{display:flex;flex-direction:column;gap:14px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 17px;box-shadow:var(--shadow)}
  .panel h3{font-size:16px;margin-bottom:8px;color:var(--accent)}
  .panel p{margin:8px 0}
  .panel ul{margin:8px 0;padding-left:18px}
  .panel li{margin:6px 0}
  .formula{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
    padding:10px 14px;margin:12px 0;text-align:center;overflow-x:auto;overflow-y:hidden}
  .formula mjx-container{margin:0 !important}
  .eg{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:10px 0;color:var(--fg)}
  .eg b{font-family:var(--font-head)}
  .diagram{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 10px 6px;margin:12px 0}
  .diagram svg{display:block;width:100%;height:auto;max-width:330px;margin:0 auto}
  .diagram svg text{font-family:var(--font-body)}
  .cap{font-size:12.5px;color:var(--muted);margin:8px 0 0;text-align:center}
  mjx-container{max-width:100%}
  mjx-container svg{vertical-align:middle}
  .quiz-intro{text-align:center;padding:8px 0}
  .quiz-intro .big{font-family:var(--font-head);font-size:40px;color:var(--accent);line-height:1}
  .meta-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0}
  .pill{font-size:12px;background:var(--surface-2);border:1px solid var(--border);
    padding:5px 11px;border-radius:999px;color:var(--muted)}
  .qcount{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.4px}
  .qbar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:8px 0 16px}
  .qbar>span{display:block;height:100%;background:var(--accent);transition:width .35s}
  .stimulus{background:var(--accent-soft);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;font-size:14px;margin-bottom:14px}
  .stimulus .s-label{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--accent);margin-bottom:5px}
  .stem{font-size:16px;font-weight:500;margin:4px 0 14px}
  .options{display:flex;flex-direction:column;gap:10px}
  .options.two{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;
    grid-auto-flow:column;gap:10px}
  .opt{appearance:none;text-align:left;cursor:pointer;background:var(--surface);
    border:1.5px solid var(--border);border-radius:12px;padding:12px 13px;color:inherit;
    display:flex;gap:10px;align-items:flex-start;font-size:14.5px;min-width:0;width:100%}
  .opt .lett{flex:0 0 auto;font-family:var(--font-head);font-weight:600;color:var(--muted)}
  .opt .otext{min-width:0}
  .opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .opt.correct{border-color:var(--correct);background:var(--correct-soft)}
  .opt.correct .lett{color:var(--correct)}
  .opt.wrong{border-color:var(--wrong);background:var(--wrong-soft)}
  .opt.wrong .lett{color:var(--wrong)}
  .opt:disabled{cursor:default}
  .solution{margin-top:14px;border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .solution .verdict{padding:10px 14px;font-weight:700;font-family:var(--font-head);font-size:14px}
  .solution.ok .verdict{background:var(--correct-soft);color:var(--correct)}
  .solution.no .verdict{background:var(--wrong-soft);color:var(--wrong)}
  .solution .body{padding:12px 14px;font-size:14px;background:var(--surface)}
  .cta{appearance:none;border:0;cursor:pointer;background:var(--accent);color:var(--on-accent);
    font-family:var(--font-head);font-weight:600;font-size:15px;padding:14px;border-radius:14px;
    width:100%;margin-top:16px}
  .cta:disabled{opacity:.45;cursor:default}
  .cta.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--border)}
  .result{text-align:center;padding:14px 0}
  .result .score{font-family:var(--font-head);font-size:46px;color:var(--accent);line-height:1}
  .result .pct{color:var(--muted);margin-top:4px}
  .result .msg{margin:14px auto 0;max-width:30ch}
  .foot{margin-top:26px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.6}
  .timer{margin-left:auto;font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums}
  .timer.low{color:var(--wrong)}
  .navrow{display:flex;gap:10px;margin-top:16px}
  .navrow .cta{margin-top:0;flex:1}
  .seg{display:flex;gap:6px;background:var(--surface-2);padding:5px;border-radius:12px;margin:14px 0}
  .seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);font-weight:600;font-family:var(--font-head);padding:8px;border-radius:9px;cursor:pointer;font-size:13px}
  .seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
  .review-item{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:var(--surface)}
  .review-item .rq{font-weight:500;margin-bottom:10px}
  @media (max-width:360px){.options.two{grid-template-columns:1fr;grid-auto-flow:row;
    grid-template-rows:none}}
  /* ---------- engine v2: new item types, navigator, banners, audit ---------- */
  .stimulus p{margin:0 0 6px}
  .stimulus p:last-child{margin-bottom:0}
  .qrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pchip{font-size:11px;font-weight:700;letter-spacing:.3px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border);white-space:nowrap}
  .navtoggle{appearance:none;border:1px solid var(--border);background:var(--surface-2);color:var(--fg);font-family:var(--font-head);font-weight:600;font-size:12px;padding:6px 11px;border-radius:999px;cursor:pointer;min-height:32px}
  .navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:4px 0 6px}
  .nq{appearance:none;min-height:42px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--fg);font-family:var(--font-head);font-weight:600;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums}
  .nq.full{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .nq.part{background:linear-gradient(135deg,var(--accent-soft) 50%,var(--surface) 50%);border-color:var(--accent)}
  .nq.cur{outline:2px solid var(--fg);outline-offset:1px}
  .note{font-size:12.5px;color:var(--muted);margin:8px 2px 0}
  .confirm{margin-top:12px;background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:12px 14px;font-size:14px}
  .confirm p{margin:0 0 4px}
  .update{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-top:12px;background:var(--accent-soft);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:13.5px}
  .update .cta{width:auto;margin:0;padding:8px 14px;min-height:38px;font-size:13px;flex:0 0 auto}
  .breakdown{margin:14px auto 4px;max-width:280px;text-align:left}
  .breakdown .s-label{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .bk{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px}
  .bk b{font-family:var(--font-head);font-variant-numeric:tabular-nums}
  .solution.part .verdict{background:var(--accent-soft);color:var(--accent)}
  .solution .body p{margin:0 0 8px}
  .solution .body p:last-child{margin:0}
  .why{padding-bottom:10px;margin-bottom:10px !important;border-bottom:1px solid var(--border)}
  .hint{margin-top:12px;background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:14px}
  .hint b{color:var(--accent);font-family:var(--font-head)}
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .opt{min-height:44px;font-family:inherit}
  .tbl-wrap{overflow-x:auto;margin-top:10px;border-radius:10px}
  table.data{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;background:var(--surface);width:100%}
  table.data th,table.data td{border:1px solid var(--border);padding:7px 10px;text-align:center;white-space:nowrap}
  table.data th{font-weight:600;background:var(--surface-2)}
  table.data th[scope="row"]{text-align:left}
  .fig{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;margin-top:10px}
  .fig svg{display:block;width:100%;height:auto;max-width:380px;margin:0 auto}
  .figcap{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 0}
  .fig svg text,.figopt svg text{font-family:var(--font-body);font-size:12px;fill:var(--fg)}
  svg text.muted{fill:var(--muted)}
  svg text.acc-t{fill:var(--accent);font-weight:600}
  svg .ln{stroke:var(--fg);stroke-width:1.6;fill:none}
  svg .thin{stroke-width:1}
  svg .bold{stroke-width:3}
  svg .dash{stroke:var(--muted);stroke-width:1.3;stroke-dasharray:5 4;fill:none}
  svg .dash2{stroke:var(--fg);stroke-width:1.6;stroke-dasharray:2 3;fill:none}
  svg .acc{stroke:var(--accent);stroke-width:2.6;fill:none}
  svg .fsoft{fill:var(--accent-soft)}
  svg .fsurf{fill:var(--surface-2)}
  svg .fbg{fill:var(--surface)}
  svg .gridl{stroke:var(--border);stroke-width:1}
  svg .shade{stroke:var(--accent);stroke-width:6;stroke-linecap:round}
  svg .dot-open{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
  svg .dot-closed{fill:var(--accent);stroke:var(--accent);stroke-width:2.5}
  svg .tag-c{fill:var(--surface);stroke:var(--fg);stroke-width:1.3}
  svg text.tag-t{font-family:var(--font-head);font-weight:700;font-size:12px}
  .claimcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-top:10px}
  .claimcard .who{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px}
  .claimcard .said{font-size:14.5px;font-style:italic}
  .steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .steps li{display:flex;gap:10px;align-items:baseline;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;flex-wrap:wrap}
  .steps li b{font-family:var(--font-head);font-size:12.5px;color:var(--muted);flex:0 0 52px}
  .steps li .sl{min-width:0;flex:1}
  .steps li.bad{border-color:var(--wrong);background:var(--wrong-soft)}
  .steps .fix{flex-basis:100%;padding-left:62px;color:var(--correct);font-weight:500;font-size:13.5px}
  .figopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .figopt{appearance:none;cursor:pointer;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:8px 8px 6px;color:inherit;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;font:inherit}
  .figopt .lett{font-family:var(--font-head);font-weight:600;color:var(--muted);font-size:13px}
  .figopt svg{width:100%;height:auto;display:block}
  .figopt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .figopt.correct{border-color:var(--correct);background:var(--correct-soft)}
  .figopt.wrong{border-color:var(--wrong);background:var(--wrong-soft)}
  .figopt:disabled{cursor:default}
  @media (max-width:560px){.figopts{grid-template-columns:1fr}}
  .hs{cursor:pointer}
  .hs .hit{fill:transparent}
  .hs .hsdot{fill:var(--surface);stroke:var(--accent);stroke-width:2.2}
  .fig .hs text{font-family:var(--font-head);font-weight:700;font-size:13px;fill:var(--accent)}
  .hs.sel .hsdot{fill:var(--accent)} .hs.sel text{fill:var(--on-accent)}
  .hs.right .hsdot{fill:var(--correct);stroke:var(--correct)} .hs.right text{fill:var(--on-accent)}
  .hs.miss .hsdot{fill:var(--wrong);stroke:var(--wrong)} .hs.miss text{fill:var(--on-accent)}
  .hs:focus{outline:none} .hs:focus-visible .hsdot{stroke-width:4.5}
  .hsbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .hsbtns .opt{justify-content:center;padding:10px 4px;font-family:var(--font-head);font-weight:600;font-size:13.5px}
  .grows{display:flex;flex-direction:column;gap:10px}
  .grow{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:12px 13px;display:flex;flex-direction:column;gap:10px}
  .grow .gtext{font-size:14.5px;min-width:0}
  .grow .gtext b{font-family:var(--font-head);color:var(--muted)}
  .pills{display:flex;gap:6px}
  .pills button{flex:1;appearance:none;min-height:44px;border:1.5px solid var(--border);background:var(--surface-2);color:var(--fg);border-radius:10px;font-family:var(--font-head);font-weight:600;font-size:13px;cursor:pointer;padding:6px 4px}
  .pills button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .pills button:disabled{cursor:default}
  .grow.ok,.mrow.ok{border-color:var(--correct)} .grow.no,.mrow.no{border-color:var(--wrong)}
  .rowfb{font-size:13px}
  .rowfb .mark{font-weight:700;font-family:var(--font-head)}
  .grow.ok .mark,.mrow.ok .mark{color:var(--correct)} .grow.no .mark,.mrow.no .mark{color:var(--wrong)}
  @media (min-width:560px){.grow{flex-direction:row;align-items:center;flex-wrap:wrap}.grow .gtext{flex:1 1 240px}.pills{flex:0 0 250px}.rowfb{flex-basis:100%}}
  .mrows{display:flex;flex-direction:column;gap:10px}
  .mrow{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:12px 13px}
  .mrow label{font-weight:600;font-family:var(--font-head);font-size:14px}
  .mrow select{font:inherit;font-size:16px;min-height:46px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface-2);color:var(--fg);padding:8px 10px;width:100%}
  .numrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

  .numrow input:disabled{opacity:.8}
  .numrow .unit{font-size:16px;color:var(--muted);font-weight:600}
  .negbtn{appearance:none;min-width:48px;min-height:52px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface-2);color:var(--fg);font-family:var(--font-head);font-weight:700;font-size:20px;cursor:pointer}
  textarea{font:inherit;font-size:16px;width:100%;min-height:130px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--fg);padding:12px;resize:vertical}
  .counter{font-size:12px;color:var(--muted);text-align:right;margin-top:4px;font-variant-numeric:tabular-nums}
  .model{background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px}
  .model h3{font-size:14px;margin:0 0 6px}
  .model p{margin:0 0 8px}
  .checklist{display:flex;flex-direction:column;gap:8px;margin-top:8px}

  .checklist input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent);flex:0 0 auto}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .audit h2{font-size:18px;margin:22px 0 8px}
  .audit h3{font-size:14px;margin:16px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .aitem{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--surface);font-size:13.5px;break-inside:avoid}

  .pnum{font-family:var(--font-head);font-weight:700;min-width:26px}
  .pbody{flex:1;min-width:0}
  .pstim{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;background:var(--surface-2)}

  .pstem{font-weight:500;margin-bottom:4px}

  .pfig svg text{font-family:var(--font-body);font-size:12px;fill:var(--fg)}
  .pgrid{border-collapse:collapse;width:100%;font-size:13px}
  .pgrid th,.pgrid td{border:1px solid var(--border);padding:5px 8px;text-align:left}
  .pgrid td.box{text-align:center;width:64px;font-size:16px}
  .pline{margin:6px 0}
  .scols{columns:2;column-gap:24px}
  .sline{break-inside:avoid;margin:0 0 8px;font-size:13px}
  .bub{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1.3px solid var(--fg);border-radius:50%;font-size:11px;margin-right:4px}
  .bub.w{width:auto;border-radius:999px;padding:0 6px}
  .pkey{border-collapse:collapse;width:100%;font-size:12.5px}
  .pkey th,.pkey td{border:1px solid var(--border);padding:4px 6px;text-align:left}

  }

  /* ---------- lessons ---------- */
  var LESSONS={
    g9q1:[
      {h:'What is a quadratic equation?',html:
        '<p>A <b>quadratic equation</b> is a second-degree equation in one variable. Its standard form is</p>'+
        '<div class="formula">\\[ax^2 + bx + c = 0, \\quad a \\neq 0\\]</div>'+
        '<p>The highest power of the variable is 2. If \\(a = 0\\) the equation is only linear, which is why \\(a \\neq 0\\) is required.</p>'},
      {h:'Four ways to solve',html:
        '<ul><li><b>Extracting square roots</b> - best when there is no middle term. For \\(x^2 = k\\), the solutions are \\(x = \\pm\\sqrt{k}\\).</li>'+
        '<li><b>Factoring</b> - write the equation as a product equal to 0, then set each factor to 0.</li>'+
        '<li><b>Completing the square</b> - turn the left side into a perfect square trinomial, then take square roots.</li>'+
        '<li><b>Quadratic formula</b> - works for every quadratic:</li></ul>'+
        '<div class="formula">\\[x = \\dfrac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}\\]</div>'},
      {h:'The discriminant',html:
        '<p>The value \\(D = b^2 - 4ac\\) (the expression inside the square root) tells the nature of the roots before you solve:</p>'+
        '<ul><li>\\(D > 0\\): two real and <i>unequal</i> roots; the parabola crosses the x-axis twice.</li>'+
        '<li>\\(D = 0\\): two real and <i>equal</i> roots; the parabola touches the x-axis at one point.</li>'+
        '<li>\\(D < 0\\): <i>no real</i> roots; the parabola never meets the x-axis.</li></ul>'},
      {h:'Quadratic functions',html:
        '<p>A <b>quadratic function</b> \\(y = ax^2 + bx + c\\) graphs as a <b>parabola</b>. In <b>vertex form</b></p>'+
        '<div class="formula">\\[y = a(x - h)^2 + k\\]</div>'+
        '<p>the <b>vertex</b> is \\((h,\\ k)\\) and the <b>axis of symmetry</b> is \\(x = h\\). The parabola <b>opens up</b> when \\(a > 0\\) and <b>opens down</b> when \\(a < 0\\).</p>'+DG_PARAB+cap('A parabola that opens up (\\(a > 0\\)). The vertex is its lowest point, and the dashed line \\(x = h\\) is the axis of symmetry.')},
      {h:'Worked examples',html:
        '<div class="eg"><b>Example 1. Solve \\(2x^2 + 3x + 1 = 0\\) using the quadratic formula.</b>'+
        '<p><b>Solution.</b>Identify \\(a = 2\\), \\(b = 3\\), \\(c = 1\\).</p>'+
        '<p>Compute the discriminant: \\(D = b^2 - 4ac = 3^2 - 4(2)(1) = 9 - 8 = 1\\).</p>'+
        '<p>Substitute into the formula:</p>'+
        '<div class="formula">\\[x = \\dfrac{-3 \\pm \\sqrt{1}}{2(2)} = \\dfrac{-3 \\pm 1}{4}\\]</div>'+
        '<p>Split the \\(\\pm\\): \\(x = \\dfrac{-3 + 1}{4} = -\\dfrac{1}{2}\\) or \\(x = \\dfrac{-3 - 1}{4} = -1\\).</p></div>'+
        '<div class="eg"><b>Example 2. Solve \\(x^2 + 2x - 15 = 0\\) by factoring.</b>'+
        '<p><b>Solution.</b>Find two numbers that multiply to \\(-15\\) and add to \\(+2\\): they are \\(+5\\) and \\(-3\\).</p>'+
        '<p>Factor: \\((x + 5)(x - 3) = 0\\).</p>'+
        '<p>Set each factor equal to 0: \\(x + 5 = 0\\) or \\(x - 3 = 0\\).</p>'+
        '<p>So \\(x = -5\\) or \\(x = 3\\).</p></div>'+
        '<div class="eg"><b>Example 3. Find the vertex of \\(y = x^2 - 4x + 1\\).</b>'+
        '<p><b>Solution.</b>The x-coordinate of the vertex is \\(h = -\\dfrac{b}{2a} = -\\dfrac{-4}{2(1)} = 2\\).</p>'+
        '<p>Substitute to find \\(k\\): \\(k = (2)^2 - 4(2) + 1 = 4 - 8 + 1 = -3\\).</p>'+
        '<p>The vertex is \\((2,\\ -3)\\), the axis of symmetry is \\(x = 2\\), and since \\(a > 0\\) the parabola opens up, so this is a minimum.</p></div>'}
    ],
    g9q2:[
      {h:'Four kinds of variation',html:
        '<ul><li><b>Direct:</b> \\(y = kx\\). As \\(x\\) increases, \\(y\\) increases.</li>'+
        '<li><b>Inverse:</b> \\(y = \\dfrac{k}{x}\\). As \\(x\\) increases, \\(y\\) decreases.</li>'+
        '<li><b>Joint:</b> \\(z = kxy\\). One quantity varies as the product of two others.</li>'+
        '<li><b>Combined:</b> \\(z = \\dfrac{kx}{y}\\). Direct and inverse together.</li></ul>'+
        '<p>\\(k\\) is the <b>constant of variation</b>. Find it by substituting a known pair of values.</p>'+DG_DIR+cap('Direct variation \\(y = kx\\) graphs as a straight line through the origin.')},
      {h:'Exponents',html:
        '<ul><li><b>Zero exponent:</b> \\(a^0 = 1\\) (for \\(a \\neq 0\\)).</li>'+
        '<li><b>Negative exponent:</b> \\(a^{-n} = \\dfrac{1}{a^n}\\).</li>'+
        '<li><b>Rational exponent:</b> \\(a^{\\frac{m}{n}} = \\sqrt[n]{a^m}\\).</li></ul>'},
      {h:'Radicals and their laws',html:
        '<ul><li>\\(\\sqrt{a}\\,\\sqrt{b} = \\sqrt{ab}\\)</li>'+
        '<li>\\(\\dfrac{\\sqrt{a}}{\\sqrt{b}} = \\sqrt{\\dfrac{a}{b}}\\)</li>'+
        '<li>Simplify by pulling out perfect squares: \\(\\sqrt{50} = \\sqrt{25 \\cdot 2} = 5\\sqrt{2}\\).</li></ul>'},
      {h:'Worked examples',html:
        '<div class="eg"><b>Example 1. If \\(y\\) varies inversely as \\(x\\), and \\(y = 6\\) when \\(x = 4\\), find \\(y\\) when \\(x = 3\\).</b>'+
        '<p><b>Solution.</b>Write the model: \\(y = \\dfrac{k}{x}\\).</p>'+
        '<p>Find \\(k\\) from the given pair: \\(k = xy = 4 \\times 6 = 24\\).</p>'+
        '<p>So \\(y = \\dfrac{24}{x}\\). When \\(x = 3\\): \\(y = \\dfrac{24}{3} = 8\\).</p></div>'+
        '<div class="eg"><b>Example 2. \\(z\\) varies jointly as \\(x\\) and \\(y\\). If \\(z = 36\\) when \\(x = 3\\) and \\(y = 2\\), find \\(z\\) when \\(x = 5\\) and \\(y = 4\\).</b>'+
        '<p><b>Solution.</b>Joint variation: \\(z = kxy\\).</p>'+
        '<p>Find \\(k\\): \\(k = \\dfrac{z}{xy} = \\dfrac{36}{3 \\times 2} = 6\\).</p>'+
        '<p>So \\(z = 6xy = 6(5)(4) = 120\\).</p></div>'+
        '<div class="eg"><b>Example 3. Simplify \\(2\\sqrt{18} + \\sqrt{8}\\).</b>'+
        '<p><b>Solution.</b>\\(\\sqrt{18} = \\sqrt{9 \\cdot 2} = 3\\sqrt{2}\\), so \\(2\\sqrt{18} = 6\\sqrt{2}\\).</p>'+
        '<p>\\(\\sqrt{8} = \\sqrt{4 \\cdot 2} = 2\\sqrt{2}\\).</p>'+
        '<p>Add the like radicals: \\(6\\sqrt{2} + 2\\sqrt{2} = 8\\sqrt{2}\\).</p></div>'+
        '<div class="eg"><b>Example 4. Evaluate \\(27^{\\frac{2}{3}}\\).</b>'+
        '<p><b>Solution.</b>Rewrite with a root: \\(27^{\\frac{2}{3}} = \\left(\\sqrt[3]{27}\\right)^2\\).</p>'+
        '<p>Since \\(\\sqrt[3]{27} = 3\\), the value is \\(3^2 = 9\\).</p></div>'}
    ],
    g9q3:[
      {h:'Parallelogram properties',html:
        '<ul><li>Opposite sides are parallel and congruent.</li>'+
        '<li>Opposite angles are congruent.</li>'+
        '<li>Consecutive angles are supplementary (they add to \\(180^\\circ\\)).</li>'+
        '<li>The diagonals bisect each other.</li></ul>'+DG_PAR+cap('In parallelogram \\(ABCD\\), opposite sides are parallel and congruent, and opposite angles are equal.')},
      {h:'Special parallelograms',html:
        '<ul><li><b>Rectangle:</b> four right angles; diagonals are congruent.</li>'+
        '<li><b>Rhombus:</b> four congruent sides; diagonals are perpendicular.</li>'+
        '<li><b>Square:</b> both a rectangle and a rhombus.</li></ul>'},
      {h:'Midline, trapezoid, kite',html:
        '<ul><li><b>Midline theorem:</b> the segment joining the midpoints of two sides of a triangle is parallel to the third side and half its length.</li>'+
        '<li><b>Trapezoid median:</b> equal to the average of the two bases, \\(\\dfrac{b_1 + b_2}{2}\\).</li>'+
        '<li><b>Kite:</b> two pairs of consecutive congruent sides; its diagonals are perpendicular.</li></ul>'},
      {h:'Similar triangles',html:
        '<p>Similar figures have <b>congruent corresponding angles</b> and <b>proportional corresponding sides</b>. Three ways to prove triangles similar:</p>'+
        '<ul><li><b>AA</b> - two pairs of angles congruent.</li>'+
        '<li><b>SAS</b> - two sides proportional and the included angle congruent.</li>'+
        '<li><b>SSS</b> - all three pairs of sides proportional.</li></ul>'+
        '<p>For right triangles, the <b>Pythagorean theorem</b> holds: \\(a^2 + b^2 = c^2\\), where \\(c\\) is the hypotenuse.</p>'},
      {h:'Worked examples',html:
        '<div class="eg"><b>Example 1. \\(\\triangle ABC \\sim \\triangle DEF\\) with \\(\\dfrac{AB}{DE} = \\dfrac{3}{5}\\). If \\(AB = 9\\), find \\(DE\\).</b>'+
        '<p><b>Solution.</b>Corresponding sides are proportional: \\(\\dfrac{9}{DE} = \\dfrac{3}{5}\\).</p>'+
        '<p>Cross-multiply: \\(3 \\cdot DE = 9 \\cdot 5 = 45\\).</p>'+
        '<p>So \\(DE = \\dfrac{45}{3} = 15\\).</p></div>'+
        '<div class="eg"><b>Example 2. One angle of a parallelogram measures \\(115^\\circ\\). Find the other three angles.</b>'+
        '<p><b>Solution.</b>The opposite angle is congruent: \\(115^\\circ\\).</p>'+
        '<p>Each consecutive angle is supplementary: \\(180^\\circ - 115^\\circ = 65^\\circ\\).</p>'+
        '<p>The four angles are \\(115^\\circ,\\ 65^\\circ,\\ 115^\\circ,\\ 65^\\circ\\).</p></div>'+
        '<div class="eg"><b>Example 3. A 1.5 m tall student casts a 2 m shadow. At the same time a flagpole casts a 10 m shadow. How tall is the flagpole?</b>'+
        '<p><b>Solution.</b>The student and the pole form similar right triangles, so heights and shadows are proportional: \\(\\dfrac{h}{10} = \\dfrac{1.5}{2}\\).</p>'+
        '<p>Cross-multiply: \\(2h = 1.5 \\times 10 = 15\\).</p>'+
        '<p>So \\(h = \\dfrac{15}{2} = 7.5\\) m.</p></div>'+
        '<div class="eg"><b>Example 4. A right triangle has legs 5 and 12. Find the hypotenuse.</b>'+
        '<p><b>Solution.</b>Pythagorean theorem: \\(c^2 = 5^2 + 12^2 = 25 + 144 = 169\\).</p>'+
        '<p>So \\(c = \\sqrt{169} = 13\\).</p></div>'}
    ],
    g9q4:[
      {h:'The six trigonometric ratios',html:
        '<p>For an acute angle \\(\\theta\\) in a right triangle, remember <b>SOH-CAH-TOA</b>:</p>'+
        '<div class="formula">\\[\\sin\\theta = \\dfrac{\\text{opp}}{\\text{hyp}},\\quad \\cos\\theta = \\dfrac{\\text{adj}}{\\text{hyp}},\\quad \\tan\\theta = \\dfrac{\\text{opp}}{\\text{adj}}\\]</div>'+
        '<p>The reciprocals are \\(\\csc\\theta = \\dfrac{\\text{hyp}}{\\text{opp}}\\), \\(\\sec\\theta = \\dfrac{\\text{hyp}}{\\text{adj}}\\), and \\(\\cot\\theta = \\dfrac{\\text{adj}}{\\text{opp}}\\).</p>'+DG_RIGHT+cap('The sides are named relative to angle \\(\\theta\\): opposite, adjacent, and the hypotenuse.')},
      {h:'Special angles',html:
        '<ul><li>\\(\\sin 30^\\circ = \\dfrac{1}{2}\\), \\(\\cos 30^\\circ = \\dfrac{\\sqrt{3}}{2}\\)</li>'+
        '<li>\\(\\sin 45^\\circ = \\cos 45^\\circ = \\dfrac{\\sqrt{2}}{2}\\), \\(\\tan 45^\\circ = 1\\)</li>'+
        '<li>\\(\\sin 60^\\circ = \\dfrac{\\sqrt{3}}{2}\\), \\(\\cos 60^\\circ = \\dfrac{1}{2}\\)</li></ul>'},
      {h:'Angles of elevation and depression',html:
        '<p>The <b>angle of elevation</b> is measured upward from the horizontal to the line of sight; the <b>angle of depression</b> is measured downward. Between the same two points these angles are equal, because they are alternate interior angles.</p>'},
      {h:'Worked examples',html:
        '<div class="eg"><b>Example 1. From 10 m away on level ground, the angle of elevation to the top of a flagpole is \\(45^\\circ\\). How tall is the pole (from eye level)?</b>'+
        '<p><b>Solution.</b>Use tangent: \\(\\tan 45^\\circ = \\dfrac{\\text{opposite}}{\\text{adjacent}} = \\dfrac{h}{10}\\).</p>'+
        '<p>Since \\(\\tan 45^\\circ = 1\\): \\(1 = \\dfrac{h}{10}\\), so \\(h = 10\\) m.</p></div>'+
        '<div class="eg"><b>Example 2. In a right triangle, angle \\(\\theta = 30^\\circ\\) and the hypotenuse is 20. Find the side opposite \\(\\theta\\).</b>'+
        '<p><b>Solution.</b>Use sine: \\(\\sin 30^\\circ = \\dfrac{\\text{opposite}}{\\text{hypotenuse}} = \\dfrac{\\text{opp}}{20}\\).</p>'+
        '<p>Since \\(\\sin 30^\\circ = \\dfrac{1}{2}\\): \\(\\text{opp} = 20 \\times \\dfrac{1}{2} = 10\\).</p></div>'+
        '<div class="eg"><b>Example 3. In a right triangle, angle \\(\\theta = 60^\\circ\\) and the hypotenuse is 10. Find the side adjacent to \\(\\theta\\).</b>'+
        '<p><b>Solution.</b>Use cosine: \\(\\cos 60^\\circ = \\dfrac{\\text{adjacent}}{\\text{hypotenuse}} = \\dfrac{\\text{adj}}{10}\\).</p>'+
        '<p>Since \\(\\cos 60^\\circ = \\dfrac{1}{2}\\): \\(\\text{adj} = 10 \\times \\dfrac{1}{2} = 5\\).</p></div>'}
    ],
    g10t1:[
      {h:'Grade 10 Term 1 competencies',html:'<p>By the end of Term 1, you should be able to:</p><ul><li>Apply the <b>Law of Sines</b> to solve oblique triangles, including the ambiguous case.</li><li>Apply the <b>Law of Cosines</b> to solve oblique triangles.</li><li>Solve real-life problems involving the laws of sines and cosines, including <b>bearings</b>.</li><li>Describe the position of points and perform <b>translations, reflections, and rotations</b> in the Cartesian plane using coordinates.</li><li>Illustrate and solve <b>quadratic inequalities</b> in one and two variables, and determine the region of solutions.</li><li>Solve <b>absolute value equations and inequalities</b> in one variable and write solutions in various notations.</li><li>Illustrate and calculate <b>measures of position</b> (quartiles, deciles, percentiles), the interquartile range, and outliers.</li><li>Construct and interpret <b>box-and-whisker plots</b> and cumulative frequency histograms and polygons.</li><li>Calculate the <b>percentile rank</b> of a score and draw conclusions from statistical data.</li></ul>'},
      {h:'Oblique triangles: Laws of Sines and Cosines',html:
        '<p>An <b>oblique triangle</b> has no right angle. Use the <b>Law of Sines</b> when you know two angles and a side (AAS or ASA):</p>'+
        '<div class="formula">\\[\\dfrac{a}{\\sin A} = \\dfrac{b}{\\sin B} = \\dfrac{c}{\\sin C}\\]</div>'+
        '<p>Use the <b>Law of Cosines</b> for two sides and the included angle (SAS) or all three sides (SSS):</p>'+
        '<div class="formula">\\[c^2 = a^2 + b^2 - 2ab\\cos C\\]</div>'+'<p>The <b>ambiguous case</b> (SSA) can give two, one, or no triangles. For <b>bearings</b> problems (directions measured from north), sketch the triangle first, then choose the correct law.</p>'+DG_OBL+cap('Side \\(a\\) is opposite angle \\(A\\), side \\(b\\) opposite \\(B\\), and side \\(c\\) opposite \\(C\\).')},
      {h:'Transformations in the Cartesian plane',html:
        '<ul><li><b>Translation</b> (slide): \\((x, y) \\to (x + h,\\ y + k)\\).</li>'+
        '<li><b>Reflection</b> over the x-axis: \\((x, y) \\to (x,\\ -y)\\); over the y-axis: \\((x, y) \\to (-x,\\ y)\\).</li>'+
        '<li><b>Rotation</b> of \\(180^\\circ\\) about the origin: \\((x, y) \\to (-x,\\ -y)\\).</li></ul>'},
      {h:'Quadratic and absolute value inequalities',html:
        '<ul><li>\\(|x| < a\\) means \\(-a < x < a\\).</li>'+
        '<li>\\(|x| > a\\) means \\(x < -a\\) or \\(x > a\\).</li>'+
        '<li>\\(x^2 < a^2\\) means \\(-a < x < a\\); \\(x^2 > a^2\\) means \\(x < -a\\) or \\(x > a\\).</li></ul>'},
      {h:'Measures of position',html:
        '<p><b>Quartiles</b> split ordered data into four equal parts: \\(Q_1\\), \\(Q_2\\) (the median), and \\(Q_3\\). <b>Deciles</b> split it into 10 parts and <b>percentiles</b> into 100 parts. The <b>interquartile range</b> is \\(IQR = Q_3 - Q_1\\). A value is an <b>outlier</b> if it lies more than \\(1.5 \\times IQR\\) below \\(Q_1\\) or above \\(Q_3\\). The <b>percentile rank</b> of a score is the percent of values below it. Data can be shown with a <b>box-and-whisker plot</b> or a <b>cumulative frequency</b> histogram or polygon.</p>'+DG_BOX+cap('A box-and-whisker plot shows the minimum, \\(Q_1\\), median, \\(Q_3\\), and maximum.')},
      {h:'Worked examples',html:
        '<div class="eg"><b>Example 1 (Law of Sines). In \\(\\triangle ABC\\), \\(A = 40^\\circ\\), \\(B = 60^\\circ\\), and \\(a = 10\\). Find \\(b\\).</b>'+
        '<p><b>Solution.</b>Law of Sines: \\(\\dfrac{a}{\\sin A} = \\dfrac{b}{\\sin B}\\).</p>'+
        '<p>Solve for \\(b\\): \\(b = \\dfrac{a \\sin B}{\\sin A} = \\dfrac{10 \\sin 60^\\circ}{\\sin 40^\\circ}\\).</p>'+
        '<p>Evaluate: \\(b \\approx \\dfrac{10(0.866)}{0.643} \\approx 13.5\\).</p></div>'+
        '<div class="eg"><b>Example 2 (Law of Cosines). A triangle has sides \\(a = 5\\) and \\(b = 7\\) with included angle \\(C = 60^\\circ\\). Find side \\(c\\).</b>'+
        '<p><b>Solution.</b>Law of Cosines: \\(c^2 = a^2 + b^2 - 2ab\\cos C\\).</p>'+
        '<p>Substitute: \\(c^2 = 5^2 + 7^2 - 2(5)(7)\\cos 60^\\circ = 25 + 49 - 70(0.5)\\).</p>'+
        '<p>\\(c^2 = 74 - 35 = 39\\), so \\(c = \\sqrt{39} \\approx 6.24\\).</p></div>'+
        '<div class="eg"><b>Example 3 (Transformations). The point \\(P(3, 4)\\) is translated by \\((x - 2,\\ y + 5)\\), then reflected over the x-axis. Find its final position.</b>'+
        '<p><b>Solution.</b>Translate: \\((3 - 2,\\ 4 + 5) = (1,\\ 9)\\).</p>'+
        '<p>Reflect over the x-axis (negate \\(y\\)): \\((1,\\ -9)\\).</p></div>'+
        '<div class="eg"><b>Example 4 (Quadratic inequality). Solve \\(x^2 - x - 6 \\le 0\\).</b>'+
        '<p><b>Solution.</b>Factor: \\((x - 3)(x + 2) \\le 0\\). The boundary values are \\(x = -2\\) and \\(x = 3\\).</p>'+
        '<p>The product is zero or negative between the roots.</p>'+
        '<p>Solution: \\(-2 \\le x \\le 3\\).</p></div>'+
        '<div class="eg"><b>Example 5 (Absolute value inequality). Solve \\(|2x - 1| < 5\\).</b>'+
        '<p><b>Solution.</b>Remove the bars: \\(-5 < 2x - 1 < 5\\).</p>'+
        '<p>Add 1 to all parts: \\(-4 < 2x < 6\\).</p>'+
        '<p>Divide by 2: \\(-2 < x < 3\\).</p></div>'+
        '<div class="eg"><b>Example 6 (Measures of position). For the ordered data \\(4,\\ 7,\\ 8,\\ 10,\\ 12,\\ 15,\\ 18,\\ 20\\), find \\(Q_1\\), the median, \\(Q_3\\), and the IQR.</b>'+
        '<p><b>Solution.</b>There are 8 values; the median is the average of the 4th and 5th: \\(\\dfrac{10 + 12}{2} = 11\\).</p>'+
        '<p>Lower half \\(4, 7, 8, 10\\): \\(Q_1 = \\dfrac{7 + 8}{2} = 7.5\\).</p>'+
        '<p>Upper half \\(12, 15, 18, 20\\): \\(Q_3 = \\dfrac{15 + 18}{2} = 16.5\\).</p>'+
        '<p>\\(IQR = Q_3 - Q_1 = 16.5 - 7.5 = 9\\).</p></div>'+
        '<div class="eg"><b>Example 7 (Percentile rank). In a class of 20, a student scored higher than 15 classmates. What is the student&rsquo;s percentile rank?</b>'+
        '<p><b>Solution.</b>Percentile rank \\(= \\dfrac{\\text{number of scores below}}{\\text{total}} \\times 100\\).</p>'+
        '<p>\\(= \\dfrac{15}{20} \\times 100 = 75\\). The student is at the 75th percentile.</p></div>'}
    ]
  };
