    g9q2:[
      {title:'Start',level:'Warm-up and core skills',items:[
        {id:'P-g9q2-1-1',two:false,stem:'A Marikina tricycle charges a fixed rate for each kilometer, so fare \\(= k \\cdot d\\). This is an example of:',opts:['Direct variation','Inverse variation','Joint variation','No variation'],a:0,sol:'Fare rises in proportion to distance: direct variation.',proc:'formulate',band:'entry',comp:'M9AL-IIa-1'},
        {id:'P-g9q2-1-2',two:false,stem:'The more volunteers pack relief goods after a Marikina flood, the less time the job takes. Time compared with the number of volunteers is:',opts:['Direct variation','Inverse variation','Joint variation','Combined variation'],a:1,sol:'More volunteers means less time, so time varies inversely with the number of volunteers.',proc:'formulate',band:'entry',comp:'M9AL-IIa-1'},
        {id:'P-g9q2-1-3',two:true,stim:'A square courtyard at a Marikina school has area \\(50\\ \\text{m}^2\\), so its side is \\(\\sqrt{50}\\).',stem:'Simplified, the side length is:',opts:['\\(25\\sqrt{2}\\)','\\(2\\sqrt{5}\\)','\\(5\\sqrt{2}\\)','\\(10\\sqrt{5}\\)'],a:2,sol:'\\(\\sqrt{50} = \\sqrt{25 \\cdot 2} = 5\\sqrt{2}\\).',proc:'employ',band:'basic',comp:'M9AL-IIg-1'},
        {id:'P-g9q2-1-4',two:true,stem:'Simplify \\(2^{-3}\\).',opts:['\\(-8\\)','\\(-6\\)','\\(6\\)','\\(\\dfrac{1}{8}\\)'],a:3,sol:'\\(2^{-3} = \\dfrac{1}{2^3} = \\dfrac{1}{8}\\).',proc:'employ',band:'entry',comp:'M9AL-IId-1'},
        {id:'P-g9q2-1-5',two:true,stim:'A Marikina shoe-supply shop sells shoelace cord by the meter (sample prices). The cost \\(C\\) varies directly as the length \\(L\\). A 6-meter cord costs ₱54.',stem:'What is the constant of variation \\(k\\), in pesos per meter?',opts:['\\(\\dfrac{1}{9}\\)','\\(48\\)','\\(9\\)','\\(324\\)'],a:2,sol:'Direct variation means \\(C = kL\\), so \\(k = \\dfrac{C}{L} = \\dfrac{54}{6} = 9\\). Dividing the other way gives \\(\\dfrac{6}{54} = \\dfrac{1}{9}\\), which is meters per peso, not pesos per meter. The cord costs ₱9 per meter.',proc:'employ',band:'basic',comp:'M9AL-IIb-c-1'},
        {id:'P-g9q2-1-6',two:true,stem:'Which expression equals \\(\\sqrt[3]{x}\\)?',opts:['\\(x^3\\)','\\(x^{\\frac{1}{3}}\\)','\\(x^{-\\frac{1}{3}}\\)','\\(3x\\)'],a:1,sol:'A cube root is a one-third power.',proc:'employ',band:'entry',comp:'M9AL-IIf-1'}
      ]},
      {title:'Build',level:'Apply and model',items:[
        {id:'P-g9q2-2-1',two:true,stim:'Packing Marikina flood-relief bags, the time \\(t\\) (hours) varies inversely as the number of volunteers \\(n\\). With 4 volunteers it takes 6 hours.',stem:'Which equation models the time?',opts:['\\(t = \\dfrac{24}{n}\\)','\\(t = 24n\\)','\\(t = \\dfrac{n}{24}\\)','\\(t = 6n\\)'],a:0,sol:'\\(t = \\dfrac{k}{n}\\), and \\(k = tn = 6 \\times 4 = 24\\).',proc:'formulate',band:'basic',comp:'M9AL-IIb-c-1'},
        {id:'P-g9q2-2-2',two:true,stim:'Packing Marikina flood-relief bags, the time \\(t\\) (hours) varies inversely as the number of volunteers \\(n\\). With 4 volunteers it takes 6 hours.',stem:'How long will it take with 8 volunteers?',opts:['\\(6\\) h','\\(3\\) h','\\(12\\) h','\\(2\\) h'],a:1,sol:'\\(t = \\dfrac{24}{8} = 3\\) hours.',proc:'employ',band:'standard',comp:'M9AL-IIb-c-1'},
        {id:'P-g9q2-2-3',two:true,stem:'Simplify \\(\\sqrt{8} \\cdot \\sqrt{2}\\) for a tile-area computation.',opts:['\\(\\sqrt{10}\\)','\\(16\\)','\\(4\\)','\\(2\\sqrt{2}\\)'],a:2,sol:'\\(\\sqrt{8}\\cdot\\sqrt{2} = \\sqrt{16} = 4\\).',proc:'employ',band:'basic',comp:'M9AL-IIh-1'},
        {id:'P-g9q2-2-4',two:true,stim:'A Marikina sales clerk&rsquo;s pay varies directly as hours worked; 4 hours pays 500 pesos.',stem:'How much is earned for 10 hours (in pesos)?',opts:['\\(2000\\)','\\(200\\)','\\(540\\)','\\(1250\\)'],a:3,sol:'Rate \\(= \\dfrac{500}{4} = 125\\); \\(125 \\times 10 = 1250\\) pesos.',proc:'employ',band:'standard',comp:'M9AL-IIb-c-1'},
        {id:'P-g9q2-2-5',two:true,stim:'In a Marikina shoe shop, the number of insoles cut \\(z\\) varies jointly as the number of workers \\(x\\) and the hours worked \\(y\\). Two workers cut 30 insoles in 3 hours.',stem:'How many insoles can 4 workers cut in 5 hours?',opts:['\\(100\\)','\\(60\\)','\\(20\\)','\\(120\\)'],a:0,sol:'Joint variation means \\(z = kxy\\), so \\(k = \\dfrac{30}{2 \\times 3} = 5\\) insoles per worker per hour, and \\(z = 5(4)(5) = 100\\). Scaling only for the extra workers gives 60, which ignores the longer hours, and \\(4 \\times 5 = 20\\) forgets the constant \\(k\\). Four workers can cut 100 insoles in 5 hours.',proc:'employ',band:'standard',comp:'M9AL-IIb-c-1'},
        {id:'P-g9q2-2-6',two:true,stem:'Rationalize \\(\\dfrac{3}{\\sqrt{3}}\\) for a measurement.',opts:['\\(1\\)','\\(\\sqrt{3}\\)','\\(3\\)','\\(3\\sqrt{3}\\)'],a:1,sol:'\\(\\dfrac{3}{\\sqrt{3}} \\cdot \\dfrac{\\sqrt{3}}{\\sqrt{3}} = \\dfrac{3\\sqrt{3}}{3} = \\sqrt{3}\\).',proc:'employ',band:'basic',comp:'M9AL-IIg-1'}
      ]},
      {title:'Challenge',level:'Interpret and reason',items:[
        {id:'P-g9q2-3-1',two:false,stim:'Rico tests a bicycle pump at a Marikina bike-lane repair stand. He blocks the hose so no air can escape. For the trapped air, pressure \\(P\\) and volume \\(V\\) follow \\(PV = k\\). At \\(400\\ \\text{mL}\\), the air pressure is \\(100\\ \\text{kPa}\\).',stem:'Rico says that pushing the handle until the air is at \\(200\\ \\text{mL}\\) halves the pressure to \\(50\\ \\text{kPa}\\). Which evaluation is correct?',opts:['Wrong; \\(PV\\) stays the same, so at \\(200\\ \\text{mL}\\) the pressure doubles to \\(200\\ \\text{kPa}\\)','Wrong; halving the volume makes the pressure four times as large, \\(400\\ \\text{kPa}\\)','Correct; pressure and volume always change in the same direction','Correct; \\(200\\) is half of \\(400\\), so the pressure is also halved'],a:0,sol:'For the trapped air, \\(k = PV = 100 \\times 400 = 40\\,000\\), so at \\(200\\ \\text{mL}\\) the pressure is \\(P = \\dfrac{40\\,000}{200} = 200\\ \\text{kPa}\\). Halving the volume doubles the pressure; it does not halve it, and it does not make it four times as large. Rico&rsquo;s claim is wrong: the air pressure would be \\(200\\ \\text{kPa}\\).',proc:'interpret',band:'standard',comp:'M9AL-IIb-c-1'},
        {id:'P-g9q2-3-2',two:false,stim:'Rico tests a bicycle pump at a Marikina bike-lane repair stand. He blocks the hose so no air can escape. For the trapped air, pressure \\(P\\) and volume \\(V\\) follow \\(PV = k\\). At \\(400\\ \\text{mL}\\), the air pressure is \\(100\\ \\text{kPa}\\).',stem:'Later the hose block slips, so some air escapes as Rico pushes. Which statement about the model \\(PV = k\\) is correct?',opts:['It no longer fits, because \\(k\\) stays fixed only when the amount of air stays fixed','It still fits, because \\(k\\) is a constant and can never change','It still fits, because the pressure was first \\(100\\ \\text{kPa}\\) at \\(400\\ \\text{mL}\\)','It no longer fits, because \\(P\\) and \\(V\\) now change in the same direction'],a:0,sol:'The constant \\(k = PV\\) describes one fixed amount of trapped air, which is why Rico blocked the hose. Once air escapes, there is less air inside, so the old \\(k\\) no longer predicts the pressure. Saying \\(k\\) can never change ignores that the fixed amount of air set it, and \\(P\\) and \\(V\\) do not move in the same direction: pushing still raises the pressure, just less than the model predicts. The model stops fitting because the amount of air is no longer fixed.',proc:'reason',band:'stretch',comp:'M9AL-IIa-1'},
        {id:'P-g9q2-3-3',two:false,stem:'A student writes \\(\\sqrt{50} = 25\\sqrt{2}\\). A classmate disagrees. Who is right, and why?',opts:['The student; \\(50 = 25 \\times 2\\)','The student; radicals cannot be simplified','The classmate; \\(\\sqrt{50} = \\sqrt{25 \\times 2} = 5\\sqrt{2}\\), not \\(25\\sqrt{2}\\)','The classmate; \\(\\sqrt{50}\\) cannot be simplified'],a:2,sol:'Only the perfect-square factor leaves the radical: \\(\\sqrt{25} = 5\\).',proc:'interpret',band:'basic',comp:'M9AL-IIg-1'},
        {id:'P-g9q2-3-4',two:false,stem:'A student claims \\(7^0 = 0\\). Which statement is correct?',opts:['Correct; \\(7^0\\) means \\(7 \\times 0\\), so it equals \\(0\\)','Correct; \\(0^7 = 0\\), and a base and its exponent can be swapped','Wrong; \\(7^0 = 7\\)','Wrong; any nonzero base to the zero power is 1, so \\(7^0 = 1\\)'],a:3,sol:'By the zero-exponent rule, any nonzero base to the zero power is 1, so \\(7^0 = 1\\). Reading \\(7^0\\) as \\(7 \\times 0\\) treats the exponent as a factor, and \\(0^7 = 0\\) is a different expression because a base and its exponent cannot be swapped. The claim is wrong: \\(7^0 = 1\\).',proc:'reason',band:'basic',comp:'M9AL-IId-1'},
        {id:'P-g9q2-3-5',two:false,stem:'The loudness a Marikina barangay speaker delivers varies inversely as the square of the distance. Which equation models loudness \\(L\\) and distance \\(d\\)?',opts:['\\(L = \\dfrac{k}{d^2}\\)','\\(L = kd^2\\)','\\(L = kd\\)','\\(L = \\dfrac{k}{d}\\)'],a:0,sol:'Inverse as the square places \\(d^2\\) in the denominator.',proc:'formulate',band:'basic',comp:'M9AL-IIa-b-1'},
        {id:'P-g9q2-3-6',two:false,stem:'Which real situation is a JOINT variation?',opts:['The area of a shoe-box label varying as one side','The area of a triangular banner varying as both its base and its height','A fixed monthly stall rent','Jeepney fare varying as distance'],a:1,sol:'Area \\(= \\tfrac{1}{2}bh\\) varies as the product of two quantities: joint variation.',proc:'formulate',band:'basic',comp:'M9AL-IIa-1'}
      ]}
    ],
    g9q3:[
      {title:'Start',level:'Warm-up and core skills',items:[
        {id:'P-g9q3-1-1',two:false,stem:'In a Marikina floor-tile pattern, which quadrilateral has both pairs of opposite sides parallel?',opts:['A parallelogram','A trapezoid','A kite','A triangle'],a:0,sol:'A parallelogram is defined by two pairs of parallel opposite sides.',proc:'employ',band:'entry',comp:'M9GE-IIIa-1'},
        {id:'P-g9q3-1-2',two:true,stim:'A parallelogram tile has one angle of \\(60^\\circ\\).',stem:'What is its opposite angle?',opts:['\\(120^\\circ\\)','\\(60^\\circ\\)','\\(30^\\circ\\)','\\(90^\\circ\\)'],a:1,sol:'Opposite angles of a parallelogram are congruent.',proc:'employ',band:'entry',comp:'M9GE-IIIb-1'},
        {id:'P-g9q3-1-3',two:false,stem:'A rectangular Marikina tarpaulin has diagonals that are:',opts:['perpendicular','unequal','equal in length','parallel'],a:2,sol:'A rectangle has congruent diagonals.',proc:'employ',band:'entry',comp:'M9GE-IIIc-1'},
        {id:'P-g9q3-1-4',two:true,stem:'For a right-triangular brace with legs \\(a, b\\) and hypotenuse \\(c\\), which is true?',opts:['\\(a + b = c\\)','\\(a^2 - b^2 = c^2\\)','\\(ab = c^2\\)','\\(a^2 + b^2 = c^2\\)'],a:3,sol:'The Pythagorean theorem: \\(a^2 + b^2 = c^2\\).',proc:'employ',band:'entry',comp:'M9GE-IIIi-2'},
        {id:'P-g9q3-1-5',two:false,stem:'Two Marikina shoe logos are similar. They have the same shape but may differ in:',opts:['size','number of sides','angle measures','type of figure'],a:0,sol:'Similar figures have equal angles and proportional sides, so only size may differ.',proc:'employ',band:'entry',comp:'M9GE-IIIg-1'},
        {id:'P-g9q3-1-6',two:false,stem:'A triangle&rsquo;s midsegment is parallel to the third side and is:',opts:['equal to it','half its length','twice its length','perpendicular to it'],a:1,sol:'By the Midline Theorem, the midsegment is half the third side.',proc:'employ',band:'entry',comp:'M9GE-IIId-1'}
      ]},
      {title:'Build',level:'Apply and model',items:[
        {id:'P-g9q3-2-1',two:true,stim:'A parallelogram-shaped lot has one angle of \\(105^\\circ\\).',stem:'What is a consecutive angle?',opts:['\\(75^\\circ\\)','\\(105^\\circ\\)','\\(15^\\circ\\)','\\(95^\\circ\\)'],a:0,sol:'Consecutive angles are supplementary: \\(180^\\circ - 105^\\circ = 75^\\circ\\).',proc:'employ',band:'basic',comp:'M9GE-IIIb-1'},
        {id:'P-g9q3-2-2',two:true,stim:'A trapezoidal Marikina lot has parallel sides 12 m and 18 m.',stem:'What is the length of its median?',opts:['\\(30\\) m','\\(15\\) m','\\(6\\) m','\\(216\\) m'],a:1,sol:'Median \\(= \\dfrac{12 + 18}{2} = 15\\) m.',proc:'employ',band:'basic',comp:'M9GE-IIIe-1'},
        {id:'P-g9q3-2-3',two:true,stim:'Ana makes a scale drawing of a triangular vegetable plot in Tumana. The drawing and the plot are similar triangles. On her drawing, \\(1\\ \\text{cm}\\) stands for \\(4\\ \\text{m}\\). The longest side of the plot is \\(5\\ \\text{cm}\\) on the drawing.',stem:'How long is the longest side of the actual plot?',opts:['\\(1.25\\ \\text{m}\\)','\\(9\\ \\text{m}\\)','\\(20\\ \\text{m}\\)','\\(20\\ \\text{cm}\\)'],a:2,sol:'The drawing is similar to the real plot, so every length is multiplied by the same factor: each centimeter stands for 4 m, giving \\(5 \\times 4 = 20\\ \\text{m}\\). Dividing (\\(5 \\div 4 = 1.25\\)) reverses the scale, adding 4 is not scaling, and 20 cm forgets that each centimeter stands for meters. The longest side of the actual plot is 20 m.',proc:'formulate',band:'basic',comp:'M9GE-IIIj-1'},
        {id:'P-g9q3-2-4',two:true,stim:'At the same time on a sunny day, a 2 m post casts a 3 m shadow and a Marikina flagpole casts a 12 m shadow.',stem:'How tall is the flagpole?',opts:['\\(18\\) m','\\(6\\) m','\\(4\\) m','\\(8\\) m'],a:3,sol:'\\(\\dfrac{h}{12} = \\dfrac{2}{3}\\), so \\(h = 8\\) m.',proc:'formulate',band:'standard',comp:'M9GE-IIIj-1'},
        {id:'P-g9q3-2-5',two:true,stim:'A Marikina River footbridge brace joins the ends of a 6 m and an 8 m beam that meet at a right angle.',stem:'How long is the brace?',opts:['\\(10\\) m','\\(14\\) m','\\(48\\) m','\\(2\\) m'],a:0,sol:'\\(\\sqrt{6^2 + 8^2} = \\sqrt{100} = 10\\) m.',proc:'employ',band:'basic',comp:'M9GE-IIIj-1'},
        {id:'P-g9q3-2-6',two:true,stim:'A rhombus tile has diagonals 6 and 8, which are perpendicular bisectors.',stem:'How long is each side?',opts:['\\(7\\)','\\(5\\)','\\(10\\)','\\(14\\)'],a:1,sol:'Half-diagonals 3 and 4 give side \\(= \\sqrt{3^2 + 4^2} = 5\\).',proc:'employ',band:'standard',comp:'M9GE-IIIb-1'}
      ]},
      {title:'Challenge',level:'Interpret and reason',items:[
        {id:'P-g9q3-3-1',two:false,stem:'Which single condition guarantees a quadrilateral is a parallelogram?',opts:['Both pairs of opposite sides are congruent','One pair of sides is parallel','The diagonals are equal in length','It has one right angle'],a:0,sol:'If both pairs of opposite sides are congruent, it must be a parallelogram.',proc:'reason',band:'basic',comp:'M9GE-IIIa-2'},
        {id:'P-g9q3-3-2',two:false,stem:'A Sta. Elena HS student says all rectangles are similar because each has four right angles. Which evaluation is correct?',opts:['Correct; equal angles are enough for any two figures to be similar','Wrong; similar figures also need proportional sides, and rectangles can have different length-to-width ratios','Wrong; rectangles can have different areas, so they cannot all be similar','Correct; every rectangle has opposite sides that are equal and parallel'],a:1,sol:'Similar figures need equal angles and proportional sides. A \\(4\\ \\text{m}\\) by \\(2\\ \\text{m}\\) rectangle (ratio \\(2 : 1\\)) and a \\(6\\ \\text{m}\\) by \\(4\\ \\text{m}\\) rectangle (ratio \\(3 : 2\\)) both have four right angles but are not similar. Equal angles alone are enough only for triangles, and different areas do not rule out similarity, since similar figures may differ in size. The claim is wrong because the side ratios can differ.',proc:'reason',band:'standard',comp:'M9GE-IIIg-1'},
        {id:'P-g9q3-3-3',two:false,stem:'Which statement is always true?',opts:['Every rectangle is a rhombus','Every trapezoid is a parallelogram','Every square is both a rectangle and a rhombus','Every parallelogram is a rectangle'],a:2,sol:'A square has four right angles (rectangle) and four equal sides (rhombus).',proc:'reason',band:'basic',comp:'M9GE-IIIc-1'},
        {id:'P-g9q3-3-4',two:false,stem:'Two triangular supports each have angles of \\(50^\\circ\\) and \\(60^\\circ\\). Are they similar, and why?',opts:['No; their sides may differ','No; all three sides must be known','Only if they are the same size','Yes; by AA, since two pairs of angles are congruent (the third is \\(70^\\circ\\))'],a:3,sol:'Two congruent angle pairs force the third to match, so they are similar by AA.',proc:'reason',band:'standard',comp:'M9GE-IIIi-1'},
        {id:'P-g9q3-3-5',two:false,stim:'A Marikina carpenter checks a corner with sides 6 and 8 and measures the diagonal as 10.',stem:'What can the carpenter conclude?',opts:['The corner is a right angle, because \\(6^2 + 8^2 = 10^2\\)','The corner is not square','The angle is \\(45^\\circ\\)','Nothing can be concluded'],a:0,sol:'By the converse of the Pythagorean theorem, \\(36 + 64 = 100 = 10^2\\) gives a right angle.',proc:'interpret',band:'standard',comp:'M9GE-IIIj-1'},
        {id:'P-g9q3-3-6',two:false,stim:'Joining the midpoints of the two slanted sides of a triangular banner whose base is 14 cm gives a midsegment.',stem:'How long is the midsegment, and why?',opts:['\\(14\\) cm, because a segment parallel to the base is as long as the base','\\(7\\) cm, by the Midline Theorem (half the third side)','\\(28\\) cm, because the base is half of the midsegment','\\(3.5\\) cm, because the small top triangle is one-fourth of the banner'],a:1,sol:'The segment joining the midpoints of two sides is half the third side, here the 14 cm base: \\(\\dfrac{14}{2} = 7\\) cm. It is parallel to the base but not equal to it, so 14 cm is wrong, and 28 cm reverses the relationship. The small top triangle has one-fourth of the banner&rsquo;s area, but its sides are half as long, so 3.5 cm mixes up area and length. The midsegment is 7 cm long.',proc:'reason',band:'basic',comp:'M9GE-IIId-1'}
      ]}
    ],
    g9q4:[{"title":"Start","level":"Warm-up and core skills","items":[{"id":"P-g9q4-S1-U1-1","type":"hotspot","set":"P-g9q4-S1-U1","proc":"interpret","band":"entry","comp":"M9GE-IVd-1","stim":"<p>Ana stands at a Riverbanks Center viewing deck and looks down at a banca (small boat) on the Marikina River. The deck is about 10.5 m above the water and her eyes are about 1.5 m above the deck floor. The figure is not drawn to scale.</p>","hs":{"n":"depscene"},"stem":"Tap the angle of depression to the banca.","labels":["Angle 1","Angle 2","Angle 3","Angle 4"],"a":0,"why":["this opens downward from the horizontal eye line, so it is the angle of depression","this is measured from the vertical post, so it is the complement of the depression, not the depression itself","this sits at the banca looking up from the water, so it is the angle of elevation; it equals the depression but is measured at the boat, not at Ana's eye","this is on the far side of the boat, so it adds with the elevation to \\(180^\\circ\\); the depression equals the elevation as alternate interior angles, not this angle"],"sol":"The angle of depression is measured downward from the horizontal line through Ana's eye to her line of sight, so it is the first angle. Measuring from the vertical railing post gives its complement, and the angle at the boat between the water and the sight line is the elevation, which equals the depression as alternate interior angles but has its vertex at the boat. The angle on the far side of the boat only looks similar; it is the supplement of the elevation, not an equal angle. So the depression is the angle between Ana's horizontal eye line and her downward line of sight."},{"id":"P-g9q4-S1-U1-2","type":"hotspot","set":"P-g9q4-S1-U1","proc":"formulate","band":"entry","comp":"M9GE-IVa-1","stim":"<p>Ana stands at a Riverbanks Center viewing deck and looks down at a banca (small boat) on the Marikina River. The deck is about 10.5 m above the water and her eyes are about 1.5 m above the deck floor. The figure is not drawn to scale.</p>","hs":{"n":"rtriSides","a":{"ang":"28°"}},"stem":"The angle of elevation from the boat up to Ana's eye is \\(28^\\circ\\). Tap the side opposite this angle.","labels":["Side 1","Side 2","Side 3"],"a":0,"why":["this runs straight up across from the \\(28^\\circ\\) angle without touching it, so it is the opposite side","this side forms the \\(28^\\circ\\) angle together with the line of sight, so it is adjacent, not opposite","this is the slanted line of sight, the hypotenuse across from the right angle, not a leg"],"sol":"Mark the \\(28^\\circ\\) angle at the boat first; the opposite side is the one that does not touch that vertex. That is the full vertical from the water up to Ana's eye. The horizontal along the water forms the \\(28^\\circ\\) angle with the line of sight, so it is the adjacent side, and the slanted line of sight is the hypotenuse. So the side opposite the \\(28^\\circ\\) angle is the vertical segment up to Ana's eye."},{"id":"P-g9q4-S1-U1-3","type":"num","set":"P-g9q4-S1-U1","proc":"employ","band":"basic","comp":"M9GE-IVe-1","stim":"<p>Ana stands at a Riverbanks Center viewing deck and looks down at a banca (small boat) on the Marikina River. The deck is about 10.5 m above the water and her eyes are about 1.5 m above the deck floor. The figure is not drawn to scale.</p>","fig":{"n":"rtri","a":{"opp":"12 m","base":"d","ang":"28°","aria":"Right triangle: 12 m vertical up to the eye, horizontal distance d to the banca, 28 degree angle at the banca. Not drawn to scale."}},"stem":"The depression angle equals the \\(28^\\circ\\) elevation at the boat. With \\(\\tan 28^\\circ \\approx 0.5317\\), how far is the banca from the deck's foot, to the nearest 0.1 m?","ans":22.6,"lo":22.5,"hi":22.6,"unit":"m","errs":[{"v":19.7,"msg":"19.7 m uses only the 10.5 m deck height. The triangle starts at eye level, so add Ana's 1.5 m eye height first, making the vertical 12 m."},{"v":6.4,"msg":"6.4 m multiplies 12 by the tangent. The distance is the unknown in the denominator, so divide 12 by \\(\\tan 28^\\circ\\)."}],"generic":"Not yet. The 12 m vertical is opposite the \\(28^\\circ\\) angle and the boat distance is adjacent, so divide: distance equals 12 divided by \\(\\tan 28^\\circ\\).","sol":"Ana's eye is \\(10.5 + 1.5 = 12\\) m above the water, and this vertical is opposite the \\(28^\\circ\\) angle while the boat distance is adjacent, so \\(\\tan 28^\\circ = \\dfrac{12}{d}\\). Solving gives \\(d = \\dfrac{12}{0.5317} \\approx 22.6\\) m. Using only the 10.5 m deck forgets that the triangle starts at eye level, and multiplying 12 by the tangent misplaces the unknown. The banca is about 22.6 m from the foot of the deck."},{"id":"P-g9q4-S1-04","type":"mc","two":true,"proc":"employ","band":"entry","comp":"M9GE-IVa-1","stim":"<p>The city repair crew braces a newly installed lamp post with a 10 m support cable. The cable is fastened 8 m up the post. It is anchored to the ground 6 m from the post's base, forming a right triangle. Here \\(\\theta\\) is the angle the cable makes with the ground.</p>","fig":{"n":"rtri","a":{"base":"6 m","opp":"8 m","hyp":"10 m","ang":"θ","aria":"Right triangle: 6 m ground run, 8 m vertical post, 10 m cable, angle theta at the ground anchor. Not drawn to scale."}},"stem":"Which fraction equals \\(\\cos\\theta\\)?","opts":["\\(\\dfrac{6}{10}\\)","\\(\\dfrac{8}{10}\\)","\\(\\dfrac{10}{6}\\)","\\(\\dfrac{8}{6}\\)"],"a":0,"why":["the 6 m run is adjacent to \\(\\theta\\) and the 10 m cable is the hypotenuse, so this is \\(\\cos\\theta\\)","the 8 m height is opposite \\(\\theta\\), so this ratio is \\(\\sin\\theta\\), not cosine","this inverts the ratio; the cosine of an acute angle is at most 1, so it cannot be this","opposite over adjacent is \\(\\tan\\theta\\), a different ratio"],"sol":"The angle \\(\\theta\\) sits at the ground anchor, so the 6 m run along the ground is adjacent and the 10 m cable is the hypotenuse, giving \\(\\cos\\theta = \\dfrac{6}{10}\\). The 8 m height is opposite \\(\\theta\\), so \\(\\dfrac{8}{10}\\) is the sine rather than the cosine. The cosine of an acute angle is at most 1, which rules out \\(\\dfrac{10}{6}\\). The correct value is \\(\\dfrac{6}{10}\\)."},{"id":"P-g9q4-S1-05","type":"repr","proc":"interpret","band":"entry","comp":"M9GE-IVd-1","stim":"<p>From a viewing deck above the Marikina River, Lea watches a kite flying above her. Below her, a banca (small boat) drifts on the water.</p>","optFig":[{"n":"anglecard","a":{"kind":"horizDown"}},{"n":"anglecard","a":{"kind":"horizUp"}},{"n":"anglecard","a":{"kind":"vertDown"}},{"n":"anglecard","a":{"kind":"atBanca"}}],"stem":"Which card correctly marks Lea's angle of sight to the banca?","opts":["horizontal eye line, angle down to the banca","horizontal eye line, angle up to the kite","angle measured from the vertical","angle marked at the banca, up to Lea"],"a":0,"why":["the banca drifts below the deck, so Lea's sight line drops; this card marks the angle from her horizontal eye line down to the banca","this opens upward to the kite; the banca is below Lea, so her sight line to it goes down, not up","measuring from the vertical gives the complement of the correct angle, not the angle of sight itself","this angle sits at the banca looking up to Lea, so it is at the wrong vertex, not the angle Lea marks at her own eye"],"sol":"The banca drifts below the deck, so Lea's line of sight drops and her angle is measured from the horizontal eye line down to the banca. The upward card marks the angle to the kite instead, which is the wrong direction once the scene shows the banca is below. Measuring from the vertical gives the complement, and marking the angle at the banca places it at the wrong vertex. So the card with the horizontal eye line and the downward angle to the banca is correct."},{"id":"P-g9q4-S1-06","type":"match","proc":"formulate","band":"basic","comp":"M9GE-IVa-1","stim":"<p>In science class, Marco builds a model solar panel stand shaped like a right triangle. The panel is 39 cm long and the base is 36 cm. The back support is 15 cm, standing opposite the tilt angle \\(\\theta\\).</p>","fig":{"n":"rtri","a":{"base":"36 cm","opp":"15 cm","hyp":"39 cm","ang":"θ","aria":"Right triangle: 36 cm base, 15 cm back support opposite theta, 39 cm panel hypotenuse. Not drawn to scale."}},"stem":"Choose the correct value for each ratio.","choices":["39 divided by 15","15 divided by 39","39 divided by 36","36 divided by 39","36 divided by 15","15 divided by 36"],"parts":[{"label":"csc θ","a":0,"why":"cosecant is the hypotenuse over the opposite side, so 39 over 15"},{"label":"sec θ","a":2,"why":"secant is the hypotenuse over the adjacent side, so 39 over 36"},{"label":"cot θ","a":4,"why":"cotangent is the adjacent side over the opposite side, so 36 over 15"}],"sol":"With \\(\\theta\\) between the 39 cm panel and the 36 cm base, the opposite side is the 15 cm back support, the adjacent side is the 36 cm base, and the hypotenuse is the 39 cm panel. So \\(\\csc\\theta = \\dfrac{39}{15}\\), \\(\\sec\\theta = \\dfrac{39}{36}\\), and \\(\\cot\\theta = \\dfrac{36}{15}\\). Flipping any of these gives the plain sine, cosine, or tangent instead, which is the common slip."}]},{"title":"Build","level":"Apply and model","items":[{"id":"P-g9q4-S2-U1-1","type":"mc","set":"P-g9q4-S2-U1","two":true,"proc":"interpret","band":"entry","comp":"M9GE-IVa-1","stim":"<p>A family shoe shop in Marikina makes wedge sandals. Each wedge is a right triangle. The heel rises straight up, the footbed lies flat on the ground, and the sloping footbed joins them. The angle \\(\\theta\\) is where the sloping footbed meets the ground. The table lists three designs.</p><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Design</th><th>Heel height (cm)</th><th>Horizontal length (cm)</th></tr></thead><tbody><tr><td>A</td><td>6</td><td>15</td></tr><tr><td>B</td><td>7</td><td>20</td></tr><tr><td>C</td><td>9</td><td>15</td></tr></tbody></table></div>","fig":{"n":"rtri","a":{"base":"15 cm","opp":"6 cm","ang":"θ","aria":"Wedge sandal Design A as a right triangle: 15 cm footbed, 6 cm heel opposite theta, sloping footbed hypotenuse. Not drawn to scale."}},"stem":"In Design A the angle \\(\\theta\\) sits at the ground. Which trigonometric ratio equals \\(\\dfrac{6}{15}\\)?","opts":["\\(\\tan\\theta\\)","\\(\\sin\\theta\\)","\\(\\cos\\theta\\)","\\(\\cot\\theta\\)"],"a":0,"why":["Correct. The 6 cm heel is opposite \\(\\theta\\) and the 15 cm footbed is adjacent to it, so this is opposite over adjacent, which is \\(\\tan\\theta\\).","This treats the 15 cm footbed as the hypotenuse. The footbed is a flat leg, so sine, which is opposite over the slanted hypotenuse, does not equal \\(\\dfrac{6}{15}\\).","Cosine is adjacent over hypotenuse, but here 6 and 15 are both legs, so this fraction cannot be \\(\\cos\\theta\\).","This reads the fraction upside down as adjacent over opposite, which is \\(\\cot\\theta\\), the reciprocal of the tangent."],"sol":"In Design A the 6 cm heel stands opposite \\(\\theta\\) while the 15 cm footbed lies adjacent to it, so \\(\\dfrac{6}{15}\\) is opposite over adjacent. A ratio of opposite over adjacent is the tangent, so the fraction equals \\(\\tan\\theta\\). The tempting answer \\(\\sin\\theta\\) fails because sine divides the opposite side by the sloping hypotenuse, not by the flat footbed. The fraction \\(\\dfrac{6}{15}\\) is \\(\\tan\\theta\\)."},{"id":"P-g9q4-S2-U1-2","type":"mc","set":"P-g9q4-S2-U1","two":true,"proc":"formulate","band":"basic","comp":"M9GE-IVe-1","stim":"<p>A family shoe shop in Marikina makes wedge sandals. Each wedge is a right triangle. The heel rises straight up, the footbed lies flat on the ground, and the sloping footbed joins them. The angle \\(\\theta\\) is where the sloping footbed meets the ground. The table lists three designs.</p><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Design</th><th>Heel height (cm)</th><th>Horizontal length (cm)</th></tr></thead><tbody><tr><td>A</td><td>6</td><td>15</td></tr><tr><td>B</td><td>7</td><td>20</td></tr><tr><td>C</td><td>9</td><td>15</td></tr></tbody></table></div>","fig":{"n":"rtri","a":{"base":"15 cm","opp":"6 cm","ang":"θ","aria":"Wedge sandal Design A right triangle: 15 cm footbed, 6 cm heel, angle theta at the ground. Not drawn to scale."}},"stem":"Which equation can you solve to find \\(\\theta\\) for Design A?","opts":["\\(\\tan\\theta=\\dfrac{6}{15}\\)","\\(\\sin\\theta=\\dfrac{6}{15}\\)","\\(\\tan\\theta=\\dfrac{15}{6}\\)","\\(\\theta=\\dfrac{6}{15}\\)"],"a":0,"why":["The 6 cm heel is opposite \\(\\theta\\) and the 15 cm footbed is adjacent, so opposite over adjacent gives \\(\\tan\\theta=\\dfrac{6}{15}\\).","This treats the 15 cm footbed as the hypotenuse. The footbed is a leg, so the ratio of the two legs is a tangent, not a sine.","The sides are upside down here. Tangent is opposite over adjacent, so the 6 cm heel belongs on top.","This stops at the ratio value. \\(\\dfrac{6}{15}\\) is \\(\\tan\\theta\\), not \\(\\theta\\); you still need the inverse tangent."],"sol":"The angle \\(\\theta\\) sits between the footbed and the sloping top, so the 6 cm heel is opposite it and the 15 cm footbed is adjacent. Opposite over adjacent is the tangent, so \\(\\tan\\theta=\\dfrac{6}{15}\\). Writing \\(\\sin\\theta=\\dfrac{6}{15}\\) would treat the footbed as the hypotenuse, and \\(\\theta=\\dfrac{6}{15}\\) forgets that the ratio is not the angle."},{"id":"P-g9q4-S2-U1-3","type":"mc","set":"P-g9q4-S2-U1","two":true,"proc":"employ","band":"standard","comp":"M9GE-IVe-1","stim":"<p>A family shoe shop in Marikina makes wedge sandals. Each wedge is a right triangle. The heel rises straight up, the footbed lies flat on the ground, and the sloping footbed joins them. The angle \\(\\theta\\) is where the sloping footbed meets the ground. The table lists three designs.</p><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Design</th><th>Heel height (cm)</th><th>Horizontal length (cm)</th></tr></thead><tbody><tr><td>A</td><td>6</td><td>15</td></tr><tr><td>B</td><td>7</td><td>20</td></tr><tr><td>C</td><td>9</td><td>15</td></tr></tbody></table></div>","fig":{"n":"rtri","a":{"base":"15 cm","opp":"6 cm","ang":"θ","aria":"Wedge sandal Design A right triangle: 15 cm footbed, 6 cm heel, angle theta at the ground. Not drawn to scale."}},"stem":"For Design A the heel is 6 cm and the footbed is 15 cm. Given \\(\\tan 21.8^\\circ\\approx 0.40\\) and \\(\\sin 23.6^\\circ\\approx 0.40\\), which angle is closest to \\(\\theta\\)?","opts":["\\(0.4^\\circ\\)","\\(21.8^\\circ\\)","\\(23.6^\\circ\\)","\\(68.2^\\circ\\)"],"a":1,"why":["\\(0.4\\) is the value of the ratio, not an angle. The angle whose tangent is \\(0.4\\) is about \\(21.8^\\circ\\).","\\(\\tan\\theta=\\dfrac{6}{15}=0.40\\), and \\(\\tan 21.8^\\circ\\approx 0.40\\), so \\(\\theta\\approx 21.8^\\circ\\).","This matches \\(0.40\\) to a sine. The 15 cm footbed is a leg, not the hypotenuse, so use the tangent, not the sine.","This is the angle at the top of the wedge. It comes from \\(\\dfrac{15}{6}\\), with the opposite and adjacent sides swapped."],"sol":"The heel is opposite \\(\\theta\\) and the footbed is adjacent, so \\(\\tan\\theta=\\dfrac{6}{15}=0.40\\). Matching \\(0.40\\) to a tangent gives \\(\\theta\\approx 21.8^\\circ\\). Matching it to a sine would give \\(23.6^\\circ\\), and \\(68.2^\\circ\\) is the angle at the top of the wedge, where the sides are reversed."},{"id":"P-g9q4-S2-U1-4","type":"grid","set":"P-g9q4-S2-U1","proc":"reason","band":"standard","comp":"M9GE-IVe-1","stim":"<p>A family shoe shop in Marikina makes wedge sandals. Each wedge is a right triangle. The heel rises straight up, the footbed lies flat on the ground, and the sloping footbed joins them. The angle \\(\\theta\\) is where the sloping footbed meets the ground. The table lists three designs.</p><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Design</th><th>Heel height (cm)</th><th>Horizontal length (cm)</th></tr></thead><tbody><tr><td>A</td><td>6</td><td>15</td></tr><tr><td>B</td><td>7</td><td>20</td></tr><tr><td>C</td><td>9</td><td>15</td></tr></tbody></table></div>","stem":"Answer Yes or No for each statement.","cols":["Yes","No"],"rows":[{"t":"Design C is steeper at \\(\\theta\\) than Design A.","a":0,"why":"Both footbeds are 15 cm, so compare the heels. Design C gives \\(\\tan\\theta=\\dfrac{9}{15}=0.6\\), steeper than Design A at \\(\\dfrac{6}{15}=0.4\\)."},{"t":"Design B is steeper than Design A because its footbed is longer.","a":1,"why":"A longer footbed does not by itself make a wedge steeper. Design B gives \\(\\tan\\theta=\\dfrac{7}{20}=0.35\\), gentler than Design A at \\(0.4\\)."},{"t":"A wedge with \\(\\tan\\theta=0.8\\) has twice the angle of a wedge with \\(\\tan\\theta=0.4\\).","a":1,"why":"The ratio does not grow in step with the angle. Here \\(\\tan 20^\\circ\\approx 0.36\\) and \\(\\tan 40^\\circ\\approx 0.84\\), so doubling the angle does not double \\(\\tan\\theta\\)."},{"t":"A wedge whose heel is taller than its footbed has \\(\\tan\\theta\\) greater than \\(1\\).","a":0,"why":"Since \\(\\tan\\theta=\\dfrac{\\text{heel}}{\\text{footbed}}\\), a heel longer than the footbed makes the top number larger, so the ratio passes \\(1\\)."}],"sol":"Steepness at \\(\\theta\\) is measured by \\(\\tan\\theta=\\dfrac{\\text{heel}}{\\text{footbed}}\\), not by any single length. Design C beats Design A on the same 15 cm footbed, while Design B's longer footbed lowers its ratio to \\(0.35\\). The tangent also rises faster than the angle and passes \\(1\\) once the heel outgrows the footbed, so only the first and last statements hold."},{"id":"P-g9q4-S2-05","type":"num","proc":"employ","band":"basic","comp":"M9GE-IVb-c-1","stim":"<p>Aria rides the escalator at a Marikina mall. It climbs 6 m, the height of two storeys, and makes a \\(30^\\circ\\) angle with the floor.</p>","fig":{"n":"rtri","a":{"opp":"6 m","ang":"30°","aria":"Right triangle: escalator hypotenuse rising 6 m at 30 degrees to the floor. Not drawn to scale."}},"stem":"Using \\(\\sin 30^\\circ=\\dfrac{1}{2}\\) (and \\(\\cos 30^\\circ\\approx 0.866\\), \\(\\tan 30^\\circ\\approx 0.577\\)), how long is the sloping escalator, to the nearest \\(0.1\\) m?","ans":12,"lo":11.9,"hi":12.1,"unit":"m","errs":[{"v":3,"msg":"3 m multiplies 6 by \\(\\dfrac{1}{2}\\). The escalator is the hypotenuse and the unknown, so divide instead: \\(6\\div\\dfrac{1}{2}\\)."},{"v":6.9,"msg":"6.9 m uses \\(0.866\\) for \\(\\sin 30^\\circ\\). But \\(0.866\\) is \\(\\sin 60^\\circ\\); here \\(\\sin 30^\\circ=\\dfrac{1}{2}\\), so the escalator is longer."},{"v":10.4,"msg":"10.4 m uses \\(\\tan 30^\\circ\\). The 6 m rise is opposite the angle and the escalator is the hypotenuse, so use the sine, not the tangent."}],"generic":"Not yet. The 6 m rise is opposite \\(30^\\circ\\) and the escalator is the hypotenuse, so \\(\\sin 30^\\circ=\\dfrac{6}{L}\\).","sol":"The 6 m rise is opposite the \\(30^\\circ\\) angle and the escalator is the hypotenuse, so \\(\\sin 30^\\circ=\\dfrac{6}{L}\\). With \\(\\sin 30^\\circ=\\dfrac{1}{2}\\), this gives \\(L=6\\div\\dfrac{1}{2}=12\\) m. Multiplying instead would give 3 m, shorter than the 6 m rise it must span, so it cannot be right."},{"id":"P-g9q4-S2-06","type":"claim","two":false,"proc":"reason","band":"basic","comp":"M9GE-IVd-1","stim":"<p>Mika sits on the top row of the grandstand at the Marikina Sports Center. She looks down at a runner on the oval and measures the angle of depression as \\(35^\\circ\\).</p>","fig":{"n":"twohoriz","a":{"dep":"35°"}},"stem":"Jun says the elevation from the runner up to Mika is \\(55^\\circ\\). His reason: the two angles add up to \\(90^\\circ\\). Is Jun right?","opts":["Jun is wrong. The elevation is \\(35^\\circ\\), because the horizontal at Mika's eyes and the horizontal at the runner are parallel, so the line of sight makes equal alternate interior angles.","Jun is wrong. The elevation is \\(35^\\circ\\), because the triangle from Mika to the runner is isosceles, so its base angles are equal.","Jun is right. The elevation is \\(55^\\circ\\), because the angle of depression is measured down from the vertical, so the elevation is its complement.","Jun is right. The elevation is \\(55^\\circ\\), because \\(35^\\circ\\) and \\(55^\\circ\\) are complementary and add to \\(90^\\circ\\)."],"a":0,"why":["The two horizontal lines are parallel and the line of sight is a transversal, so the depression and the elevation are equal alternate interior angles, both \\(35^\\circ\\).","The verdict is right but the reason is not. Nothing tells us the triangle is isosceles; the angles are equal because the horizontals are parallel, not because two sides match.","A depression is measured down from the horizontal eye line, not from the vertical, so there is no complement to take. The elevation equals the depression, \\(35^\\circ\\).","It is true that \\(35^\\circ\\) and \\(55^\\circ\\) add to \\(90^\\circ\\), but that does not apply here. The elevation equals the depression by parallel lines, so it is \\(35^\\circ\\)."],"sol":"Mika's horizontal line of sight and the runner's horizontal are parallel, and the single line of sight between them is a transversal. So the angle of depression at Mika and the angle of elevation at the runner are equal alternate interior angles, both \\(35^\\circ\\). Jun's \\(55^\\circ\\) treats the angles as complements, but they are equal, not complementary."}]},{"title":"Challenge","level":"Interpret and reason","items":[{"id":"P-g9q4-S3-U1-1","type":"mc","set":"P-g9q4-S3-U1","two":false,"proc":"interpret","band":"basic","comp":"M9GE-IVe-1","stim":"<p>The barangay hall in Sta. Elena is building a wheelchair ramp. Batas Pambansa 344, the Accessibility Law, says a ramp may be no steeper than a slope of \\(1 : 12\\).</p>","stem":"What does a slope of \\(1 : 12\\) mean for the barangay hall ramp?","opts":["It rises \\(1\\) m for every \\(12\\) m of horizontal run.","It rises \\(1\\) m for every \\(12\\) m measured along the sloping ramp surface.","It rises \\(12\\) m for every \\(1\\) m of horizontal run.","The ramp makes an angle of \\(\\dfrac{1}{12}\\) of a degree with the ground."],"a":0,"why":["Correct. The ratio \\(1 : 12\\) compares vertical rise to horizontal run, so the ramp climbs \\(1\\) m for every \\(12\\) m of level ground.","The \\(12\\) m is measured flat along the ground, not up the slanted surface. That slanted surface is the longest side, so a slope uses the horizontal run instead.","This flips the ratio. Rising \\(12\\) m for every \\(1\\) m across would be almost vertical, far too steep for a wheelchair.","A \\(1 : 12\\) slope is a ratio of two lengths, not an angle. Its angle is about \\(4.8^\\circ\\), found with the inverse tangent, not \\(\\dfrac{1}{12}\\) of a degree."],"sol":"The ratio \\(1 : 12\\) compares the vertical rise to the horizontal run, so for every \\(12\\) m the ramp moves across the ground it climbs only \\(1\\) m. Measuring the \\(12\\) m along the slanted surface instead would use the longest side, not the run. Flipping it to \\(12 : 1\\) would make a near-vertical wall. The ramp rises \\(1\\) m for every \\(12\\) m of horizontal run."},{"id":"P-g9q4-S3-U1-2","type":"num","set":"P-g9q4-S3-U1","proc":"employ","band":"standard","comp":"M9GE-IVe-1","stim":"<p>The barangay hall in Sta. Elena is building a wheelchair ramp. Batas Pambansa 344, the Accessibility Law, says a ramp may be no steeper than a slope of \\(1 : 12\\).</p>","stem":"The ramp is built at the steepest slope the \\(1 : 12\\) rule allows, about \\(4.8^\\circ\\). Using \\(\\tan 4.8^\\circ \\approx 0.084\\), how long must the horizontal run be to climb a rise of \\(0.75\\) m? Round to the nearest \\(0.1\\) m.","ans":8.9,"lo":8.9,"hi":9,"unit":"m","errs":[{"v":0.06,"msg":"You multiplied \\(0.75\\) by \\(0.084\\). In \\(\\tan 4.8^\\circ = \\dfrac{0.75}{\\text{run}}\\) the run is in the denominator, so divide instead of multiply."},{"v":0.11,"msg":"This is \\(\\dfrac{0.084}{0.75}\\), the ratio turned upside down. Keep rise over run and divide the \\(0.75\\) m rise by \\(0.084\\)."}],"generic":"Not yet. The \\(0.75\\) m rise is opposite the angle and the run is adjacent, so \\(\\tan 4.8^\\circ = \\dfrac{0.75}{\\text{run}}\\); solve for the run.","sol":"The \\(0.75\\) m rise is opposite the \\(4.8^\\circ\\) angle and the run is adjacent, so \\(\\tan 4.8^\\circ = \\dfrac{0.75}{\\text{run}}\\). The unknown run sits in the denominator, so divide: \\(\\text{run} = \\dfrac{0.75}{0.084} \\approx 8.9\\) m. Multiplying instead would give only about \\(0.06\\) m, far too short for a ramp. The horizontal run must be about \\(8.9\\) m, which matches the \\(1 : 12\\) rule."},{"id":"P-g9q4-S3-U1-3","type":"spot","set":"P-g9q4-S3-U1","proc":"reason","band":"standard","comp":"M9GE-IVe-1","stim":"<p>The barangay hall in Sta. Elena is building a wheelchair ramp. Batas Pambansa 344, the Accessibility Law, says a ramp may be no steeper than a slope of \\(1 : 12\\).</p>","fig":{"n":"ramp"},"stem":"A kagawad (barangay councilor) suggests a redesign: only \\(6\\) m of horizontal run for a \\(0.75\\) m rise. The check against the \\(1 : 12\\) rule runs as follows. Which step is the first mistake?","steps":["Slope \\(= \\dfrac{\\text{rise}}{\\text{run}} = \\dfrac{0.75}{6}\\)","\\(= 0.125 = \\dfrac{1}{8}\\)","Since \\(8\\) is less than \\(12\\), a \\(1 : 8\\) ramp is gentler than the \\(1 : 12\\) limit.","So the redesign meets BP 344."],"a":2,"fix":"Since \\(0.125\\) is greater than \\(\\dfrac{1}{12} \\approx 0.083\\), a \\(1 : 8\\) ramp is steeper than the \\(1 : 12\\) limit, so the redesign fails.","why":["Correct. Slope is rise over run, so \\(\\dfrac{0.75}{6}\\) is the right start.","Correct. \\(\\dfrac{0.75}{6} = 0.125\\), and \\(0.125\\) equals \\(\\dfrac{1}{8}\\).","First mistake. A bigger slope value means a steeper ramp, and \\(0.125 > \\dfrac{1}{12} \\approx 0.083\\), so \\(1 : 8\\) is steeper, not gentler. Comparing only the denominators \\(8\\) and \\(12\\) reverses what the ratio means.","This rests on the reversed comparison above, so it is also wrong; the redesign is too steep to meet BP 344."],"sol":"Converting the slope, \\(\\dfrac{0.75}{6} = 0.125\\), which is larger than \\(\\dfrac{1}{12} \\approx 0.083\\). A larger slope value is a steeper ramp, so the \\(1 : 8\\) redesign is steeper than the limit, not gentler. The error enters at Step 3, where a smaller denominator is misread as a gentler slope. The redesign fails the rule."},{"id":"P-g9q4-S3-U1-4","type":"claim","set":"P-g9q4-S3-U1","two":false,"proc":"reason","band":"stretch","comp":"M9GE-IVe-1","stim":"<p>The barangay hall in Sta. Elena is building a wheelchair ramp. Batas Pambansa 344, the Accessibility Law, says a ramp may be no steeper than a slope of \\(1 : 12\\).</p>","stem":"An old ramp at the same hall measures \\(6^\\circ\\) from the ground. Using \\(\\tan 6^\\circ \\approx 0.105\\), Mang Ramon says it still meets the \\(1 : 12\\) rule because \\(6^\\circ\\) is a small angle. Which response is best?","opts":["No. The slope is \\(\\tan 6^\\circ \\approx 0.105\\), which is more than \\(\\dfrac{1}{12} \\approx 0.083\\), so the ramp is too steep.","No. The angle \\(6\\) is far bigger than \\(\\dfrac{1}{12} \\approx 0.083\\), so it fails.","Yes. The angle \\(6^\\circ\\) is less than \\(12\\), so the ramp is inside the \\(1 : 12\\) limit.","Yes. A smaller angle makes a gentler slope, and \\(6^\\circ\\) is a small angle, so Mang Ramon is right."],"a":0,"why":["Correct. Turn the angle into a slope with \\(\\tan 6^\\circ \\approx 0.105\\); since \\(0.105 > \\dfrac{1}{12} \\approx 0.083\\), the ramp rises too fast and fails BP 344.","The verdict happens to be right, but the reason is not. You cannot compare the degree measure \\(6\\) straight to the ratio \\(0.083\\); first take \\(\\tan 6^\\circ\\) to turn the angle into a slope.","The angle \\(6^\\circ\\) and the number \\(12\\) measure different things, so comparing them proves nothing. Convert with \\(\\tan 6^\\circ \\approx 0.105\\) and compare with \\(\\dfrac{1}{12} \\approx 0.083\\): it fails.","A smaller angle does give a gentler slope, but \\(6^\\circ\\) is not small enough. The limit is \\(\\arctan \\dfrac{1}{12} \\approx 4.8^\\circ\\), and \\(6^\\circ\\) is steeper than that."],"sol":"Turn the angle into a slope: \\(\\tan 6^\\circ \\approx 0.105\\). The rule allows at most \\(\\dfrac{1}{12} \\approx 0.083\\), and \\(0.105\\) is larger, so the old ramp is too steep and fails BP 344. Calling \\(6^\\circ\\) a small angle is not enough, since the limit is only about \\(4.8^\\circ\\). Mang Ramon is mistaken."},{"id":"P-g9q4-S3-05","type":"grid","proc":"reason","band":"standard","comp":"M9GE-IVf-g-1","stim":"<div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Lot</th><th>What the surveyor measured</th></tr></thead><tbody><tr><td>1</td><td>Two sides, 20 m and 25 m, with a 50 degree angle between them</td></tr><tr><td>2</td><td>Angles 40 degrees and 75 degrees, with a 30 m side across from the 40 degree angle</td></tr><tr><td>3</td><td>Three sides: 18 m, 24 m and 27 m</td></tr><tr><td>4</td><td>Three sides measured, no angles</td></tr></tbody></table></div>","stem":"A barangay surveyor must choose a rule for each triangular lot. Answer Accept or Reject for each claim.","cols":["Accept","Reject"],"rows":[{"t":"Lot 1: the Law of Sines can find the third side directly.","a":1,"why":"Reject. Two sides with the angle between them (SAS) give no side paired with a known opposite angle, so the Law of Sines cannot start. Use the Law of Cosines, \\(a^2 = b^2 + c^2 - 2bc\\cos A\\)."},{"t":"Lot 2: the Law of Sines can find the side opposite the \\(75^\\circ\\) angle.","a":0,"why":"Accept. The \\(30\\) m side is opposite the known \\(40^\\circ\\) angle, so \\(\\dfrac{30}{\\sin 40^\\circ} = \\dfrac{x}{\\sin 75^\\circ}\\) finds the side opposite \\(75^\\circ\\)."},{"t":"Lot 3: the three sides form a right triangle, so the Pythagorean theorem gives a right angle.","a":1,"why":"Reject. Squaring the sides, \\(18^2 + 24^2 = 900\\) but \\(27^2 = 729\\), and \\(900 \\neq 729\\), so there is no right angle. Adding \\(18 + 24\\) is not the test."},{"t":"Lot 4: the Law of Cosines can find any one of the angles.","a":0,"why":"Accept. With three sides (SSS), rearranging to \\(\\cos A = \\dfrac{b^2 + c^2 - a^2}{2bc}\\) gives any angle."}],"sol":"Match the rule to what is known. Lot 1 is SAS, so no side has a known opposite angle and the Law of Sines cannot start; the Law of Cosines is needed, so Reject. Lot 2 has the \\(30\\) m side opposite a known angle (AAS), so the Law of Sines works, Accept. Lot 3 fails \\(18^2 + 24^2 = 27^2\\) since \\(900 \\neq 729\\), so it is not right-angled, Reject; Lot 4 is SSS, where the Law of Cosines gives any angle, Accept."},{"id":"P-g9q4-S3-06","type":"num","proc":"formulate","band":"stretch","comp":"M9GE-IVh-j-1","stim":"<p>The science club is edging a triangular rain garden with bamboo. Two edges of \\(5\\) m and \\(8\\) m meet at the faucet corner, where the angle between them is \\(60^\\circ\\).</p>","fig":{"n":"obtri","a":{"mode":"sas","ang":"60°","s1":"5 m","s2":"8 m","base":"?"}},"stem":"Using \\(\\cos 60^\\circ = \\dfrac{1}{2}\\), how many meters of bamboo are needed for the third edge? Round to the nearest \\(0.1\\) m.","ans":7,"lo":6.9,"hi":7.1,"unit":"m","errs":[{"v":9.4,"msg":"That is \\(\\sqrt{25 + 64} = \\sqrt{89}\\), which treats the corner as a right angle. The \\(60^\\circ\\) angle needs the \\(-2(5)(8)\\cos 60^\\circ\\) term, giving \\(\\sqrt{49}\\)."},{"v":13,"msg":"You added the two edges, \\(5 + 8\\). The third edge is never the sum of the other two; use the Law of Cosines."},{"v":4.4,"msg":"You used \\(0.866\\) for \\(\\cos 60^\\circ\\), but that is \\(\\cos 30^\\circ\\). With \\(\\cos 60^\\circ = \\dfrac{1}{2}\\) you get \\(\\sqrt{49} = 7\\)."}],"generic":"Not yet. Two edges with the angle between them (SAS) call for the Law of Cosines, \\(c^2 = a^2 + b^2 - 2ab\\cos C\\).","sol":"Two sides with the angle between them (SAS) call for the Law of Cosines: \\(c^2 = 5^2 + 8^2 - 2(5)(8)\\cos 60^\\circ\\). With \\(\\cos 60^\\circ = \\dfrac{1}{2}\\), this is \\(25 + 64 - 40 = 49\\), so \\(c = 7\\) m. Taking \\(\\sqrt{25 + 64} \\approx 9.4\\) would ignore the \\(60^\\circ\\) angle and overstate the edge. The third edge needs \\(7\\) m of bamboo."},{"id":"P-g9q4-S3-EX","type":"open","set":"P-g9q4-S3-U1","proc":"formulate","band":"standard","comp":"M9GE-IVe-1","stim":"<p>The barangay hall in Sta. Elena is planning a wheelchair ramp. Batas Pambansa 344, the Accessibility Law, limits a ramp to a slope of \\(1 : 12\\).</p>","stem":"The hall must raise the floor by \\(0.6\\) m. Plan A uses a \\(5\\) m run; Plan B uses a \\(9\\) m run. In \\(2\\) to \\(3\\) sentences, first turn the \\(1 : 12\\) rule into a slope test for any ramp. Then use your test to say which plan the rule allows. Compare the slopes, not just the runs.","model":"To build the test, write any ramp's slope as rise over run and require it to be at most the limit \\(\\dfrac{1}{12} \\approx 0.083\\). Plan A gives \\(\\dfrac{0.6}{5} = 0.12\\), which is greater than \\(0.083\\), so it is too steep and the rule rejects it. Plan B gives \\(\\dfrac{0.6}{9} \\approx 0.067\\), which is below \\(0.083\\), so the rule allows it; the longer run spreads the same rise more gently.","checklist":["I turned the \\(1 : 12\\) rule into a slope test: slope at most \\(\\dfrac{1}{12} \\approx 0.083\\).","I wrote each plan's slope as rise over run.","I compared each slope with the limit, not just the run lengths.","I gave a clear verdict: Plan A fails and Plan B passes."]}]}],
    g10t1:[
      {title:'Start',level:'Warm-up and core skills',items:[
        {id:'P-g10t1-1-1',two:false,stem:'The Law of Sines relates each side of a triangle to the sine of its:',opts:['opposite angle','right angle','included angle','largest angle'],a:0,sol:'In the Law of Sines, \\(\\dfrac{a}{\\sin A} = \\dfrac{b}{\\sin B} = \\dfrac{c}{\\sin C}\\), so each side is paired with the sine of the angle opposite it. The included angle belongs to the Law of Cosines (SAS), and an oblique triangle may have no right angle at all. So each side goes with the sine of its opposite angle.',proc:'employ',band:'entry',comp:'G10T1-01'},
        {id:'P-g10t1-1-2',two:true,stim:'On a Marikina street grid, a marker is at \\((4, 3)\\).',stem:'Reflecting it over the x-axis gives:',opts:['\\((-4, 3)\\)','\\((4, -3)\\)','\\((-4, -3)\\)','\\((3, 4)\\)'],a:1,sol:'Reflection over the x-axis negates \\(y\\): \\((4, -3)\\).',proc:'employ',band:'entry',comp:'G10T1-04'},
        {id:'P-g10t1-1-3',two:false,stem:'The solution of \\(x^2 < 9\\) is:',opts:['\\(x < 3\\)','\\(x > 3\\)','\\(-3 < x < 3\\)','\\(x < -3\\) or \\(x > 3\\)'],a:2,sol:'\\(x^2 < 9\\) gives \\(-3 < x < 3\\).',proc:'employ',band:'basic',comp:'G10T1-07'},
        {id:'P-g10t1-1-4',two:false,stem:'The solution of \\(|x| < 4\\) is:',opts:['\\(x < 4\\)','\\(x > 4\\)','\\(x < -4\\) or \\(x > 4\\)','\\(-4 < x < 4\\)'],a:3,sol:'\\(|x| < 4\\) means \\(-4 < x < 4\\).',proc:'employ',band:'basic',comp:'G10T1-12'},
        {id:'P-g10t1-1-5',two:false,stem:'For a set of Marikina quiz scores, the median is also called the:',opts:['second quartile \\(Q_2\\)','first quartile \\(Q_1\\)','mode','range'],a:0,sol:'The median is the middle value, which is \\(Q_2\\).',proc:'employ',band:'entry',comp:'G10T1-13'},
        {id:'P-g10t1-1-6',two:false,stem:'An oblique triangle is a triangle that has:',opts:['a right angle','no right angle','three equal sides','an obtuse angle'],a:1,sol:'Oblique means the triangle has no right angle, so it can be acute or obtuse. A triangle with an obtuse angle is only one kind of oblique triangle, since an acute triangle is oblique too. So an oblique triangle is one with no right angle.',proc:'employ',band:'entry',comp:'G10T1-01'}
      ]},
      {title:'Build',level:'Apply and model',items:[
        {id:'P-g10t1-2-1',two:false,stim:'To find a distance across the Marikina River, a surveyor knows two sides and the included angle (SAS) of a triangle.',stem:'Which law finds the third side?',opts:['The Law of Cosines','The Law of Sines','The Pythagorean theorem','SOH-CAH-TOA'],a:0,sol:'Two sides and the included angle call for the Law of Cosines.',proc:'formulate',band:'basic',comp:'G10T1-02'},
        {id:'P-g10t1-2-2',two:true,stim:'A parade float on a Marikina street map is at \\((2, 5)\\).',stem:'Moving it by the rule \\((x + 3,\\ y - 4)\\) gives:',opts:['\\((5, 9)\\)','\\((5, 1)\\)','\\((-1, 9)\\)','\\((6, 20)\\)'],a:1,sol:'\\((2 + 3,\\ 5 - 4) = (5, 1)\\).',proc:'employ',band:'basic',comp:'G10T1-04'},
        {id:'P-g10t1-2-3',two:false,stem:'Solve \\(x^2 - 16 \\ge 0\\).',opts:['\\(-4 \\le x \\le 4\\)','\\(x \\ge 4\\) only','\\(x \\le -4\\) or \\(x \\ge 4\\)','no solution'],a:2,sol:'Roots \\(\\pm 4\\); the expression is non-negative outside them.',proc:'employ',band:'basic',comp:'G10T1-07'},
        {id:'P-g10t1-2-4',two:true,stem:'Solve \\(|x - 3| = 5\\).',opts:['\\(x = 8\\)','\\(x = 2\\)','\\(x = -2\\)','\\(x = 8\\) or \\(x = -2\\)'],a:3,sol:'\\(x - 3 = \\pm 5\\), so \\(x = 8\\) or \\(x = -2\\).',proc:'employ',band:'basic',comp:'G10T1-11'},
        {id:'P-g10t1-2-5',two:true,stim:'For a set of Marikina quiz scores, \\(Q_1 = 10\\) and \\(Q_3 = 22\\).',stem:'What is the interquartile range?',opts:['\\(12\\)','\\(32\\)','\\(16\\)','\\(6\\)'],a:0,sol:'\\(IQR = Q_3 - Q_1 = 22 - 10 = 12\\).',proc:'employ',band:'basic',comp:'G10T1-15'},
        {id:'P-g10t1-2-6',two:true,stim:'A logo on a Marikina street map is at \\((3, 2)\\).',stem:'Rotating it \\(180^\\circ\\) about the origin gives:',opts:['\\((2, 3)\\)','\\((-3, -2)\\)','\\((3, -2)\\)','\\((-3, 2)\\)'],a:1,sol:'A \\(180^\\circ\\) rotation maps \\((x, y) \\to (-x, -y) = (-3, -2)\\).',proc:'employ',band:'basic',comp:'G10T1-04'}
      ]},
      {title:'Challenge',level:'Interpret and reason',items:[
        {id:'P-g10t1-3-1',two:false,stem:'A surveyor knows two angles and one side of a triangle. Which law applies, and why?',opts:['The Law of Sines, because it pairs each side with its opposite angle','The Law of Cosines, because an angle is known','The Pythagorean theorem, because it is a triangle','Neither law applies'],a:0,sol:'With two angles and a side (AAS or ASA), the Law of Sines pairs the known side with its opposite angle.',proc:'reason',band:'basic',comp:'G10T1-01'},
        {id:'P-g10t1-3-2',two:false,stim:'The Sto. Nino gauge on the Marikina River has three alarm levels. The first alarm is 15 m (prepare). The second alarm is 16 m (prepare to evacuate). The third alarm is 18 m (forced evacuation). A barangay radio team stays on standby while the river height \\(h\\), in meters, satisfies \\(|h - 16.5| \\le 1.5\\).',stem:'Which statement describes when the radio team is on standby?',opts:['Only at or below the third alarm, \\(h \\le 18\\)','From the first alarm up to the third alarm, \\(15 \\le h \\le 18\\)','From 16.5 m up to the third alarm, \\(16.5 \\le h \\le 18\\)','At or below the first alarm, or at or above the third alarm, \\(h \\le 15\\) or \\(h \\ge 18\\)'],a:1,sol:'\\(|h - 16.5| \\le 1.5\\) means \\(-1.5 \\le h - 16.5 \\le 1.5\\), so \\(15 \\le h \\le 18\\). That band starts at the first alarm and ends at the third alarm. Choosing \\(16.5 \\le h \\le 18\\) uses only the upper side and forgets that the river can also be \\(1.5\\ \\text{m}\\) below the center. The team is on standby from the first alarm level up to the third alarm level.',proc:'interpret',band:'standard',comp:'G10T1-12'},
        {id:'P-g10t1-3-3',two:false,stim:'On a sample grid map of Riverbanks Center, Jun reflects a triangular sign over the y-axis. One corner of the sign is at \\((4, 1)\\). Jun says every point of the sign keeps its coordinates.',stem:'Which evaluation of Jun&rsquo;s claim is correct?',opts:['Correct; a reflection keeps the sign&rsquo;s size and shape, so the corner stays at \\((4, 1)\\)','Wrong; the y-coordinate changes sign, so the corner moves to \\((4, -1)\\)','Wrong; the x-coordinate changes sign, so the corner moves to \\((-4, 1)\\)','Correct; a point on the y-axis, such as \\((0, 6)\\), keeps its coordinates'],a:2,sol:'Reflection over the y-axis maps \\((x, y) \\to (-x, y)\\), so the corner \\((4, 1)\\) moves to \\((-4, 1)\\). Changing the sign of \\(y\\) to get \\((4, -1)\\) would be a reflection over the x-axis instead. Points on the y-axis stay put only because their x-coordinate is \\(0\\), and keeping size and shape does not mean the points stay in place. Jun is wrong, because each x-coordinate changes sign and the corner lands at \\((-4, 1)\\).',proc:'reason',band:'standard',comp:'G10T1-04'},
        {id:'P-g10t1-3-4',two:false,stim:'On a 40-item Sta. Elena test, Maria&rsquo;s score places her at the 90th percentile.',stem:'What does this mean?',opts:['She answered 90 items correctly','She scored 90%','She is in the top 10 students exactly','Her score is higher than about 90% of the test-takers'],a:3,sol:'A percentile gives the percent of scores a value is above.',proc:'interpret',band:'basic',comp:'G10T1-17'},
        {id:'P-g10t1-3-5',two:false,stim:'Lorna sells a snack at her sari-sari store in Malanday. A sample model for her daily profit is \\(P = -10(x - 12)(x - 18)\\) pesos. Here \\(x\\) is the selling price in pesos. Lorna claims that any price above ₱12 gives her a profit.',stem:'Which evaluation of Lorna&rsquo;s claim is correct?',opts:['She is right, because a higher price always earns more profit on each snack','She is wrong, because \\(P > 0\\) only when \\(x < 12\\) or \\(x > 18\\)','She is wrong, because \\(P > 0\\) only when \\(12 < x < 18\\), so prices above ₱18 give a loss','She is right, because at \\(x = 15\\), \\(P = 90\\), which is a profit'],a:2,sol:'Because of the \\(-10\\), the graph opens downward, so \\(P > 0\\) only between the break-even prices: \\(12 < x < 18\\). For example, at \\(x = 20\\), \\(P = -10(8)(2) = -160\\), a loss. The profit of 90 pesos at \\(x = 15\\) is true, but one price cannot prove a claim about all prices above ₱12. Lorna is wrong, because prices above ₱18 give a loss.',proc:'interpret',band:'standard',comp:'G10T1-08'},
        {id:'P-g10t1-3-6',two:false,stim:'A stall at the Marikina public market records its daily sales for 11 days, in thousands of pesos (sample data): \\(4, 5, 5, 5, 6, 6, 6, 7, 7, 7, 15\\).',stem:'Given \\(Q_1 = 5\\) and \\(Q_3 = 7\\), which statement about the value \\(15\\) is correct?',opts:['It is an outlier, simply because it is the largest value','It is an outlier, because it is above the upper fence \\(Q_3 + 1.5 \\times \\text{IQR} = 10\\)','It is not an outlier, because it was a real sale and not a recording mistake','It is not an outlier, because every value is above the lower fence \\(Q_1 - 1.5 \\times \\text{IQR} = 2\\)'],a:1,sol:'The \\(\\text{IQR} = 7 - 5 = 2\\), so \\(1.5 \\times 2 = 3\\), and the fences are \\(5 - 3 = 2\\) and \\(7 + 3 = 10\\). Since \\(15 > 10\\), the value 15 is an outlier. Checking only the lower fence says nothing about large values, and an outlier can still be a real sale. The ₱15,000 day is an outlier because it lies above the upper fence.',proc:'interpret',band:'standard',comp:'G10T1-15'}
      ]}
    ]
  };

    fbcompare:function(a){a=a||{};

      for(var k=0;k<=n;k++){var x=20+k*260/n;var big=(s.major&&k%s.major===0);o+='<line class="ln thin" x1="'+x.toFixed(1)+'" y1="'+(big?21:25)+'" x2="'+x.toFixed(1)+'" y2="'+(big?39:35)+'"/>';}

      for(var x=-6;x<=8;x++){var p=P(x,0)[0];o+='<line class="gridl" x1="'+p+'" y1="20" x2="'+p+'" y2="240"/>';}
      for(var y=-6;y<=5;y++){var q=P(0,y)[1];o+='<line class="gridl" x1="20" y1="'+q+'" x2="300" y2="'+q+'"/>';}
      o+='<line class="ln" x1="20" y1="120" x2="304" y2="120"/><line class="ln" x1="140" y1="244" x2="140" y2="16"/><text x="308" y="124">x</text><text x="146" y="14">y</text>';
      [-6,-4,-2,2,4,6,8].forEach(function(v){o+='<text x="'+P(v,0)[0]+'" y="133" text-anchor="middle" class="muted" style="font-size:10px">'+v+'</text>';});
      [-6,-4,-2,2,4].forEach(function(v){o+='<text x="135" y="'+(P(0,v)[1]+3.5)+'" text-anchor="end" class="muted" style="font-size:10px">'+v+'</text>';});
      function poly(pts,cls){return '<polygon class="'+cls+'" points="'+pts.map(function(a){var p=P(a[0],a[1]);return p[0]+','+p[1];}).join(' ')+'"/>';}
      o+=poly([[1,1],[3,1],[1,4]],'fsoft')+poly([[1,1],[3,1],[1,4]],'acc');
      o+=poly([[-1,1],[-3,1],[-1,4]],'dash2')+poly([[-1,1],[-1,3],[-4,1]],'dash')+poly([[5,-5],[7,-5],[5,-2]],'dash2');
      o+='<text x="'+P(1.55,1.9)[0]+'" y="'+P(1.55,1.9)[1]+'" class="acc-t" style="font-size:14px">T</text>';

      return o+tag(-0.45,4.45,1)+tag(5.6,-1.45,2)+tag(-4.5,1.6,3)+'</svg>';
    },
    arch:function(){
      var P=function(x,y){return [20+15*x,172-15*y];};var pts=[];
      for(var x=10-Math.sqrt(60);x<=10+Math.sqrt(60)+1e-9;x+=0.25){var y=-0.1*(x-10)*(x-10)+6;var p=P(x,Math.max(0,y));pts.push(p[0].toFixed(1)+','+p[1].toFixed(1));}
      return '<svg viewBox="0 0 340 204" role="img" aria-label="Side view of a footbridge arch over a street, not drawn to scale. The arch is highest, 6 meters, above x = 10. A truck 4.5 meters tall has its outer top corner 3 meters to the right of the center of the arch. The marker post is at x = 0 on the left sidewalk.">'+
        '<line class="ln" x1="0" y1="172" x2="340" y2="172"/><polyline class="acc" points="'+pts.join(' ')+'"/>'+
        '<line class="dash" x1="170" y1="82" x2="170" y2="172"/><text x="164" y="132" text-anchor="end">6 m</text>'+
        '<rect class="ln fsurf" x="177.5" y="104.5" width="37.5" height="67.5"/><circle class="ln fbg" cx="187" cy="172" r="5"/><circle class="ln fbg" cx="206" cy="172" r="5"/>'+
        '<text x="196" y="142" text-anchor="middle" style="font-size:11px">4.5 m</text>'+
        '<line class="ln thin" x1="170" y1="188" x2="215" y2="188"/><path class="ln thin" d="M170 183 L170 193 M215 183 L215 193"/><text x="192.5" y="201" text-anchor="middle">3 m</text>'+
        '<line class="ln bold" x1="20" y1="172" x2="20" y2="150"/><text x="24" y="190" text-anchor="middle" class="muted">post</text></svg>';
    }
  };
  /* hot spot markers: st = {sel:index|null, checked:bool, key:index, off:bool} ; indices are 0-based, labels 1-based */
  function hsMarkers(pts,st){
    var o='';
    pts.forEach(function(M,i){
      var c='hs'+(st.sel===i?' sel':'');
      if(st.checked)c='hs'+(i===st.key?' right':(st.sel===i?' miss':''));
      var live=!st.checked&&!st.off;
      o+='<g class="'+c+'"'+(live?' data-hs="'+i+'" aria-hidden="true"':'')+'>'+
        '<circle class="hit" cx="'+M[0]+'" cy="'+M[1]+'" r="22"/><circle class="hsdot" cx="'+M[0]+'" cy="'+M[1]+'" r="12"/>'+
        '<text x="'+M[0]+'" y="'+(M[1]+4.5)+'" text-anchor="middle">'+(i+1)+'</text></g>';
    });
    return o;
  }
  function figHtml(f,st){if(!f||!FIGS[f.n])return '';return '<div class="fig">'+FIGS[f.n](f.a||{},st)+(f.cap?'<p class="figcap">'+f.cap+'</p>':'')+'</div>';}

  /* ---------- Preview stage: the 10 Gate 1 samples approved on 2026-11-12 ---------- */
  var NL={lo:24.5,hi:25.5,step:0.1,major:5,labels:[24.5,25.0,25.5],dp:1};
  function nl(extra){var o={};for(var k in NL)o[k]=NL[k];for(var j in extra)o[j]=extra[j];return {n:'numline',a:o};}
  var PREVIEW={title:'New question types',items:[
    {id:'X-01',type:'mc',two:true,proc:'formulate',band:'basic',comp:'M9AL-Ig-2',
     stim:'<p>Aling Nena runs a sari-sari store in Barangay Sta. Elena, Marikina. She tried three prices for a snack pack. She wrote down how many packs she sold in one day.</p><div class="tbl-wrap"><table class="data"><tr><th scope="row">Price</th><th>&#8369;10</th><th>&#8369;12</th><th>&#8369;14</th></tr><tr><th scope="row">Packs sold in one day</th><td>60</td><td>50</td><td>40</td></tr></table></div>',
     stem:'Sales drop by the same number of packs for each 1-peso price increase. Which expression gives her daily income \\(R\\) (the total money from packs sold) at a price of \\(p\\) pesos?',
     opts:['\\(R = p(110 - 5p)\\)','\\(R = 110 - 5p\\)','\\(R = p + (110 - 5p)\\)','\\(R = p(60 - 5p)\\)'],a:0,
     why:['Packs sold \\(= 110 - 5p\\), and income is price times packs sold.','\\(110 - 5p\\) is the number of packs sold, not the money she earns.','This adds the price and the packs. Income comes from multiplying them.','This treats 60 as the sales at a price of 0 pesos. At \\(p = 10\\) it gives \\(10 \\times 10 = 100\\) pesos, not 600 pesos.'],
     sol:'Sales drop by 10 packs when the price rises by 2 pesos, so they drop 5 packs for each peso. Packs sold \\(= 60 - 5(p - 10) = 110 - 5p\\). Check: \\(p = 14\\) gives \\(110 - 70 = 40\\) packs. Income is price times packs sold, so \\(R = p(110 - 5p)\\). Check: at \\(p = 12\\), \\(R = 12 \\times 50 = 600\\) pesos.'},
    {id:'X-02',type:'claim',proc:'reason',band:'standard',comp:'M9GE-IVe-1',
     stim:'<p>The entrance of a barangay hall in Marikina is 0.75 m above the ground. Its ramp has a horizontal run of 9 m. The barangay&rsquo;s ramp rule allows a slope of at most 1 : 12, that is, at most 1 m of rise for every 12 m of horizontal run.</p><p>A kagawad wants a shorter ramp with the same 0.75 m rise but only a 6 m run.</p>'+figHtml({n:'ramp'})+
       '<div class="claimcard"><div class="who">Kagawad Reyes says</div><div class="said">&ldquo;The new ramp makes an angle of only about \\(7^\\circ\\) with the ground. That is still gentle, so it is allowed.&rdquo;</div></div>',
     stem:'Which evaluation of Kagawad Reyes&rsquo;s claim is correct?',
     opts:['He is wrong, because the new slope is \\(\\frac{0.75}{6} = \\frac{1}{8}\\), which is steeper than the allowed \\(\\frac{1}{12}\\).','He is right, because \\(7^\\circ\\) is a small angle, less than \\(10^\\circ\\).','He is right, because the rise is still 0.75 m, the same as the old ramp.','He is wrong, because every ramp must be at least 12 m long.'],a:0,
     why:['Right verdict with a valid reason.','The rule sets a slope of 1 : 12, which is about \\(4.8^\\circ\\). There is no \\(10^\\circ\\) rule.','Keeping the rise but shortening the run makes the ramp steeper.','The verdict is right but the reason is not: 1 : 12 is a ratio, not a length. A 0.5 m rise needs only a 6 m run.'],
     sol:'New slope: \\(\\dfrac{0.75}{6} = 0.125 = \\dfrac{1}{8}\\). Allowed maximum: \\(\\dfrac{1}{12} \\approx 0.083\\). Since \\(\\dfrac{1}{8} > \\dfrac{1}{12}\\), the new ramp is too steep. His angle is accurate, since \\(\\tan^{-1}(0.125) \\approx 7.1^\\circ\\), but the limit is \\(\\tan^{-1}\\left(\\dfrac{1}{12}\\right) \\approx 4.8^\\circ\\). The old ramp is exactly \\(\\dfrac{0.75}{9} = \\dfrac{1}{12}\\), so 9 m is already the shortest run the rule allows.'},
    {id:'X-03',type:'spot',proc:'reason',band:'standard',comp:'M9AL-IIg-1',
     stim:'<p>A square stall at the Marikina Public Market has a floor area of 18 square meters. Lito computed the length \\(s\\) of one side like this.</p>',
     steps:['\\(s^2 = 18\\), so \\(s = \\sqrt{18}\\)','\\(\\sqrt{18} = \\sqrt{9 \\cdot 2}\\)','\\(\\sqrt{9 \\cdot 2} = 9\\sqrt{2}\\)','\\(s \\approx 9(1.414) \\approx 12.7\\) m'],a:2,
     fix:'Correct line: \\(\\sqrt{9 \\cdot 2} = \\sqrt{9} \\cdot \\sqrt{2} = 3\\sqrt{2}\\)',
     stem:'In which step did Lito make his first error?',
     why:['Step 1 is correct. A side length is the positive square root of the area.','Step 2 is correct, since \\(18 = 9 \\times 2\\).','Only the perfect-square factor comes out of the radical, and it comes out as its square root.','Step 4 only carries the earlier error forward. The first error is before it.'],
     sol:'Steps 1 and 2 are correct. In Step 3, the factor 9 comes out of the radical as \\(\\sqrt{9} = 3\\), so \\(\\sqrt{9 \\cdot 2} = 3\\sqrt{2}\\). Then \\(s = 3\\sqrt{2} \\approx 3(1.414) \\approx 4.24\\) m. Check: \\(4.24^2 \\approx 18\\). A side of 12.7 m would give an area of about 161 square meters, far more than 18.'},
    {id:'X-04',type:'repr',proc:'formulate',band:'basic',comp:'G10T1-12',
     stim:'<p>A shoe factory in Marikina makes insoles that should be 25.0 cm long. An insole is accepted only if its length \\(L\\) is at most 0.3 cm away from 25.0 cm.</p>',
     stem:'Which number line shows all the accepted lengths \\(L\\), in centimeters?',
     opts:['Open dots at 24.7 and 25.3, shaded between them','Closed dots at 24.7 and 25.3, shaded between them','Closed dots at 24.7 and 25.3, shaded outward to the left and to the right','Closed dots at 25.0 and 25.3, shaded between them'],a:1,
     optFig:[nl({dots:[[24.7,'open'],[25.3,'open']],seg:[24.7,25.3]}),nl({dots:[[24.7,'closed'],[25.3,'closed']],seg:[24.7,25.3]}),nl({dots:[[24.7,'closed'],[25.3,'closed']],rays:[['l',24.7],['r',25.3]]}),nl({dots:[[25.0,'closed'],[25.3,'closed']],seg:[25.0,25.3]})],
     why:['Open dots leave out 24.7 and 25.3, but &ldquo;at most&rdquo; includes them.','Closed dots include both boundary lengths, and the shading covers every length in between.','Shading outward shows the rejected insoles, \\(|L - 25.0| > 0.3\\).','This checks only the longer side. Insoles up to 0.3 cm shorter are also accepted.'],
     sol:'&ldquo;At most 0.3 cm away from 25.0 cm&rdquo; means \\(|L - 25.0| \\le 0.3\\). So \\(-0.3 \\le L - 25.0 \\le 0.3\\), which gives \\(24.7 \\le L \\le 25.3\\). &ldquo;At most&rdquo; includes the boundary, so the dots are closed and the shading is between them.'},
    {id:'X-05',type:'hotspot',proc:'formulate',band:'entry',comp:'M9GE-IVd-1',
     stim:'<p>Mia stands on a raised viewing deck beside the Marikina River. Her eyes are 12 m above the water. She looks down at a banca (small boat) and up at a kite.</p>',
     stem:'Tap the angle of depression of the banca as seen by Mia.',
     hs:{n:'deck'},labels:['Angle 1','Angle 2','Angle 3','Angle 4'],a:0,
     why:['It is measured down from the horizontal line through Mia&rsquo;s eyes to her line of sight.','Angle 2 is measured from the vertical deck post, not from the horizontal.','Angle 3 goes up from the horizontal, so it is an angle of elevation.','Angle 4 has the same size as angle 1, but it is the angle of elevation of Mia as seen from the banca.'],
     sol:'An angle of depression is measured downward from the horizontal line through the observer&rsquo;s eyes, so it is angle 1. Angle 4 equals angle 1 because they are alternate interior angles between two horizontal lines, but its vertex is at the banca.'},
    {id:'X-06',type:'grid',proc:'interpret',band:'standard',comp:'G10T1-15',
     stim:'<p>A family shoe shop in Marikina recorded the pairs of shoe uppers that each of its 10 stitchers finished on one Saturday:</p><p>18, 22, 25, 25, 27, 30, 31, 34, 36, 52</p><p>Use \\(Q_1 = 24.25\\) and \\(Q_3 = 34.5\\).</p>',
     stem:'Answer Yes or No for each statement.',cols:['Yes','No'],
     rows:[{t:'The median is 28.5 pairs.',a:0,why:'The two middle values are 27 and 30, and \\(\\dfrac{27 + 30}{2} = 28.5\\).'},
           {t:'Half of the stitchers finished more than 30 pairs.',a:1,why:'Only 31, 34, 36 and 52 are above 30. That is 4 of 10, not half.'},
           {t:'The 52-pair result is an outlier by the \\(1.5 \\times \\text{IQR}\\) rule.',a:0,why:'\\(\\text{IQR} = 10.25\\), so the upper fence is \\(34.5 + 15.375 = 49.875\\), and \\(52 > 49.875\\).'},
           {t:'If the 52 is corrected to 40, the median changes.',a:1,why:'The two middle values are still 27 and 30, so the median stays 28.5.'}],
     sol:'\\(Q_1\\) and \\(Q_3\\) are given so the verdict does not depend on the quartile method. With the median-of-halves method (\\(Q_1 = 25\\), \\(Q_3 = 34\\)) the fence is 47.5, and 52 is still an outlier.'},
    {id:'X-07',type:'grid',proc:'reason',band:'standard',comp:'M9GE-IIIc-1',
     stim:'<p>A tile workshop in Marikina cuts four-sided tiles for a barangay hall floor.</p>',
     stem:'Is each statement always, sometimes or never true?',cols:['Always','Sometimes','Never'],
     rows:[{t:'If a four-sided tile has diagonals of equal length, it is a rectangle.',a:1,why:'A rectangle has equal diagonals, but so does an isosceles trapezoid.'},
           {t:'The diagonals of a rhombus-shaped tile are perpendicular.',a:0,why:'Every rhombus has perpendicular diagonals.'},
           {t:'A parallelogram-shaped tile has two consecutive angles of \\(70^\\circ\\) and \\(120^\\circ\\).',a:2,why:'Consecutive angles of a parallelogram add up to \\(180^\\circ\\), but \\(70^\\circ + 120^\\circ = 190^\\circ\\).'},
           {t:'A rhombus-shaped tile is a square.',a:1,why:'A rhombus is a square only when its angles are right angles.'}],
     sol:'A property that follows from the definition is always true. One that depends on extra conditions is sometimes true. One that contradicts a theorem is never true.'},
    {id:'X-08',type:'num',proc:'employ',band:'standard',comp:'M9GE-IIIe-1',
     stim:'<p>Paolo builds a saranggola (kite) for the Marikina River festival. Its two bamboo crossbars are 60 cm and 112 cm long and cross at right angles. The 112 cm crossbar cuts the 60 cm crossbar in half, 40 cm from its top end. String runs around the outline, joining the four ends.</p>'+figHtml({n:'kite'}),
     stem:'How many centimeters of string go around the outline? Give your answer to the nearest centimeter.',
     ans:256,lo:255.5,hi:256.5,unit:'cm',
     errs:[{v:172,msg:'172 adds the two crossbars. The string goes along the four sides of the kite, not along the crossbars.'},{v:344,msg:'344 doubles the crossbars. Find each side with the Pythagorean theorem instead.'},{v:128,msg:'128 counts only one top side and one bottom side. The outline has four sides.'}],
     generic:'Not yet. Find the length of one top side and one bottom side first.',
     sol:'Half of the 60 cm crossbar is 30 cm. Each top side is \\(\\sqrt{30^2 + 40^2} = \\sqrt{2500} = 50\\) cm. The lower part of the long crossbar is \\(112 - 40 = 72\\) cm, so each bottom side is \\(\\sqrt{30^2 + 72^2} = \\sqrt{6084} = 78\\) cm. The outline is \\(2(50 + 78) = 256\\) cm.'},
    {id:'X-09',type:'match',proc:'employ',band:'basic',comp:'G10T1-04',
     stim:'<p>A tile artist plans a triangular inlay for a plaza floor in Marikina. On the grid, 1 unit is 1 m. The original triangle T has vertices A(1, 1), B(3, 1) and C(1, 4). The artist sketches three possible positions for a copy of T and will choose only one of them.</p>'+figHtml({n:'grid9',cap:'Position 1: (&minus;1, 1), (&minus;3, 1), (&minus;1, 4). Position 2: (5, &minus;5), (7, &minus;5), (5, &minus;2). Position 3: (&minus;1, 1), (&minus;1, 3), (&minus;4, 1).'}),
     stem:'Choose the transformation that maps T onto each position.',
     choices:['reflection across the x-axis','reflection across the y-axis','rotation of 90° counterclockwise about the origin','rotation of 180° about the origin','translation'],
     parts:[{label:'Position 1',a:1,why:'\\((x, y) \\to (-x, y)\\): A(1, 1) goes to (&minus;1, 1), B(3, 1) to (&minus;3, 1), C(1, 4) to (&minus;1, 4).'},
            {label:'Position 2',a:4,why:'\\((x, y) \\to (x + 4,\\ y - 6)\\): every vertex moves 4 m right and 6 m down.'},
            {label:'Position 3',a:2,why:'\\((x, y) \\to (-y, x)\\): A(1, 1) goes to (&minus;1, 1), B(3, 1) to (&minus;1, 3), C(1, 4) to (&minus;4, 1).'}],
     sol:'A lands on (&minus;1, 1) in both Position 1 and Position 3, so all three vertices must be checked. A reflection across the x-axis would give (1, &minus;1), (3, &minus;1), (1, &minus;4), and a rotation of \\(180^\\circ\\) would give (&minus;1, &minus;1), (&minus;3, &minus;1), (&minus;1, &minus;4). Neither matches any position.'}
  ],explain:{id:'X-10',type:'open',proc:'reason',band:'stretch',comp:'M9AL-Ii-j-2',
     stim:'<p>A footbridge over a Marikina street has an arch that follows \\(y = -0.1(x - 10)^2 + 6\\). Here \\(x\\) is the horizontal distance, in meters, from a marker post on the left sidewalk, and \\(y\\) is the height of the arch, in meters, above the road. The highest point is above \\(x = 10\\).</p><p>A delivery truck is 4.5 m tall. Its top outer corner (the corner farthest from the center) will pass 3 m to the right of the arch&rsquo;s center.</p>'+figHtml({n:'arch'}),
     stem:'Will the truck pass under the arch? Explain using the equation.',
     model:'The center of the arch is at \\(x = 10\\), so the truck&rsquo;s outer corner is at \\(x = 10 + 3 = 13\\). There, \\(y = -0.1(13 - 10)^2 + 6 = -0.9 + 6 = 5.1\\) m. Since \\(5.1 > 4.5\\), the truck passes with 0.6 m to spare. The other top corner is closer to the center, where the arch is even higher.',
     checklist:['I used \\(x = 13\\), not \\(x = 3\\).','I substituted correctly and got 5.1 m.','I compared 5.1 m with the 4.5 m truck height.','I wrote a clear yes or no conclusion.']}};

  /* ---------- item helpers ---------- */
