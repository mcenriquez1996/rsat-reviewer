  var PRACTICE_TESTS=[{"id":"pt1","title":"Practice Test 1","sub":"Foundational practice","badge":"P1","secs":[{"t":"Section 1","items":[{"id":"R3-01","stem":"Mang Tonyo already has \\(397\\) shoeboxes stacked on the shelves. His helper brings in \\(5\\) more boxes one by one while Mang Tonyo continues counting aloud from \\(397\\). Which sequence shows the exact numbers Mang Tonyo says as he counts the \\(5\\) new boxes?","opts":["\\(398, 399, 300, 301, 302\\)","\\(398, 399, 400, 401, 402\\)","\\(397, 398, 399, 400, 401\\)","\\(398, 399, 400, 410, 420\\)"],"a":1,"sol":"Counting forward by \\(1\\)s starting after \\(397\\) gives \\(398, 399, 400, 401,\\) and \\(402\\).","proc":"employ","band":"entry","comp":""},{"id":"R3-02","stem":"Mang Tonyo needs to pack \"eight hundred nine\" slippers, so his assistant labeled the box \\(890\\). Is the assistant correct?","opts":["Yes, because \\(800\\) and \\(9\\) make \\(890\\).","No, because it should be written as \\(8009\\).","Yes, because \\(9\\) belongs in the tens place.","No, because it has \\(0\\) tens and should be \\(809\\)."],"a":3,"sol":"\"Eight hundred nine\" has \\(8\\) hundreds, \\(0\\) tens, and \\(9\\) ones, which is written in numerals as \\(809\\). The label \\(890\\) is wrong because it mistakenly puts the \\(9\\) in the tens place.","proc":"reason","band":"basic","comp":""},{"id":"R3-03","stem":"Maya and Leo counted \\(4\\) hundreds, \\(14\\) tens, and \\(6\\) ones of relief packs. Maya wrote \\(546\\) while Leo wrote \\(4{,}146\\). Who is correct?","opts":["Maya, because \\(10\\) tens make \\(1\\) hundred, giving \\(546\\).","Leo, because writing the digits together gives \\(4{,}146\\).","Neither, because the total is only \\(180\\).","Both, because \\(546\\) and \\(4{,}146\\) are equal."],"a":0,"sol":"Regrouping \\(14\\) tens into \\(1\\) hundred and \\(4\\) tens gives \\(400 + 100 + 40 + 6 = 546\\). Maya is correct.","proc":"reason","band":"standard","comp":""},{"id":"R3-04","stem":"Four runners have these bib numbers: \\(489\\), \\(498\\), \\(399\\), and \\(485\\). If arranged from LARGEST to SMALLEST, which number goes in the 3rd spot?","opts":["\\(485\\)","\\(489\\)","\\(498\\)","\\(399\\)"],"a":0,"sol":"Arranging the bib numbers from largest to smallest gives (498) (1st), (489) (2nd), (485) (3rd), and (399) (4th). The number in the 3rd spot is (485). (The original reviewer key marked B; corrected here to A.)","proc":"employ","band":"basic","comp":"","two":true},{"id":"R3-05","stem":"Morning sales totaled ₱\\(342\\) and afternoon sales totaled ₱\\(235\\). Which expanded form correctly shows how to find the total sales?","opts":["(300+200)+(40+30)+(2+5)=₱577","(300+200)+(4+3)+(20+50)=₱577","(30+20)+(40+30)+(2+5)=₱127","(300+200)+(40+30)+(2+5)=₱5,770"],"a":0,"sol":"Adding by place value: (300 + 200) + (40 + 30) + (2 + 5) = 500 + 70 + 7 = ₱577.","proc":"formulate","band":"standard","comp":""},{"id":"R3-06","stem":"Ana saves money for school supplies. She has \\(8\\) ten-peso bills and \\(3\\) one-peso coins, for a total of ₱\\(83\\). She bought a notebook and a pencil that cost ₱\\(56\\). How much money is left to Ana after paying?","opts":["\\(27\\) pesos","\\(33\\) pesos","\\(37\\) pesos","\\(39\\) pesos"],"a":0,"sol":"Subtract the cost of the supplies from Ana's total money: ₱83 - ₱56 = ₱27.","proc":"employ","band":"basic","comp":"","two":true},{"id":"R3-07","stem":"Leo has four ₱\\(20\\)-coins, five ₱\\(10\\)-coins, seven ₱\\(5\\)-coins, and eight ₱\\(1\\)-coins. Does he have enough to buy a ₱\\(175\\) gift?","opts":["Yes, because his coins total ₱\\(173\\).","No, because his coins total ₱\\(173\\), which is ₱\\(2\\) short.","Yes, because his coins total ₱\\(183\\).","No, because he only has \\(24\\) coins in all."],"a":1,"sol":"Leo's total money is (4 × ₱20) + (5 × ₱10) + (7 × ₱5) + (8 × ₱1) = ₱80 + ₱50 + ₱35 + ₱8 = ₱173, which is ₱\\(2\\) short of ₱\\(175\\).","proc":"reason","band":"standard","comp":""},{"id":"R3-09","stem":"During disaster preparedness, learners study an evacuation map with scale \\(1\\text{ cm} = 200\\text{ m}\\). The marked evacuation route from the school to higher ground measures \\(11.5\\) cm on the map. A \\(2\\)-cm portion of that route is reported flooded and impassable. Rescuers mark an alternate detour that measures \\(3.2\\) cm on the same map to replace the flooded portion. What actual distance must evacuees travel using the safe route?","opts":["\\(2.30\\) kilometers must be traveled by evacuees","\\(1.90\\) kilometers must be traveled by evacuees","\\(2.94\\) kilometers must be traveled by evacuees","\\(2.54\\) kilometers must be traveled by evacuees"],"a":3,"sol":"The new map distance is \\(11.5\\text{ cm} - 2\\text{ cm} + 3.2\\text{ cm} = 12.7\\text{ cm}\\). Converting with the scale gives the actual distance \\(12.7 \\times 200\\text{ m} = 2{,}540\\text{ m}\\), which equals \\(2.54\\) kilometers.","proc":"employ","band":"stretch","comp":""},{"id":"R3-10","stem":"Leo ran \\(350\\) meters from the Playground toward the Bridge. Mia ran \\(125\\) meters less than Leo. How many meters did Mia run?","opts":["\\(225\\) m","\\(235\\) m","\\(475\\) m","\\(275\\) m"],"a":0,"sol":"Subtract \\(125\\) meters from Leo's distance: \\(350\\text{ m} - 125\\text{ m} = 225\\text{ m}\\).","proc":"employ","band":"basic","comp":"","two":true},{"id":"R3-11","stem":"Ana has a \\(90\\)-centimeter red ribbon. She cuts off \\(35\\) centimeters for her project and gives \\(28\\) centimeters to Carlo. How much ribbon does Ana have left?","opts":["\\(63\\) cm","\\(55\\) cm","\\(27\\) cm","\\(37\\) cm"],"a":2,"sol":"Subtract the piece cut and the piece given away from the total length: \\(90\\text{ cm} - 35\\text{ cm} - 28\\text{ cm} = 27\\text{ cm}\\).","proc":"employ","band":"standard","comp":"","two":true}]},{"t":"Section 2","items":[{"id":"R3-12","stem":"Juan wants to buy \\(5\\) notebooks for school. If each notebook costs ₱\\(10\\), what is the total amount he needs to pay?","opts":["₱\\(15\\)","₱\\(50\\)","₱\\(25\\)","₱\\(100\\)"],"a":1,"sol":"Multiply the number of notebooks by the price per notebook: 5 × ₱10 = ₱50.","proc":"employ","band":"entry","comp":"","two":true},{"id":"R3-13","stem":"Mother saved ₱\\(4\\) every day for \\(3\\) days. How much money did Mother save in total?","opts":["₱\\(7\\)","₱\\(16\\)","₱\\(12\\)","₱\\(20\\)"],"a":2,"sol":"Multiply the daily savings by the number of days: ₱4 × 3 = ₱12.","proc":"employ","band":"entry","comp":"","two":true},{"id":"R3-14","stem":"Pedro has ₱\\(20\\) and wants to divide it equally between his \\(2\\) siblings. How much money will each sibling receive?","opts":["₱\\(5\\)","₱\\(10\\)","₱\\(12\\)","₱\\(15\\)"],"a":1,"sol":"Divide the total amount equally between the \\(2\\) siblings: ₱20 ÷ 2 = ₱10.","proc":"employ","band":"basic","comp":"","two":true},{"id":"R3-15","stem":"Ana saves ₱\\(15\\) on Monday, ₱\\(20\\) on Tuesday, and ₱\\(25\\) on Wednesday. If she continues saving this way, how much will she save on Friday?","opts":["₱\\(30\\)","₱\\(35\\)","₱\\(40\\)","₱\\(45\\)"],"a":1,"sol":"The savings increase by ₱\\(5\\) each day: Monday (₱\\(15\\)), Tuesday (₱\\(20\\)), Wednesday (₱\\(25\\)), Thursday (₱\\(30\\)), and Friday (₱\\(35\\)).","proc":"interpret","band":"basic","comp":"","two":true},{"id":"R3-16","stem":"A teacher has 15 pencils to distribute equally among 5 groups of students. How many pencils will each group receive?","opts":["3 pencils","5 pencils","4 pencils","10 pencils"],"a":0,"sol":"Divide the total number of pencils equally among the 5 groups: \\(15 \\div 5 = 3\\) pencils per group.","proc":"employ","band":"basic","comp":"","two":true},{"id":"R3-17","stem":"In a line of people, Gio is in the 37th position. The people standing right after him, in order, are Clara, Zoey, and Mark. Who is in the 40th position?","opts":["Clara","Krystal","Mark","Zoey"],"a":2,"sol":"Following the order in the picture starting from Gio (37th): Clara is 38th, Zoey is 39th, and Mark is 40th. Therefore, Mark stands in the 40th position.","proc":"interpret","band":"basic","comp":"","two":true},{"id":"R3-18","stem":"Juliet covers her study table using colorful square tiles. If the study table measures 4 units long and 4 units wide, which calculation correctly shows the number of square units (area) needed?","opts":["\\(4 + 4 = 8\\) square units","\\(4 \\times 4 = 16\\) square units","\\(4 + 4 + 4 = 12\\) square units","\\(4 \\times 2 = 8\\) square units"],"a":1,"sol":"The area of a square is found by multiplying the length by the width: \\(4 \\times 4 = 16\\) square units.","proc":"employ","band":"basic","comp":"","two":true},{"id":"R3-19","stem":"During the school parade, Sapphire is 56th in line. Alexa is standing 5 places behind her. What is Alexa's position in line?","opts":["59th","60th","61st","62nd"],"a":2,"sol":"Counting 5 places behind the 56th position: \\(56 + 5 = 61\\), so Alexa is in the 61st position.","proc":"employ","band":"basic","comp":"","two":true},{"id":"R3-20","stem":"Teacher Gem wants her class to build the number \\(4{,}208\\) using Base-10 blocks (thousand-cubes, hundred-flats, ten-rods, and unit-cubes). Which group of blocks correctly shows this number?","opts":["4 thousand-cubes, 2 hundred-flats, 0 ten-rods, and 8 unit-cubes","4 thousand-cubes, 2 hundred-flats, 8 ten-rods, and 0 unit-cubes","4 thousand-cubes, 0 hundred-flats, 2 ten-rods, and 8 unit-cubes","2 thousand-cubes, 4 hundred-flats, 0 ten-rods, and 8 unit-cubes"],"a":0,"sol":"The number \\(4{,}208\\) is made up of 4 thousands, 2 hundreds, 0 tens, and 8 ones. The correct group therefore shows 4 thousand-cubes (4,000), 2 hundred-flats (200), 0 ten-rods (0), and 8 unit-cubes (8), which together represent 4,208.","proc":"interpret","band":"standard","comp":""},{"id":"R3-21","stem":"Ronald represents \\(9{,}056\\) in different ways. I. First, he wrote \\(9{,}000 + 50 + 6\\). II. Second, he wrote 9 thousands, 5 tens, and 6 ones. III. Third, he wrote nine thousand, fifty-six. Which of the representations are TRUE?","opts":["I and II only","II and III only","I and III only","I, II, and III"],"a":3,"sol":"All three statements correctly represent \\(9{,}056\\): statement I is its expanded form, statement II is its place-value form (9 thousands, 5 tens, and 6 ones), and statement III is its word form. Therefore, I, II, and III are all true.","proc":"reason","band":"standard","comp":"","two":true}]},{"t":"Section 3","items":[{"id":"R3-22","stem":"Aling Nena baked 6 trays of pandesal. Each tray holds 12 pieces. If she sold 50 pieces in the morning, how many pieces of pandesal were left?","opts":["18","22","62","72"],"a":1,"sol":"First find the total number of pieces baked: \\(6 \\times 12 = 72\\). Then subtract the amount sold: \\(72 - 50 = 22\\) pieces left.","proc":"employ","band":"standard","comp":"","two":true},{"id":"R3-23","stem":"Look at the number pattern on the classroom wall: \\(45, 52, 59, 66, \\underline{\\quad}\\). What number should be written on the blank to continue the pattern?","opts":["71","72","73","74"],"a":2,"sol":"The pattern increases by adding 7 to each previous number: \\(66 + 7 = 73\\).","proc":"interpret","band":"basic","comp":"","two":true},{"id":"R3-24","stem":"Mother cut a cassava cake into 6 equal slices. Ben ate 2 slices and Mara ate 3 slices. What fraction of the cassava cake was eaten in all?","opts":["\\(\\dfrac{1}{6}\\)","\\(\\dfrac{5}{6}\\)","\\(\\dfrac{5}{12}\\)","\\(\\dfrac{6}{6}\\)"],"a":1,"sol":"Add the fractions of the cake eaten by Ben and Mara: \\(\\dfrac{2}{6} + \\dfrac{3}{6} = \\dfrac{5}{6}\\).","proc":"employ","band":"basic","comp":"","two":true},{"id":"R3-25","stem":"Three friends each drank a fraction of a liter of juice: Sam drank \\(\\dfrac{3}{8}\\) L, Tin drank \\(\\dfrac{5}{8}\\) L, and Gio drank \\(\\dfrac{2}{8}\\) L. Who drank the greatest amount of juice?","opts":["Sam","Tin","Gio","They drank equal amounts."],"a":1,"sol":"Since the fractions have the same denominator, compare their numerators. \\(\\dfrac{5}{8}\\) has the largest numerator, so Tin drank the greatest amount of juice.","proc":"interpret","band":"basic","comp":"","two":true},{"id":"R3-26","stem":"Rico had \\(\\dfrac{7}{10}\\) meter of ribbon. He used \\(\\dfrac{4}{10}\\) meter to wrap a gift. How much ribbon was left?","opts":["\\(\\dfrac{3}{10}\\) meter","\\(\\dfrac{11}{10}\\) meters","\\(\\dfrac{3}{20}\\) meter","\\(\\dfrac{4}{10}\\) meter"],"a":0,"sol":"Subtract the ribbon used from the initial length: \\(\\dfrac{7}{10} - \\dfrac{4}{10} = \\dfrac{3}{10}\\) meter.","proc":"employ","band":"basic","comp":"","two":true},{"id":"R3-27","stem":"A bus left Quezon City at 7:45 AM and arrived in Bulacan at 9:15 AM. How long was the trip?","opts":["1 hour and 15 minutes","1 hour and 30 minutes","2 hours and 15 minutes","2 hours and 30 minutes"],"a":1,"sol":"From 7:45 AM to 8:45 AM is 1 hour, and from 8:45 AM to 9:15 AM is 30 minutes, for a total of 1 hour and 30 minutes.","proc":"employ","band":"standard","comp":"","two":true},{"id":"R3-28","stem":"Mr. Cruz wants to put tiles on his rectangular bathroom floor that is 4 meters long and 3 meters wide. What is the area of the floor?","opts":["7 sq. meters","12 sq. meters","14 sq. meters","24 sq. meters"],"a":1,"sol":"The area of a rectangle is found by multiplying length by width: \\(4 \\text{ m} \\times 3 \\text{ m} = 12\\) square meters.","proc":"employ","band":"basic","comp":"","two":true},{"id":"R3-30","stem":"The number of visitors at the Manila Ocean Park over three days was recorded as follows: Friday had \\(3{,}450\\) visitors, Saturday had \\(4{,}120\\) visitors, and Sunday had \\(3{,}890\\) visitors. Which shows the visitor counts arranged from greatest to least?","opts":["\\(3{,}450\\); \\(3{,}890\\); \\(4{,}120\\)","\\(4{,}120\\); \\(3{,}450\\); \\(3{,}890\\)","\\(4{,}120\\); \\(3{,}890\\); \\(3{,}450\\)","\\(3{,}890\\); \\(4{,}120\\); \\(3{,}450\\)"],"a":2,"sol":"Arranging the visitor counts from greatest to least gives: \\(4{,}120\\) (Saturday), \\(3{,}890\\) (Sunday), and \\(3{,}450\\) (Friday).","proc":"interpret","band":"basic","comp":"","two":true}]}]},{"id":"pt2","title":"Practice Test 2","sub":"Intermediate practice","badge":"P2","secs":[{"t":"Section 1","items":[{"id":"R6-01","stem":"An international flight schedule lists an arrival time of 00:00 at Manila Airport. What is the corresponding time of 00:00 on a standard 12-hour analog clock?","opts":["12 noon","12 midnight","1:00 am","1:00 pm"],"a":1,"sol":"In 24-hour clock notation, 00:00 marks the start of a new day, which corresponds to 12:00 midnight on a 12-hour clock.","proc":"interpret","band":"entry","comp":"","two":true},{"id":"R6-02","stem":"Carlo has two job interviews: one at 9:00 AM Philippine time, and another at 2:00 PM in Berlin, Germany (UTC+2). Will the schedules overlap or conflict?","opts":["No, because the two countries have different time zones","Yes, because the two countries have different time zones","Yes, because the two countries have the same time zones","Yes, because Philippines is ahead of time than Germany"],"a":0,"sol":"Manila (UTC+8) is 6 hours ahead of Berlin (UTC+2). The 2:00 PM Berlin interview equals 8:00 PM Manila time, since \\(14{:}00+6=20{:}00\\). Because that is well after Carlo's 9:00 AM Philippine interview, the two schedules do not overlap.","proc":"reason","band":"standard","comp":""},{"id":"R6-03","stem":"A store manager evaluates an inventory formula given by \\((4+8)\\times4\\div4-9=N\\). What is the result of evaluating this mathematical expression?","opts":["0","3","5","7"],"a":1,"sol":"Following the order of operations (GEMDAS/PEMDAS), first evaluate the parentheses: \\((4+8)=12\\). Then do multiplication and division from left to right: \\(12\\times4=48\\), then \\(48\\div4=12\\). Finally perform the subtraction: \\(12-9=3\\).","proc":"employ","band":"basic","comp":"","two":true},{"id":"R6-04","stem":"Maya is following a recipe that calls for \\(\\dfrac{3}{4}\\) cup of all-purpose flour, and she wants to make only half of the recipe. Which mathematical operation must Maya use to find the exact amount of flour needed for half of the recipe?","opts":["Addition","Subtraction","Multiplication","Division"],"a":2,"sol":"Finding a fraction of a given quantity, such as \\(\\dfrac{1}{2}\\) of the recipe, requires multiplication.","proc":"formulate","band":"basic","comp":"","two":true},{"id":"R6-05","stem":"Maya is following a recipe that calls for \\(\\dfrac{3}{4}\\) cup of all-purpose flour. How many cups of all-purpose flour should Maya use for \\(\\dfrac{1}{2}\\) of the recipe?","opts":["\\(\\dfrac{3}{8}\\) cup","\\(\\dfrac{1}{8}\\) cup","\\(\\dfrac{3}{6}\\) cup","\\(\\dfrac{2}{6}\\) cup"],"a":0,"sol":"Multiply the amount of flour needed by \\(\\dfrac{1}{2}\\): \\(\\dfrac{3}{4}\\times\\dfrac{1}{2}=\\dfrac{3}{8}\\) cup.","proc":"employ","band":"standard","comp":"","two":true},{"id":"R6-06","stem":"Kyle took a 50-item test in Mathematics. He answered \\(\\dfrac{4}{5}\\) of it correctly. How many items did he answer correctly?","opts":["35 items","40 items","45 items","46 items"],"a":1,"sol":"Multiply the fraction by the total number of items: \\(\\dfrac{4}{5}\\times50=\\dfrac{200}{5}=40\\) items.","proc":"employ","band":"basic","comp":"","two":true},{"id":"R6-07","stem":"Solve for the area of a trapezoid whose parallel sides (bases) measure \\(3\\) m and \\(6\\) m and whose height is \\(4\\) m.","opts":["13 m\\(^{2}\\)","15 m\\(^{2}\\)","18 m\\(^{2}\\)","36 m\\(^{2}\\)"],"a":2,"sol":"The area of a trapezoid is \\(A=\\dfrac{b_{1}+b_{2}}{2}\\times h\\). Substituting the measurements gives \\(A=\\dfrac{3+6}{2}\\times4=\\dfrac{9}{2}\\times4=4.5\\times4=18\\) m\\(^{2}\\).","proc":"employ","band":"standard","comp":"","two":true},{"id":"R6-08","stem":"A bar model shows a rectangle divided into 8 equal parts, where 6 of the parts are shaded, representing \\(\\dfrac{3}{4}\\) of the whole bar. How many eighths (\\(\\dfrac{1}{8}\\) units) are contained in \\(\\dfrac{3}{4}\\)?","opts":["6","7","8","9"],"a":0,"sol":"Rewrite \\(\\dfrac{3}{4}\\) with a denominator of 8: \\(\\dfrac{3}{4}=\\dfrac{3\\times2}{4\\times2}=\\dfrac{6}{8}\\). As shown by the 6 shaded parts in the bar model, there are 6 eighths (\\(\\dfrac{1}{8}\\) units) in \\(\\dfrac{3}{4}\\).","proc":"interpret","band":"basic","comp":"","two":true},{"id":"R6-09","stem":"Evelyn bought a 20-kilogram sack of rice for her family. If her household consumes \\(2\\dfrac{1}{2}\\) kilograms of rice per day, how long will the supply last?","opts":["6 days","7 days","8 days","9 days"],"a":2,"sol":"Divide the total rice by the daily consumption: \\(20\\div2\\dfrac{1}{2}\\). Convert the mixed number to an improper fraction, \\(2\\dfrac{1}{2}=\\dfrac{5}{2}\\), then multiply by the reciprocal: \\(20\\times\\dfrac{2}{5}=\\dfrac{40}{5}=8\\) days.","proc":"employ","band":"standard","comp":"","two":true},{"id":"R6-10","stem":"What is the place value of the digit 1 in \\(908.176\\)?","opts":["thousandths","hundredths","tenths","ones"],"a":2,"sol":"In the decimal \\(908.176\\), the first digit to the right of the decimal point (the 1) is in the tenths place.","proc":"interpret","band":"entry","comp":"","two":true}]},{"t":"Section 2","items":[{"id":"R6-11","stem":"How is \"forty-eight thousandths\" written in standard decimal notation?","opts":["0.048","0.48","0.480","48000"],"a":0,"sol":"Thousandths refers to the third decimal place to the right of the decimal point. Writing 48 so that it ends in the thousandths place gives \\(0.048\\).","proc":"interpret","band":"basic","comp":"","two":true},{"id":"R6-12","stem":"Which decimal is equivalent to \\(\\dfrac{4}{1000}\\)?","opts":["0.04","0.4","0.004","0.0004"],"a":2,"sol":"Four thousandths, \\(\\dfrac{4}{1000}\\), is written in decimal form as \\(0.004\\).","proc":"interpret","band":"basic","comp":"","two":true},{"id":"R6-13","stem":"A coach records sprint times in seconds relative to a benchmark: \\(0.5\\), \\(0.05\\), \\(0.75\\), and \\(0.57\\). Which of these decimal values has the highest numeric value?","opts":["0.5","0.05","0.75","0.57"],"a":2,"sol":"Compare the tenths place of each decimal: \\(0.75\\) has a 7 in the tenths place, which is greater than the 5 in \\(0.5\\) and \\(0.57\\) and the 0 in \\(0.05\\). Thus \\(0.75\\) has the highest numeric value.","proc":"interpret","band":"basic","comp":"","two":true},{"id":"R6-14","stem":"A grocery store cashier adds two item prices: ₱6.876 and ₱3.265. What is the exact sum of \\(6.876+3.265\\)?","opts":["10.141","10.414","9.114","9.411"],"a":0,"sol":"Align the decimal points and add: \\(6.876+3.265=10.141\\).","proc":"employ","band":"basic","comp":"","two":true},{"id":"R6-15","stem":"A shopkeeper packs pencils in bundles of 5. Which number of pencils can be packed with none left over?","opts":["132","245","318","421"],"a":1,"sol":"A number is divisible by 5 (leaving none left over) only if its last digit is 0 or 5. Among the choices, 245 ends in 5, so it can be packed into bundles of 5 with no pencils remaining.","proc":"employ","band":"basic","comp":"","two":true},{"id":"R6-16","stem":"Lara uses the Sieve of Eratosthenes to check 29. After crossing out multiples of smaller prime numbers, 29 remains. What does this tell her?","opts":["29 has no factors.","29 is divisible by 10.","29 is a prime number.","29 is a composite number."],"a":2,"sol":"In the Sieve of Eratosthenes, any number that remains uncrossed after eliminating the multiples of smaller primes is itself prime, meaning it is greater than 1 and has only two factors, 1 and itself. Since 29 remains, Lara knows that 29 is a prime number.","proc":"interpret","band":"standard","comp":"","two":true},{"id":"R6-17","stem":"A tricycle driver in Marikina City earns ₱37 per trip. He notices that 37 can only be divided evenly by 1 and 37. What type of number is 37 based on its number of factors?","opts":["Prime number","Composite number","Decimal number","Even number"],"a":0,"sol":"A number that can be divided evenly only by 1 and itself fits the definition of a prime number. Since 37 has exactly two factors, 1 and 37, it is a prime number.","proc":"reason","band":"basic","comp":"","two":true},{"id":"R6-18","stem":"Which type of graph is best suited for displaying continuous data changes over a period?","opts":["Line graph","Bar graph","Picture graph","Tally chart"],"a":0,"sol":"A line graph is best used to show continuous trends and changes over a period of time, because the connected points reveal how a value rises and falls across the interval.","proc":"reason","band":"basic","comp":"","two":true},{"id":"R6-19","stem":"The number of boys and girls who like math, science, and English is given. Which graphical representation is most appropriate to clearly compare the preferences of boys and girls across all three subjects side by side?","opts":["Single bar graph","Picture graph","Single line graph","Double bar graph"],"a":3,"sol":"A double bar graph uses two paired bars per category, which makes it ideal for comparing two distinct groups, boys and girls, side by side across multiple subjects. The single-group options cannot display both groups together for direct comparison.","proc":"reason","band":"standard","comp":"","two":true},{"id":"R6-20","stem":"A scientist multiplies two laboratory readings: \\(1.2\\) and \\(0.34\\). Without performing the full multiplication, how many decimal places must the final product contain?","opts":["2 decimal places","3 decimal places","4 decimal places","6 decimal places"],"a":1,"sol":"To find the number of decimal places in a product, add the decimal places of both factors. Here \\(1.2\\) has 1 decimal place and \\(0.34\\) has 2 decimal places, so the product must contain \\(1+2=3\\) decimal places.","proc":"reason","band":"standard","comp":"","two":true}]},{"t":"Section 3","items":[{"id":"R6-21","stem":"Which of the following division operations does NOT yield a terminating decimal?","opts":["\\(7.20 \\div 4\\)","\\(8.25 \\div 6\\)","\\(5.33 \\div 7\\)","\\(9.99 \\div 3\\)"],"a":2,"sol":"Work out each quotient exactly: \\(7.20 \\div 4 = 1.8\\), \\(8.25 \\div 6 = 1.375\\), and \\(9.99 \\div 3 = 3.33\\) all stop (terminate). Only \\(5.33 \\div 7 = 0.761428571\\ldots\\) keeps repeating without ending, because as a fraction it is \\(\\frac{533}{700}\\) and \\(700\\) still has a factor of \\(7\\) (not only 2s and 5s), so it gives a non-terminating (repeating) decimal.","proc":"reason","band":"standard","comp":"","two":true},{"id":"R6-22","stem":"Maria bought fruits worth ₱45.75 and paid ₱61.50. How much change did she receive?","opts":["₱15.25","₱15.75","₱16.75","₱17.25"],"a":1,"sol":"Subtract the cost of the fruits from the amount paid: ₱61.50 - ₱45.75 = ₱15.75. Maria received ₱15.75 in change.","proc":"employ","band":"basic","comp":"","two":true},{"id":"R6-23","stem":"Which of the following statements correctly distinguishes a cube from a general rectangular prism?","opts":["A cube has 6 faces while a rectangular prism has only 4 faces.","A rectangular prism has vertices, but a cube only has curved edges.","A cube is a 3D figure, while a rectangular prism is a 2D flat figure.","Every face of a cube must be an identical square, while a rectangular prism can have rectangular faces with different lengths and widths."],"a":3,"sol":"A cube is a special rectangular prism in which all 6 faces are identical squares with equal length, width, and height. A general rectangular prism may have rectangular faces of differing dimensions, which is the true distinguishing feature.","proc":"reason","band":"standard","comp":""},{"id":"R6-24","stem":"Leira purchased an aquarium measuring 5 decimeters in length, 3 decimeters in width, and 2 decimeters in height. What is the volume of the aquarium?","opts":["\\(10\\ \\mathrm{dm}^{3}\\)","\\(11\\ \\mathrm{dm}^{3}\\)","\\(17\\ \\mathrm{dm}^{3}\\)","\\(30\\ \\mathrm{dm}^{3}\\)"],"a":3,"sol":"Use the volume formula \\(V = l \\times w \\times h\\). Substituting the measurements gives \\(V = 5\\ \\mathrm{dm} \\times 3\\ \\mathrm{dm} \\times 2\\ \\mathrm{dm} = 30\\ \\mathrm{dm}^{3}\\).","proc":"employ","band":"basic","comp":"","two":true},{"id":"R6-25","stem":"A wooden packing crate has interior measurements of 50 cm in length, 20 cm in width, and 60 cm in height. What is the total internal storage volume of the crate?","opts":["\\(60\\ \\mathrm{cm}^{3}\\)","\\(130\\ \\mathrm{cm}^{3}\\)","\\(60{,}000\\ \\mathrm{cm}^{3}\\)","\\(120{,}000\\ \\mathrm{cm}^{3}\\)"],"a":2,"sol":"Multiply the length, width, and height to find the volume: \\(V = 50\\ \\mathrm{cm} \\times 20\\ \\mathrm{cm} \\times 60\\ \\mathrm{cm} = 60{,}000\\ \\mathrm{cm}^{3}\\).","proc":"employ","band":"standard","comp":"","two":true},{"id":"R6-26","stem":"Marco bought 1.5 kilograms of mangoes at ₱120.50 per kilogram and 3 packs of biscuits at ₱25.75 per pack. If he paid with a ₱500 bill, how much change did he get?","opts":["₱242.00","₱258.00","₱342.00","₱418.25"],"a":0,"sol":"The mangoes cost 1.5 × ₱120.50 = ₱180.75 and the biscuits cost 3 × ₱25.75 = ₱77.25, for a total of ₱180.75 + ₱77.25 = ₱258.00. His change from the ₱500 bill is ₱500.00 - ₱258.00 = ₱242.00.","proc":"employ","band":"standard","comp":"","two":true},{"id":"R6-27","stem":"The Varias family saved ₱1,250.75 in January, ₱980.50 in February, and ₱1,145.25 in March. They used ₱2,500.00 to buy a washing machine. How much savings remained?","opts":["₱875.50","₱876.50","₱2,500.00","₱3,376.50"],"a":1,"sol":"First total the three months of savings: ₱1,250.75 + ₱980.50 + ₱1,145.25 = ₱3,376.50. Then subtract the cost of the washing machine: ₱3,376.50 - ₱2,500.00 = ₱876.50.","proc":"employ","band":"standard","comp":"","two":true},{"id":"R6-28","stem":"Mrs. Cruz bought 4.5 kg of rice and packed it equally into 5 bags. How many kilograms of rice were placed in each bag?","opts":["0.8 kg","0.9 kg","1.0 kg","1.1 kg"],"a":1,"sol":"Divide the total weight of rice by the number of bags: \\(4.5\\ \\mathrm{kg} \\div 5 = 0.9\\ \\mathrm{kg}\\) per bag.","proc":"employ","band":"basic","comp":"","two":true},{"id":"R6-29","stem":"A windmill blade turns one-fourth of a complete turn. What transformation occurred?","opts":["Rotation","Reflection","Translation","Tessellation"],"a":0,"sol":"Turning an object around a fixed central point, as a windmill blade does when it rotates one-fourth of a complete turn, is called a rotation.","proc":"employ","band":"basic","comp":"","two":true},{"id":"R6-30","stem":"Which pair of shapes can both tessellate a plane?","opts":["Circle and oval","Triangle and square","Pentagon and circle","Oval and hexagon"],"a":1,"sol":"Regular triangles (interior angle \\(60^\\circ\\)) and squares (interior angle \\(90^\\circ\\)) have angles that evenly divide \\(360^\\circ\\), allowing them to tessellate a flat plane completely without gaps or overlaps.","proc":"reason","band":"standard","comp":"","two":true}]},{"t":"Section 4","items":[{"id":"R6-31","stem":"Which mathematical sentence represents three groups of one-half?","opts":["\\(3+\\dfrac{1}{2}\\)","\\(3\\times\\dfrac{1}{2}\\)","\\(3-\\dfrac{1}{2}\\)","\\(3\\div\\dfrac{1}{2}\\)"],"a":1,"sol":"\"Three groups of one-half\" translates directly to repeated addition, or equivalently multiplication, giving \\(3\\times\\dfrac{1}{2}\\).","proc":"formulate","band":"basic","comp":"","two":true},{"id":"R6-32","stem":"In a class of forty-five students, twenty-seven are boys and the rest are girls. What fraction of the class are girls?","opts":["Three-fifths","Two-thirds","Two-fifths","Three-fourths"],"a":2,"sol":"The number of girls is \\(45-27=18\\), so the fraction of girls is \\(\\dfrac{18}{45}\\). Dividing the numerator and denominator by 9 simplifies this to \\(\\dfrac{2}{5}\\), or two-fifths.","proc":"employ","band":"basic","comp":"","two":true},{"id":"R6-33","stem":"Carlo is helping his mother prepare food packs for a community outreach program. Each food pack requires \\(2\\dfrac{1}{2}\\) kilograms of rice, and they need to prepare 4 food packs. To find the total amount of rice needed, Carlo solved \\(2\\dfrac{1}{2}\\times 4\\). Which step correctly explains how Carlo will obtain the product?","opts":["Carlo will add 5 and 4 before multiplying.","Carlo will multiply only the denominators.","Carlo will divide 5 by 2 before multiplying by 4.","Carlo will convert the mixed number to an improper fraction and then multiply."],"a":3,"sol":"To multiply a mixed number such as \\(2\\dfrac{1}{2}\\) by the whole number 4, you first convert the mixed number into the improper fraction \\(\\dfrac{5}{2}\\) and then multiply, giving \\(\\dfrac{5}{2}\\times 4=10\\) kilograms.","proc":"formulate","band":"standard","comp":""},{"id":"R6-34","stem":"Which expression correctly solves the problem: \"A 5-meter ribbon is cut into pieces that are \\(\\dfrac{1}{5}\\) meter long\"?","opts":["\\(5\\times\\dfrac{1}{5}\\)","\\(5+\\dfrac{1}{5}\\)","\\(5\\div\\dfrac{1}{5}\\)","\\(5-\\dfrac{1}{5}\\)"],"a":2,"sol":"Cutting a total length of 5 meters into equal smaller pieces of \\(\\dfrac{1}{5}\\) meter each is a measurement-division situation, so the correct expression is \\(5\\div\\dfrac{1}{5}\\).","proc":"formulate","band":"standard","comp":"","two":true},{"id":"R6-35","stem":"In a sports club, the ratio of boys to girls is recorded as \\(3:5\\). What is the inverse ratio of girls to boys in the same club?","opts":["\\(3:5\\)","\\(5:3\\)","\\(8:3\\)","\\(5:8\\)"],"a":1,"sol":"The ratio of boys to girls is \\(3:5\\). Reversing the order to express girls to boys simply swaps the terms, giving \\(5:3\\).","proc":"employ","band":"basic","comp":"","two":true},{"id":"R6-36","stem":"A fruit basket contains 6 fresh apples and 9 fresh oranges. What is the ratio of apples to oranges in simplest form?","opts":["\\(2:3\\)","\\(3:2\\)","\\(6:15\\)","\\(9:6\\)"],"a":0,"sol":"The ratio of apples to oranges is \\(6:9\\). Dividing both terms by their greatest common factor, 3, gives the simplest form \\(2:3\\).","proc":"employ","band":"basic","comp":"","two":true},{"id":"R6-37","stem":"A teacher asks students to identify a ratio that is mathematically equivalent to \\(4:6\\). Which is the equivalent ratio?","opts":["\\(2:3\\)","\\(3:4\\)","\\(6:8\\)","\\(8:10\\)"],"a":0,"sol":"Dividing both terms of \\(4:6\\) by their common factor 2 reduces it to the equivalent ratio \\(2:3\\).","proc":"employ","band":"basic","comp":"","two":true},{"id":"R6-38","stem":"In a game jar, the ratio of red marbles to blue marbles is \\(2:7\\). What fraction of the total marble collection is red?","opts":["\\(\\dfrac{2}{7}\\)","\\(\\dfrac{2}{9}\\)","\\(\\dfrac{7}{9}\\)","\\(\\dfrac{9}{2}\\)"],"a":1,"sol":"The total number of parts in the ratio is \\(2+7=9\\). The red marbles make up 2 of those 9 parts, so the fraction of the collection that is red is \\(\\dfrac{2}{9}\\).","proc":"employ","band":"standard","comp":"","two":true},{"id":"R6-39","stem":"A bakery recipe specifies that the ratio of sugar to flour must be \\(1:4\\). A baker uses 8 cups of flour in a large batch. How many cups of sugar are required to maintain the recipe ratio?","opts":["1 cup","2 cups","3 cups","4 cups"],"a":1,"sol":"Set up a proportion \\(\\dfrac{1}{4}=\\dfrac{x}{8}\\). Cross-multiplying gives \\(4x=8\\), so \\(x=2\\) cups of sugar are needed to keep the \\(1:4\\) ratio.","proc":"employ","band":"standard","comp":"","two":true},{"id":"R6-40","stem":"A class has 12 boys and 18 girls. What is the ratio of boys to the total number of pupils in simplest form?","opts":["\\(2:5\\)","\\(3:5\\)","\\(2:3\\)","\\(12:18\\)"],"a":0,"sol":"The total number of pupils is \\(12+18=30\\). The ratio of boys to the total is \\(12:30\\), and dividing both terms by 6 gives the simplest form \\(2:5\\).","proc":"employ","band":"standard","comp":"","two":true}]}]},{"id":"pt3","title":"Practice Test 3","sub":"Advanced practice","badge":"P3","secs":[{"t":"Section 1","items":[{"id":"R10-01","stem":"A lighthouse at point \\(A\\) sends a beam that passes over a fishing boat at \\(B\\) and continues out to sea. A student says, \"The beam is segment \\(AB\\) because it reaches the boat.\" Which statement correctly evaluates this claim?","opts":["It is line \\(AB\\), because light travels in both directions from \\(A\\).","It is segment \\(AB\\), because only the points \\(A\\) and \\(B\\) are known.","It is ray \\(AB\\), because it starts at \\(A\\) and continues without end past \\(B\\).","It is ray \\(BA\\), because the beam is first seen at the boat."],"a":2,"sol":"A ray has one endpoint, named first (here \\(A\\)), and extends endlessly through the second point \\(B\\). The beam does not stop at the boat, so it is not a segment, and it does not extend behind the lighthouse, so it is not a line. The claim is therefore wrong: the beam is ray \\(AB\\).","proc":"reason","band":"basic","comp":""},{"id":"R10-02","stem":"A carpenter must fix a post perpendicular to a straight baseboard line \\(\\ell\\) from a nail at point \\(P\\) that is not on \\(\\ell\\). He has only a compass and straightedge. Which first step can be justified as making the method valid?","opts":["Draw any line through \\(P\\) and check by eye that it looks like \\(90^\\circ\\).","Swing an arc centered at \\(P\\) that crosses \\(\\ell\\) at two points; these two points become centers for equal arcs whose intersection locates the perpendicular.","Draw a circle centered on \\(\\ell\\) whose radius equals the length of \\(\\ell\\).","Mark one point on \\(\\ell\\) and join it to \\(P\\)."],"a":1,"sol":"Swinging an arc from \\(P\\) that crosses line \\(\\ell\\) at two points gives two points equally far from \\(P\\). Equal arcs drawn from those two points meet at a second point, and the line through \\(P\\) and that point is the perpendicular bisector of the segment between the crossing points, so it is perpendicular to \\(\\ell\\). The other steps give no guarantee of a \\(90^\\circ\\) angle.","proc":"formulate","band":"standard","comp":""},{"id":"R10-03","stem":"Two parallel streets are crossed by an avenue. A surveyor measures \\(112^\\circ\\) for the interior angle on the east side of the avenue at the first intersection. What is the interior angle on the same (east) side at the second intersection, and what justifies it?","opts":["\\(68^\\circ\\), because alternate interior angles are congruent.","\\(68^\\circ\\), because same-side interior angles are supplementary.","\\(112^\\circ\\), because same-side interior angles are congruent.","\\(68^\\circ\\), because vertical angles are congruent."],"a":1,"sol":"Same-side (consecutive) interior angles between parallel lines add up to \\(180^\\circ\\), so the angle at the second intersection is \\(180^\\circ - 112^\\circ = 68^\\circ\\). Alternate interior, corresponding, and vertical angles are congruent rather than supplementary, so those justifications fail.","proc":"employ","band":"standard","comp":""},{"id":"R10-04","stem":"Two parallel rails are cut by a service path. An engineer's plan labels a pair of alternate interior angles as \\((3x + 10)^\\circ\\) and \\((5x - 30)^\\circ\\). Trainee 1 sets them equal. Trainee 2 says they must add up to \\(180^\\circ\\). Who is correct, and what is the measure of the first angle?","opts":["Trainee 2; \\(85^\\circ\\)","Trainee 2; \\(70^\\circ\\)","Trainee 1; \\(40^\\circ\\)","Trainee 1; \\(70^\\circ\\)"],"a":3,"sol":"Alternate interior angles of parallel lines are congruent, so Trainee 1 is right to set them equal: \\(3x + 10 = 5x - 30\\) gives \\(x = 20\\). The first angle is \\(3(20) + 10 = 70^\\circ\\), and the second is \\(5(20) - 30 = 70^\\circ\\). Trainee 2's method would give \\(x = 25\\) and an \\(85^\\circ\\) angle, which is wrong for this angle pair.","proc":"reason","band":"standard","comp":"","two":true},{"id":"R10-05","stem":"A registrar records (student number, scholarship category) pairs. The scholarship office requires that each student number map to exactly one category. Which record could be used?","opts":["\\(\\{(1, 2), (1, 3), (2, 4)\\}\\)","\\(\\{(2, 1), (3, 1), (4, 1)\\}\\)","\\(\\{(0, 1), (0, 2), (3, 3)\\}\\)","\\(\\{(5, 1), (5, 2), (6, 3)\\}\\)"],"a":1,"sol":"A function assigns each input exactly one output. In option B every student number appears once, and different students are allowed to share a category. In options A, C, and D one student number is paired with two different categories, so those records are not functions.","proc":"interpret","band":"basic","comp":"","two":true},{"id":"R10-06","stem":"The temperature of a room is modeled by \\(T(x) = 2x + 1\\) (in \\(^\\circ\\text{C}\\)), where \\(x\\) is the number of hours from noon. Readings were taken at \\(x = -1\\), \\(0\\), and \\(2\\) (11 AM, 12 noon, 2 PM). Which set lists the temperatures recorded?","opts":["\\(\\{1, 3, 5\\}\\)","\\(\\{-1, 0, 2\\}\\)","\\(\\{-1, 1, 5\\}\\)","\\(\\{-3, -1, 3\\}\\)"],"a":2,"sol":"Substituting the input times gives \\(T(-1) = -1\\), \\(T(0) = 1\\), and \\(T(2) = 5\\), so the temperatures recorded form the range \\(\\{-1, 1, 5\\}\\). Option B lists the domain, the input times, rather than the outputs.","proc":"employ","band":"basic","comp":"","two":true},{"id":"R10-07","stem":"A taxi charges a ₱40 flag-down rate (paid once) plus ₱13 per kilometer. Ana writes \\(f(x) = 53x\\) for the fare of an \\(x\\)-km trip because \"\\(40 + 13 = 53\\).\" Which evaluation is correct?","opts":["Ana is correct, because both charges are paid for every kilometer.","Ana is incorrect; the flag-down is a one-time constant, so \\(f(x) = 13x + 40\\). A 5-km trip costs ₱105, not ₱265.","Ana is incorrect; the correct function is \\(f(x) = 40x + 13\\).","Ana is incorrect; the correct function is \\(f(x) = 13x - 40\\)."],"a":1,"sol":"The flag-down charge is a one-time constant, not a per-kilometer rate, so the correct model is \\(f(x) = 13x + 40\\): the constant term is the fixed \\(40\\) and the slope is the \\(13\\) per kilometer. Testing \\(x = 5\\) shows Ana's model overcharges, since \\(53(5) = 265\\) while \\(13(5) + 40 = 105\\). Ana is therefore incorrect.","proc":"reason","band":"standard","comp":""},{"id":"R10-08","stem":"A drone climbs at a constant rate. At 2 seconds its altitude is 3 m, and at 6 seconds it is 11 m. Which gives the climb rate and the time at which the model puts the drone at ground level?","opts":["\\(\\dfrac{1}{2}\\) m/s; at 2 s","2 m/s; at \\(-1\\) s","2 m/s; at 0.5 s","4 m/s; at 0.25 s"],"a":2,"sol":"The constant climb rate is the slope \\(\\dfrac{11 - 3}{6 - 2} = 2\\) m/s, so the model is \\(y = 2x - 1\\). Setting \\(y = 0\\) gives \\(x = \\dfrac{1}{2}\\), so the drone is at ground level at \\(0.5\\) s.","proc":"employ","band":"standard","comp":"","two":true},{"id":"R10-09","stem":"A water tank's volume (in thousand liters) is \\(V = -3t + 6\\) after \\(t\\) hours of draining. Which interpretation is correct?","opts":["It starts with 2 thousand liters, drains 3 thousand per hour, and is empty after 6 hours.","It starts with 6 thousand liters and fills 3 thousand per hour until full at \\(t = 2\\).","It starts with 6 thousand liters, drains 3 thousand per hour, and is empty after 2 hours.","It starts with 3 thousand liters and drains 6 thousand per hour."],"a":2,"sol":"The \\(y\\)-intercept \\(6\\) is the starting volume of 6 thousand liters, the slope \\(-3\\) is the draining rate of 3 thousand per hour, and the \\(t\\)-intercept \\(t = 2\\) is when the tank is empty. The sensible domain is \\(0 \\le t \\le 2\\).","proc":"interpret","band":"standard","comp":""},{"id":"R10-10","stem":"Candle A is 20 cm tall and burns down 2 cm every hour. Candle B is 15 cm tall and burns down 1 cm every hour. Which pair of equations can be justified as a model of their heights after \\(t\\) hours, and when are the candles the same height?","opts":["\\(h = 20 - 2t\\) and \\(h = 15 - t\\); equal at \\(t = 3\\) h","\\(h = 20 - 2t\\) and \\(h = 15 - t\\); equal at \\(t = 5\\) h","\\(h = 20 + 2t\\) and \\(h = 15 + t\\); never equal","\\(h = 2t - 20\\) and \\(h = t - 15\\); equal at \\(t = 5\\) h"],"a":1,"sol":"Both candles get shorter, so each rate is negative, giving \\(h = 20 - 2t\\) and \\(h = 15 - t\\). Setting \\(20 - 2t = 15 - t\\) gives \\(t = 5\\), and both candles are then 10 cm tall. Option D has the right time but equations that would give negative heights.","proc":"formulate","band":"standard","comp":""},{"id":"R10-11","stem":"Rico has ₱2,300 to spend. Gym A charges ₱500 registration plus ₱150 per session. Gym B has no registration but charges ₱250 per session. Which gym lets him attend more sessions, and how many?","opts":["Gym B, 9 sessions","Gym B, 12 sessions","Gym A, 15 sessions","Gym A, 12 sessions"],"a":3,"sol":"For Gym A, \\(500 + 150n = 2300\\) gives \\(n = 12\\) sessions. For Gym B, \\(250n = 2300\\) gives \\(9.2\\), so only 9 full sessions. Gym A lets Rico attend more, and it is cheaper overall once \\(n > 5\\), since \\(500 + 150n < 250n\\).","proc":"reason","band":"standard","comp":"","two":true}]},{"t":"Section 2","items":[{"id":"R10-12","stem":"Two shelf rails are crossed by a measuring tape (a transversal). Worker 1 finds that a pair of alternate interior angles are congruent. Worker 2 finds that a pair of vertical angles are congruent. Both conclude the rails are parallel. Whose evidence supports the conclusion?","opts":["Both workers","Worker 1 only","Worker 2 only","Neither worker"],"a":1,"sol":"Congruent alternate interior angles (or corresponding angles) formed by a transversal imply that the two lines are parallel, so Worker 1's evidence is valid. Vertical angles are always congruent no matter how the lines are arranged, so Worker 2's finding tells us nothing about whether the rails are parallel.","proc":"reason","band":"standard","comp":"","two":true},{"id":"R10-13","stem":"A designer sketches a quadrilateral roof panel whose top and bottom edges are parallel, but whose left and right edges are not. How should it be classified?","opts":["Parallelogram, because it has a pair of parallel sides","Rhombus, because its top and bottom are parallel","Trapezoid, because it has exactly one pair of parallel sides","Kite, because it is symmetric"],"a":2,"sol":"By definition a trapezoid has exactly one pair of parallel sides, which matches a panel whose top and bottom are parallel while the left and right edges are not. A parallelogram would require two pairs of parallel sides.","proc":"interpret","band":"basic","comp":""},{"id":"R10-14","stem":"A folding clothes rack is shaped like parallelogram \\(ABCD\\) with \\(\\angle A = (2x + 10)^\\circ\\) and \\(\\angle B = (3x - 20)^\\circ\\). What are the measures of \\(\\angle A\\) and \\(\\angle C\\)?","opts":["\\(94^\\circ\\) and \\(94^\\circ\\)","\\(86^\\circ\\) and \\(94^\\circ\\)","\\(86^\\circ\\) and \\(86^\\circ\\)","\\(76^\\circ\\) and \\(76^\\circ\\)"],"a":2,"sol":"Consecutive angles of a parallelogram are supplementary, so \\((2x + 10) + (3x - 20) = 180\\), which gives \\(5x - 10 = 180\\) and \\(x = 38\\). Then \\(\\angle A = 2(38) + 10 = 86^\\circ\\), and because opposite angles of a parallelogram are congruent, \\(\\angle C = 86^\\circ\\) as well.","proc":"employ","band":"standard","comp":"","two":true},{"id":"R10-15","stem":"A billboard frame is a rectangle \\(ABCD\\) braced by two diagonal cables. \\(AC = (3x + 4)\\) m and \\(BD = (5x - 12)\\) m. What is the total length of cable used?","opts":["\\(28\\) m","\\(112\\) m","\\(56\\) m","\\(36\\) m"],"a":2,"sol":"The diagonals of a rectangle are congruent, so \\(3x + 4 = 5x - 12\\), which gives \\(x = 8\\). Each cable is then \\(3(8) + 4 = 28\\) m, so the total length of the two cables is \\(2(28) = 56\\) m. Option A is the length of only one cable.","proc":"employ","band":"standard","comp":"","two":true},{"id":"R10-16","stem":"Students prove that opposite sides of parallelogram \\(ABCD\\) are congruent by drawing diagonal \\(AC\\). Which justification correctly shows \\(\\triangle ABC \\cong \\triangle CDA\\)?","opts":["AAA, because all three angle pairs are congruent","SSA, because two sides and a non-included angle are congruent","HL, because \\(AC\\) is the hypotenuse of both triangles","ASA: alternate interior angles \\(\\angle BAC \\cong \\angle DCA\\) and \\(\\angle BCA \\cong \\angle DAC\\), with common side \\(AC\\)"],"a":3,"sol":"Because \\(AB \\parallel DC\\) and \\(BC \\parallel AD\\), the alternate interior angles \\(\\angle BAC \\cong \\angle DCA\\) and \\(\\angle BCA \\cong \\angle DAC\\) are congruent, and side \\(AC\\) is shared, giving the ASA criterion. By CPCTC it then follows that \\(AB \\cong CD\\) and \\(BC \\cong DA\\). AAA and SSA are not congruence postulates, and HL requires a right triangle.","proc":"interpret","band":"stretch","comp":""},{"id":"R10-17","stem":"A kite maker checks that a frame is a true kite by testing its two crossing sticks (the diagonals). Which test must pass for every kite?","opts":["The sticks are equal in length.","The sticks meet at a right angle.","Opposite sides of the frame are parallel.","Each stick cuts the other exactly in half."],"a":1,"sol":"The diagonals of a kite are always perpendicular, so the sticks must meet at a right angle. They are not necessarily equal in length, only one diagonal bisects the other, and opposite sides of a kite are not parallel.","proc":"reason","band":"basic","comp":""},{"id":"R10-18","stem":"A trapezoid-shaped flower bed has parallel sides of \\(14\\) m and \\(22\\) m. A fence is installed along the median, halfway between and parallel to the bases, at ₱250 per meter. What is the cost of the fence?","opts":["₱3,500","₱4,500","₱5,500","₱9,000"],"a":1,"sol":"The median of a trapezoid equals the average of the two bases: \\(\\dfrac{14 + 22}{2} = 18\\) m. The cost is \\(18 \\times 250\\), which is ₱4,500. Options A and C use only one base, and D uses the sum of the bases instead of the average.","proc":"employ","band":"standard","comp":"","two":true},{"id":"R10-19","stem":"In a debate, four students argue as follows. Whose conclusion must be true if the premises are true (deductive reasoning)?","opts":["\"The first three terms are even, so all terms are even.\"","\"Every swan I have seen is white, so all swans are white.\"","\"All squares are rectangles. \\(ABCD\\) is a square, so \\(ABCD\\) is a rectangle.\"","\"Three triangles I measured had angle sum \\(180^\\circ\\), so all triangles do.\""],"a":2,"sol":"Deductive reasoning applies accepted general statements to a specific case, so the conclusion is guaranteed to be true; applying \"all squares are rectangles\" to the square \\(ABCD\\) is certain. Choices A, B, and D generalize from only a few observed cases, which is inductive reasoning and can fail.","proc":"reason","band":"standard","comp":""},{"id":"R10-20","stem":"A geometry club sorts statements into \"accepted without proof\" and \"must be proven.\" Which statement belongs in the first group?","opts":["Through any two points, there is exactly one line.","Vertical angles are congruent.","Base angles of an isosceles triangle are congruent.","The angles of a triangle add up to \\(180^\\circ\\)."],"a":0,"sol":"A postulate is a statement accepted without proof, and \"through any two points there is exactly one line\" is a postulate. Choices B, C, and D are theorems that can each be proven from postulates and definitions.","proc":"interpret","band":"basic","comp":""},{"id":"R10-21","stem":"Two triangular sails \\(\\triangle ABC\\) and \\(\\triangle DEF\\) satisfy \\(AB = DE\\), \\(\\angle B \\cong \\angle E\\), and \\(BC = EF\\). Which conclusion is justified?","opts":["SSS, so \\(AC \\cong DF\\)","ASA, so \\(\\angle A \\cong \\angle F\\)","SAS, so \\(\\angle A \\cong \\angle F\\)","SAS, so \\(AC \\cong DF\\)"],"a":3,"sol":"Two sides and the angle included between them are congruent, which is the SAS criterion, so \\(\\triangle ABC \\cong \\triangle DEF\\) and CPCTC gives \\(AC \\cong DF\\). Note that \\(\\angle A\\) corresponds to \\(\\angle D\\), not \\(\\angle F\\). Only two sides are given, so SSS does not apply, and no second pair of angles is given for ASA.","proc":"reason","band":"standard","comp":"","two":true},{"id":"R10-22","stem":"To estimate the width \\(BC\\) of a lake, surveyors pick a point \\(A\\) on land, then mark the midpoints \\(D\\) of \\(AB\\) and \\(E\\) of \\(AC\\). They measure \\(DE = 9\\) m on land. What is the width of the lake?","opts":["\\(18\\) m","\\(9\\) m","\\(4.5\\) m","\\(36\\) m"],"a":0,"sol":"By the Midline (Midsegment) Theorem, the segment joining the midpoints of two sides is parallel to the third side and half its length, so \\(DE = \\dfrac{1}{2}BC\\). Solving gives \\(BC = 2(9) = 18\\) m.","proc":"employ","band":"standard","comp":"","two":true},{"id":"R10-23","stem":"Mara constructs the perpendicular bisector of road section \\(AB\\) using a compass opening of only one-third of \\(AB\\). Her arcs never cross. What is the reason?","opts":["The line must be parallel to \\(AB\\).","The arcs must be congruent to \\(AB\\).","The line must pass through \\(A\\).","The opening must exceed half of \\(AB\\) so that the two arcs intersect at two points."],"a":3,"sol":"If the compass radius is at most \\(\\dfrac{1}{2}AB\\), the arcs drawn from \\(A\\) and from \\(B\\) cannot reach each other, so they never meet. Two intersection points are needed to determine the perpendicular bisector, so the opening must be greater than half of \\(AB\\).","proc":"reason","band":"standard","comp":""},{"id":"R10-24","stem":"Two straight cables \\(AB\\) and \\(CD\\) cross at \\(M\\), the midpoint of both. In proving \\(\\triangle AMC \\cong \\triangle BMD\\), which reason supports \\(\\angle AMC \\cong \\angle BMD\\)?","opts":["Vertical angles are congruent.","Definition of midpoint","Reflexive property","Alternate interior angles theorem"],"a":0,"sol":"The angles \\(\\angle AMC\\) and \\(\\angle BMD\\) are formed by the two crossing lines at \\(M\\), so they are vertical angles and therefore congruent. The definition of midpoint instead supports \\(AM = BM\\) and \\(CM = DM\\), and together these facts give the SAS congruence.","proc":"interpret","band":"standard","comp":"","two":true}]},{"t":"Section 3","items":[{"id":"R10-25","stem":"A rectangular garden is 3 m longer than it is wide. The owner wants an equation for its area \\(A\\) in terms of the width \\(w\\), and needs the width when the area is \\(40\\text{ m}^{2}\\). Evaluate the choices: which one is correct and justified?","opts":["\\(A = w^{2} + 3w\\); \\(w = 5\\) m (the value \\(-8\\) is rejected because a width cannot be negative)","\\(A = w^{2} + 3\\); \\(w \\approx 6.08\\) m","\\(A = 2w + 3\\); \\(w = 18.5\\) m","\\(A = w^{2} + 3w\\); \\(w = -8\\) m"],"a":0,"sol":"The area is \\(w(w + 3) = w^{2} + 3w\\). Setting \\(w^{2} + 3w = 40\\) gives \\((w + 8)(w - 5) = 0\\), so \\(w = -8\\) or \\(w = 5\\). The width is \\(5\\) m because a negative length is not possible.","proc":"reason","band":"standard","comp":""},{"id":"R10-26","stem":"Two satellite dishes have cross-sections modeled by \\(y = x^{2}\\) (Dish 1) and \\(y = x^{2} + 4\\) (Dish 2). How does Dish 2 compare with Dish 1?","opts":["It is shifted \\(4\\) units to the right.","It is shifted \\(4\\) units to the left.","It is shifted \\(4\\) units down.","It is shifted \\(4\\) units up, so its lowest point is \\((0, 4)\\)."],"a":3,"sol":"Adding a constant \\(b\\) to \\(x^{2}\\) shifts the parabola vertically by \\(b\\) units (up when \\(b > 0\\)). So \\(y = x^{2} + 4\\) is Dish 1 shifted \\(4\\) units up, with its lowest point at \\((0, 4)\\). Horizontal shifts instead come from changes inside the parentheses, as in \\((x - h)^{2}\\).","proc":"interpret","band":"standard","comp":""},{"id":"R10-27","stem":"A ball's height (in meters) is modeled by \\(h(x) = -(x - 2)^{2} + 9\\), where \\(x\\) is the time in seconds. Which interpretation is correct?","opts":["The ball reaches its highest point of \\(9\\) m after \\(2\\) seconds.","The ball is at its lowest point of \\(9\\) m after \\(2\\) seconds.","The ball reaches its highest point of \\(9\\) m at \\(-2\\) seconds.","The parabola opens upward, so the ball keeps climbing."],"a":0,"sol":"In \\(y = a(x - h)^{2} + k\\) the vertex is \\((h, k) = (2, 9)\\). Since \\(a = -1 < 0\\), the parabola opens downward, so \\(9\\) m is the maximum height, reached at \\(x = 2\\) seconds.","proc":"reason","band":"standard","comp":""},{"id":"R10-28","stem":"A suspended cable hangs along the curve \\(y = x^{2} - 6x + 5\\). An engineer needs the lowest point of the cable. Evaluate the choices: which vertex form and lowest point are correct, and how does completing the square justify them?","opts":["\\(y = (x + 3)^{2} - 4\\); lowest point \\((-3, -4)\\)","\\(y = (x - 3)^{2} + 4\\); lowest point \\((3, 4)\\)","\\(y = (x - 3)^{2} - 4\\); lowest point \\((3, -4)\\)","\\(y = (x - 6)^{2} - 31\\); lowest point \\((6, -31)\\)"],"a":2,"sol":"Completing the square: \\(x^{2} - 6x + 9 - 9 + 5 = (x - 3)^{2} - 4\\). The vertex \\((3, -4)\\) is the minimum point. Expanding option D gives \\(x^{2} - 12x + 5\\), which is not the original function.","proc":"reason","band":"standard","comp":"","two":true},{"id":"R10-29","stem":"The cross-section of a skate bowl is \\(y = 2x^{2} - 8\\), where \\(y = 0\\) is ground level. Which description is correct?","opts":["It opens downward with its lowest point at \\((0, -8)\\).","It opens upward, its lowest point is \\((0, -8)\\), and it meets ground level at \\(x = -2\\) and \\(x = 2\\), so it is \\(4\\) units wide at the top.","It opens upward with its lowest point at \\((0, 8)\\).","It opens upward, its lowest point is \\((0, -8)\\), and it meets ground level at \\(x = -4\\) and \\(x = 4\\)."],"a":1,"sol":"Since \\(a = 2 > 0\\) it opens upward, and the vertex is \\((0, -8)\\). Setting \\(y = 0\\) gives \\(x^{2} = 4\\), so \\(x = \\pm 2\\). The distance between the intercepts is \\(4\\) units.","proc":"interpret","band":"standard","comp":""},{"id":"R10-30","stem":"Two fountain jets are modeled by \\(y = x^{2}\\) and \\(y = -\\dfrac{1}{2}(x - 3)^{2} + 1\\). How does the second compare with the first?","opts":["Opens downward, narrower, vertex \\((-3, 1)\\)","Opens upward, wider, vertex \\((3, 1)\\)","Opens downward, wider, vertex \\((3, 1)\\)","Opens downward, narrower, vertex \\((3, 1)\\)"],"a":2,"sol":"The negative sign reflects the graph downward. Since \\(|a| = \\dfrac{1}{2} < 1\\) it is wider than \\(y = x^{2}\\). The vertex is \\((h, k) = (3, 1)\\), and \\(h = 3\\) is a shift to the right because of the minus sign in \\((x - 3)\\).","proc":"interpret","band":"standard","comp":"","two":true},{"id":"R10-31","stem":"The monthly net income (in thousand pesos) of a food stall is modeled by \\(f(x) = x^{2} - 5x + 6\\), where \\(x\\) is the month number. In which months does the stall break even (net income \\(= 0\\))?","opts":["Months \\(2\\) and \\(3\\)","Months \\(1\\) and \\(6\\)","Months \\(-2\\) and \\(-3\\)","Months \\(-2\\) and \\(3\\)"],"a":0,"sol":"Factoring, \\(x^{2} - 5x + 6 = (x - 2)(x - 3) = 0\\), so \\(x = 2\\) or \\(x = 3\\). Negative months have no meaning here. Between months \\(2\\) and \\(3\\) the value is negative, which means a small loss.","proc":"employ","band":"standard","comp":"","two":true},{"id":"R10-32","stem":"Three identical square floor panels cover a total area of \\(48\\text{ m}^{2}\\). What is the side length of each panel?","opts":["\\(\\pm 4\\) m","\\(16\\) m","\\(8\\) m","\\(4\\) m"],"a":3,"sol":"From \\(3x^{2} = 48\\) we get \\(x^{2} = 16\\), so \\(x = \\pm 4\\). A length cannot be negative, so \\(x = 4\\) m. Option A gives both roots without interpreting the context.","proc":"employ","band":"basic","comp":"","two":true},{"id":"R10-33","stem":"A rectangular tarpaulin has width \\(x\\) meters and length \\((2x + 1)\\) meters, and its area is \\(6\\text{ m}^{2}\\). This gives \\(2x^{2} + x - 6 = 0\\). What is the width?","opts":["\\(\\dfrac{3}{2}\\) m","\\(2\\) m","\\(-2\\) m","\\(3\\) m"],"a":0,"sol":"Factoring, \\(2x^{2} + x - 6 = (2x - 3)(x + 2) = 0\\), so \\(x = \\dfrac{3}{2}\\) or \\(x = -2\\). Only \\(\\dfrac{3}{2}\\) m is possible, and the length is \\(2\\left(\\dfrac{3}{2}\\right) + 1 = 4\\) m, giving an area of \\(6\\text{ m}^{2}\\).","proc":"employ","band":"standard","comp":"","two":true},{"id":"R10-34","stem":"A garden's length is \\(x\\) meters and its width is \\((x - 4)\\) meters. Its area is \\(3\\text{ m}^{2}\\). This gives \\(x^{2} - 4x - 3 = 0\\). What is the length to the nearest hundredth?","opts":["\\(-0.65\\) m","\\(4.65\\) m","\\(6.65\\) m","\\(2.65\\) m"],"a":1,"sol":"By the quadratic formula, \\(x = \\dfrac{4 \\pm \\sqrt{16 + 12}}{2} = 2 \\pm \\sqrt{7}\\). The positive, meaningful value is \\(2 + \\sqrt{7} \\approx 4.65\\) m (the width is then about \\(0.65\\) m). The value \\(2 - \\sqrt{7}\\) is negative, so it is rejected.","proc":"employ","band":"standard","comp":"","two":true},{"id":"R10-35","stem":"A rectangular garden has an area of \\(99\\text{ m}^{2}\\), and its length and width are consecutive positive odd integers. Which dimensions and perimeter are justified by the area?","opts":["\\(7\\) m by \\(9\\) m; \\(32\\) m","\\(8\\) m by \\(10\\) m; \\(36\\) m","\\(11\\) m by \\(13\\) m; \\(48\\) m","\\(9\\) m by \\(11\\) m; \\(40\\) m"],"a":3,"sol":"Let the width be \\(x\\); then \\(x(x + 2) = 99\\) gives \\(x^{2} + 2x - 99 = 0\\), or \\((x + 11)(x - 9) = 0\\), so \\(x = 9\\). The sides are \\(9\\) m and \\(11\\) m, and the perimeter is \\(2(9 + 11) = 40\\) m. Option B is not odd, and options A and C have the wrong product.","proc":"formulate","band":"standard","comp":"","two":true},{"id":"R10-36","stem":"A \\(4\\text{ in} \\times 6\\text{ in}\\) photo is enlarged without distortion. Which enlargement is similar to the original, and why?","opts":["\\(8 \\times 10\\) in, because every rectangle has four right angles","\\(8 \\times 12\\) in, because angles are congruent and sides are proportional (scale factor \\(2\\))","\\(6 \\times 8\\) in, because it is bigger","\\(5 \\times 6\\) in, because its perimeter is close to the original"],"a":1,"sol":"Similarity needs both congruent angles and proportional sides. The \\(8 \\times 12\\) in print keeps the ratio since \\(\\dfrac{8}{4} = \\dfrac{12}{6} = 2\\). The \\(8 \\times 10\\) in print has right angles, but \\(\\dfrac{8}{4} \\neq \\dfrac{10}{6}\\), so it would look stretched.","proc":"reason","band":"standard","comp":""},{"id":"R10-37","stem":"Two triangular lots \\(\\triangle ABC\\) and \\(\\triangle DEF\\) are surveyed. \\(\\angle A \\cong \\angle D = 50^\\circ\\) and \\(\\angle B \\cong \\angle E = 60^\\circ\\). Which statement correctly justifies that the lots are similar?","opts":["AA Similarity: two pairs of congruent angles force the third pair to be congruent as well","SAS Similarity, because two sides are known","SSS Similarity, because all sides are proportional","HL Similarity, because the triangles are right triangles"],"a":0,"sol":"Two congruent angle pairs are enough for AA Similarity, since the third angles are both \\(70^\\circ\\). No side lengths or right angles are given, so the other options do not apply.","proc":"reason","band":"standard","comp":""},{"id":"R10-38","stem":"A \\(1.5\\) m tall person casts a \\(2\\) m shadow. At the same time a tree casts a \\(12\\) m shadow. How tall is the tree?","opts":["\\(6\\) m","\\(16\\) m","\\(9\\) m","\\(18\\) m"],"a":2,"sol":"The sun creates similar triangles, so \\(\\dfrac{1.5}{2} = \\dfrac{h}{12}\\), which gives \\(h = 9\\) m. Option A comes from halving the shadow, B from inverting the ratio \\(\\left(\\dfrac{2}{1.5} \\times 12\\right)\\), and D from multiplying \\(1.5 \\times 12\\).","proc":"interpret","band":"standard","comp":"","two":true},{"id":"R10-39","stem":"A \\(14\\) m ladder leans against a wall and makes a \\(60^\\circ\\) angle with the ground. How high up the wall does it reach?","opts":["\\(7\\sqrt{3} \\approx 12.12\\) m","\\(7\\) m","\\(14\\sqrt{3} \\approx 24.25\\) m","\\(7\\sqrt{2} \\approx 9.90\\) m"],"a":0,"sol":"In a 30-60-90 triangle the side opposite \\(30^\\circ\\) is half the hypotenuse (\\(7\\) m), and the side opposite \\(60^\\circ\\) is that times \\(\\sqrt{3}\\), giving \\(7\\sqrt{3} \\approx 12.12\\) m.","proc":"employ","band":"standard","comp":"","two":true},{"id":"R10-40","stem":"A square tile has sides of \\(6\\) cm. A gold strip is placed along one diagonal. Why is the strip longer than a side but shorter than \\(12\\) cm, and how long is it?","opts":["\\(6\\) cm, because the diagonal equals a side","\\(6\\sqrt{2} \\approx 8.49\\) cm, because the diagonal splits the square into 45-45-90 triangles","\\(12\\) cm, because the diagonal equals two sides","\\(6\\sqrt{3} \\approx 10.39\\) cm, because the diagonal is the long leg of a 30-60-90 triangle"],"a":1,"sol":"The hypotenuse of a 45-45-90 triangle is a leg times \\(\\sqrt{2}\\), so the diagonal is \\(6\\sqrt{2} \\approx 8.49\\) cm. The triangle inequality also shows the diagonal is less than the sum of two sides (\\(12\\) cm).","proc":"interpret","band":"standard","comp":""},{"id":"R10-41","stem":"Which situation illustrates inverse variation?","opts":["The cost of mangoes and the kilos bought at a fixed price per kilo","The perimeter of a square and the length of its side","The time to travel \\(120\\) km and the speed of travel","The distance traveled at constant speed and the time"],"a":2,"sol":"For a fixed distance, \\(\\text{time} = \\text{distance} \\div \\text{speed}\\). As speed increases, time decreases, and the product of speed and time stays constant. The others are examples of direct variation.","proc":"interpret","band":"basic","comp":""},{"id":"R10-42","stem":"A group of volunteers decorates a hall. With \\(x = 2, 4, 6\\) volunteers the work takes \\(y = 12, 6, 4\\) hours. Which equation is justified by the data, and how long will \\(8\\) volunteers need?","opts":["\\(y = 6x\\); \\(48\\) hours","\\(y = x + 10\\); \\(18\\) hours","\\(y = \\dfrac{12}{x}\\); \\(1.5\\) hours","\\(y = \\dfrac{24}{x}\\); \\(3\\) hours"],"a":3,"sol":"The product \\(xy\\) is constant (\\(2 \\cdot 12 = 4 \\cdot 6 = 6 \\cdot 4 = 24\\)), so \\(y\\) varies inversely as \\(x\\): \\(y = \\dfrac{24}{x}\\). For \\(x = 8\\), \\(y = 3\\) hours.","proc":"formulate","band":"standard","comp":"","two":true},{"id":"R10-43","stem":"Six workers can finish a job in \\(12\\) days. The client now wants it finished in \\(8\\) days at the same working rate. How many additional workers must be hired?","opts":["\\(2\\)","\\(3\\)","\\(9\\)","\\(4\\)"],"a":1,"sol":"Workers and days vary inversely, so \\(6(12) = n(8)\\), giving \\(n = 9\\) workers. That means \\(9 - 6 = 3\\) more workers. Option C gives the total number of workers, not the additional number.","proc":"employ","band":"standard","comp":"","two":true}]},{"t":"Section 4","items":[{"id":"R10-44","stem":"A roof truss is an isosceles triangle \\(\\triangle ABC\\) with \\(AB = AC\\) and a vertex angle \\(\\angle A = 40^\\circ\\). At what angle must the carpenter cut each base end \\(\\angle B\\)?","opts":["\\(40^\\circ\\)","\\(140^\\circ\\)","\\(70^\\circ\\)","\\(100^\\circ\\)"],"a":2,"sol":"The base angles of an isosceles triangle are congruent, so each one equals \\((180^\\circ - 40^\\circ) \\div 2 = 70^\\circ\\). The vertex angle is subtracted from the total \\(180^\\circ\\) first, and the remainder is split evenly between the two base angles.","proc":"employ","band":"basic","comp":"","two":true},{"id":"R10-45","stem":"Three towns A, B, and C form a triangle. The angle at A is \\(50^\\circ\\), at B is \\(60^\\circ\\), and at C is \\(70^\\circ\\). Which two towns are farthest apart?","opts":["A and B","B and C","A and C","It cannot be determined."],"a":0,"sol":"In any triangle the longest side lies opposite the largest angle. Here \\(\\angle C = 70^\\circ\\) is the largest angle, and the side opposite it joins towns A and B, so A and B are the farthest apart.","proc":"interpret","band":"standard","comp":"","two":true},{"id":"R10-46","stem":"A builder has two beams of \\(7\\) m and \\(12\\) m and needs a third beam to form a triangular frame. Which beam length works?","opts":["\\(4\\) m","\\(5\\) m","\\(19\\) m","\\(10\\) m"],"a":3,"sol":"By the triangle inequality the third side must be greater than \\(12 - 7 = 5\\) and less than \\(12 + 7 = 19\\). Only \\(10\\) m satisfies \\(5 < x < 19\\). The lengths \\(5\\) and \\(19\\) would collapse into a flat (degenerate) frame.","proc":"reason","band":"standard","comp":"","two":true},{"id":"R10-47","stem":"A ramp makes a \\(30^\\circ\\) angle with the ground. For a horizontal run of \\(6\\) m, how high does the ramp rise?","opts":["\\(2\\sqrt{3} \\approx 3.46\\) m","\\(6\\sqrt{3} \\approx 10.39\\) m","\\(3\\) m","\\(3\\sqrt{3} \\approx 5.20\\) m"],"a":0,"sol":"The rise is opposite the angle and the \\(6\\) m run is adjacent, so \\(\\tan 30^\\circ = \\dfrac{\\sqrt{3}}{3} = \\dfrac{\\text{rise}}{6}\\). Solving gives rise \\(= 6 \\cdot \\dfrac{\\sqrt{3}}{3} = 2\\sqrt{3} \\approx 3.46\\) m. Option C mistakenly uses \\(\\sin 30^\\circ = \\tfrac{1}{2}\\) and option D applies cosine incorrectly.","proc":"employ","band":"standard","comp":"","two":true},{"id":"R10-48","stem":"A \\(17\\)-m ladder leans against a wall with its foot \\(8\\) m from the wall. \\(\\angle A\\) is the angle between the ladder and the wall. What is \\(\\cos A\\)?","opts":["\\(\\dfrac{8}{17}\\)","\\(\\dfrac{15}{17}\\)","\\(\\dfrac{8}{15}\\)","\\(\\dfrac{17}{15}\\)"],"a":1,"sol":"The side opposite \\(\\angle A\\) is the \\(8\\)-m distance from the wall, and the side adjacent to \\(\\angle A\\) is the height \\(\\sqrt{17^{2} - 8^{2}} = 15\\) m. Therefore \\(\\cos A = \\dfrac{\\text{adjacent}}{\\text{hypotenuse}} = \\dfrac{15}{17}\\).","proc":"interpret","band":"standard","comp":"","two":true},{"id":"R10-49","stem":"A zipline cable \\(20\\) m long makes a \\(35^\\circ\\) angle with the horizontal. How far does the rider drop from the start to the end of the cable?","opts":["\\(14.00\\) m","\\(16.38\\) m","\\(34.87\\) m","\\(11.47\\) m"],"a":3,"sol":"The drop is the side opposite the \\(35^\\circ\\) angle, so it equals \\(20 \\sin 35^\\circ \\approx 11.47\\) m. Option B is \\(20 \\cos 35^\\circ\\) (the horizontal distance), A is \\(20 \\tan 35^\\circ\\), and C is \\(20 \\div \\sin 35^\\circ\\).","proc":"employ","band":"standard","comp":"","two":true},{"id":"R10-50","stem":"A man on a cliff looks down at a boat. A student states: \"The angle he looks down through is an angle of depression, and it equals the angle of elevation from the boat to the man.\" Is the statement correct?","opts":["Yes, because the horizontal lines at the two positions are parallel and the angles are alternate interior angles.","No, because the two angles are supplementary.","No, because looking down gives an angle of elevation.","Yes, because both angles are measured from the vertical."],"a":0,"sol":"The angle below the horizontal is the angle of depression. The horizontal line through the man and the horizontal line through the boat are parallel, so the angle of depression and the angle of elevation are alternate interior angles and are therefore congruent.","proc":"reason","band":"standard","comp":""},{"id":"R10-51","stem":"An observer whose eyes are \\(1.5\\) m above the ground stands \\(20\\) m from a tree. The angle of elevation of the treetop from his eyes is \\(40^\\circ\\). How tall is the tree, to the nearest hundredth?","opts":["\\(12.86\\) m","\\(16.78\\) m","\\(18.28\\) m","\\(23.83\\) m"],"a":2,"sol":"The height of the treetop above eye level is \\(20 \\tan 40^\\circ \\approx 16.78\\) m. Adding the \\(1.5\\) m eye height gives \\(16.78 + 1.5 = 18.28\\) m. Option B forgets the eye height, A uses sine, and D uses \\(20 \\div \\tan 40^\\circ\\).","proc":"reason","band":"standard","comp":"","two":true},{"id":"R10-52","stem":"A social media bar graph shows Brand A at \\(95\\) units and Brand B at \\(100\\) units. The vertical axis starts at \\(90\\), so Brand B's bar looks twice as tall. Which change would make the graph fair?","opts":["Use the same color for both bars.","Start the vertical axis at \\(0\\) so bar heights are proportional to the values.","Add a title.","Make the bars wider."],"a":1,"sol":"A truncated axis exaggerates what is only a \\(5\\%\\) difference. Starting the axis at \\(0\\) makes the bar heights proportional to the actual values, while changing the color, adding a title, or widening the bars does not affect how the heights compare.","proc":"reason","band":"standard","comp":""},{"id":"R10-53","stem":"A carnival game requires tossing a coin and rolling a die. A player wins by getting heads and a \\(6\\). How many outcomes are in the sample space, and what is the chance of winning?","opts":["\\(8\\) outcomes; \\(\\dfrac{1}{8}\\)","\\(12\\) outcomes; \\(\\dfrac{1}{12}\\)","\\(36\\) outcomes; \\(\\dfrac{1}{36}\\)","\\(6\\) outcomes; \\(\\dfrac{1}{6}\\)"],"a":1,"sol":"By the fundamental counting principle there are \\(2 \\times 6 = 12\\) equally likely outcomes. Only the outcome \\((H, 6)\\) wins, so the probability is \\(\\dfrac{1}{12}\\).","proc":"interpret","band":"basic","comp":"","two":true},{"id":"R10-54","stem":"One card is drawn from a standard \\(52\\)-card deck. A prize is given if it is a heart or a king. A student computes \\(\\dfrac{13}{52} + \\dfrac{4}{52} = \\dfrac{17}{52}\\). What is the correct probability?","opts":["\\(\\dfrac{4}{13}\\), because the king of hearts was counted twice","\\(\\dfrac{17}{52}\\), because the events are independent","\\(\\dfrac{3}{13}\\), because only three kings count","\\(\\dfrac{1}{13}\\), because there are four kings"],"a":0,"sol":"The two events overlap in the king of hearts, which the student counted twice. By the addition rule \\(P = \\dfrac{13}{52} + \\dfrac{4}{52} - \\dfrac{1}{52} = \\dfrac{16}{52} = \\dfrac{4}{13}\\).","proc":"reason","band":"standard","comp":""},{"id":"R10-55","stem":"A raffle bag has \\(5\\) red and \\(3\\) blue marbles. Two marbles are drawn without replacement. A student answers \\(\\dfrac{25}{64}\\). What is the correct probability that both are red?","opts":["\\(\\dfrac{25}{64}\\)","\\(\\dfrac{5}{28}\\)","\\(\\dfrac{5}{14}\\)","\\(\\dfrac{15}{56}\\)"],"a":2,"sol":"Because the draws are without replacement, \\(P = \\dfrac{5}{8} \\cdot \\dfrac{4}{7} = \\dfrac{20}{56} = \\dfrac{5}{14}\\). The student's \\(\\dfrac{25}{64}\\) would be correct only with replacement, since the second draw has one fewer marble and one fewer red.","proc":"interpret","band":"standard","comp":"","two":true}]},{"t":"Section 5","items":[{"id":"R10-56","stem":"A surveyor at \\(A\\) knows that \\(\\angle A = 30^\\circ\\), the side opposite it is \\(a = 5\\) m, and an adjacent side is \\(b = 8\\) m. How many different triangles can be formed?","opts":["None","One","Two","It cannot be determined."],"a":2,"sol":"The height is \\(h = b \\sin A = 8 \\sin 30^\\circ = 4\\). Since \\(h < a < b\\) (that is, \\(4 < 5 < 8\\)), the 5-m side can swing to two positions. This is the SSA ambiguous case, so two different triangles can be formed.","proc":"interpret","band":"standard","comp":"","two":true},{"id":"R10-57","stem":"Two roads of 7 km and 8 km meet at a \\(60^\\circ\\) angle. What is the straight-line distance between their far ends, to the nearest hundredth?","opts":["13.00 km","7.55 km","10.63 km","15.00 km"],"a":1,"sol":"By the law of cosines, \\(c^{2} = 7^{2} + 8^{2} - 2(7)(8)\\cos 60^\\circ = 113 - 56 = 57\\), so \\(c \\approx 7.55\\) km. Choice A comes from a sign error (\\(+56\\)), C ignores the cosine term (\\(\\sqrt{113}\\)), and D simply adds the two roads.","proc":"employ","band":"standard","comp":"","two":true},{"id":"R10-58","stem":"On a game map, a treasure chest \\(P\\) is 4 units to the left of the \\(y\\)-axis and 6 units above the \\(x\\)-axis. What are its coordinates and quadrant?","opts":["\\((4, 6)\\); Quadrant I","\\((-4, -6)\\); Quadrant III","\\((6, -4)\\); Quadrant IV","\\((-4, 6)\\); Quadrant II"],"a":3,"sol":"Being 4 units to the left of the \\(y\\)-axis means \\(x = -4\\), and being 6 units above the \\(x\\)-axis means \\(y = 6\\). A negative \\(x\\) with a positive \\(y\\) lies in Quadrant II.","proc":"employ","band":"basic","comp":"","two":true},{"id":"R10-59","stem":"A game character at \\((2, -1)\\) is moved 3 units left and 5 units up. Where does it land?","opts":["\\((-1, 4)\\)","\\((5, 4)\\)","\\((5, -6)\\)","\\((-1, -6)\\)"],"a":0,"sol":"Moving 3 units left and 5 units up is the translation \\((x - 3,\\, y + 5) = (2 - 3,\\, -1 + 5) = (-1, 4)\\). The other choices get at least one direction wrong.","proc":"employ","band":"basic","comp":"","two":true},{"id":"R10-60","stem":"A design program mirrors a shape across the line \\(y = x\\). A vertex at \\((-2, 5)\\) is reflected. Which is its image?","opts":["\\((-5, 2)\\)","\\((5, -2)\\)","\\((2, 5)\\)","\\((-2, -5)\\)"],"a":1,"sol":"Reflection across the line \\(y = x\\) swaps the coordinates: \\((x, y) \\to (y, x)\\), so \\((-2, 5) \\to (5, -2)\\). Choice A is the reflection across \\(y = -x\\), C is across the \\(y\\)-axis, and D is across the \\(x\\)-axis.","proc":"interpret","band":"standard","comp":"","two":true},{"id":"R10-61","stem":"A drone at \\((3, -4)\\) rotates \\(90^\\circ\\) counterclockwise about the origin. Which is its new position?","opts":["\\((-4, -3)\\)","\\((-3, 4)\\)","\\((4, 3)\\)","\\((-4, 3)\\)"],"a":2,"sol":"A \\(90^\\circ\\) counterclockwise rotation about the origin maps \\((x, y)\\) to \\((-y, x)\\), so \\((3, -4) \\to (4, 3)\\). Choice A is a \\(90^\\circ\\) clockwise rotation and B is a \\(180^\\circ\\) rotation.","proc":"interpret","band":"standard","comp":"","two":true},{"id":"R10-62","stem":"A coast guard vessel leaves port and sails 10 km on a bearing of \\(060^\\circ\\), then 15 km on a bearing of \\(120^\\circ\\). How far is it from the port, to the nearest hundredth?","opts":["21.79 km","18.03 km","25.00 km","13.23 km"],"a":0,"sol":"The interior angle of the path at the turning point is \\(180^\\circ - (120^\\circ - 60^\\circ) = 120^\\circ\\). By the law of cosines, \\(d^{2} = 10^{2} + 15^{2} - 2(10)(15)\\cos 120^\\circ = 325 + 150 = 475\\), so \\(d \\approx 21.79\\) km. Choice B treats the turn as \\(90^\\circ\\), C just adds the legs, and D uses \\(\\cos 60^\\circ\\) instead of \\(\\cos 120^\\circ\\).","proc":"reason","band":"stretch","comp":"","two":true},{"id":"R10-63","stem":"A cooling unit switches on when the sensor reading \\(x\\) (in \\(^\\circ\\)C) satisfies \\(x^{2} - x - 6 > 0\\). Which number line shows the readings that switch it on?","opts":["Closed circles at \\(-2\\) and 3, shaded to the left of \\(-2\\) and to the right of 3","Open circles at \\(-2\\) and 3, shaded to the left of \\(-2\\) and to the right of 3","Open circles at \\(-2\\) and 3, shaded between them","Closed circles at \\(-2\\) and 3, shaded between them"],"a":1,"sol":"Factoring, \\(x^{2} - x - 6 = (x - 3)(x + 2) > 0\\) when \\(x < -2\\) or \\(x > 3\\). The inequality is strict, so the circles are open, and the outer regions (to the left of \\(-2\\) and to the right of 3) are shaded.","proc":"employ","band":"standard","comp":""},{"id":"R10-64","stem":"A stall's daily result (in thousand pesos) is modeled by \\(x^{2} - 5x + 4\\), where \\(x\\) is the number of hundred customers. The stall makes no profit (loss or break-even) when the value is at most 0. Which interval notation describes this?","opts":["\\((1, 4)\\)","\\([1, 4]\\)","\\((-\\infty, 1] \\cup [4, \\infty)\\)","\\((-\\infty, 1) \\cup (4, \\infty)\\)"],"a":1,"sol":"Factoring, \\((x - 1)(x - 4) \\le 0\\) holds between the roots, including them: \\(1 \\le x \\le 4\\). So the stall makes no profit from 100 to 400 customers. Choice A leaves out the break-even points, and C and D describe the outer regions.","proc":"reason","band":"standard","comp":"","two":true},{"id":"R10-65","stem":"A rectangular garden has width \\(x\\) meters and length \\((x + 4)\\) meters. Its area must be at most 60 m\\(^2\\). Which greatest width and fencing length are justified by the inequality?","opts":["6 m; 32 m","10 m; 48 m","6 m; 16 m","4 m; 24 m"],"a":0,"sol":"The condition \\(x(x + 4) \\le 60\\) gives \\((x + 10)(x - 6) \\le 0\\), so \\(-10 \\le x \\le 6\\). Since width must be positive, the greatest width is 6 m and the length is \\(6 + 4 = 10\\) m. The fencing (perimeter) is \\(2(6 + 10) = 32\\) m. Choice C gives the semi-perimeter, not the perimeter.","proc":"formulate","band":"stretch","comp":"","two":true},{"id":"R10-66","stem":"A drainage boundary follows the curve \\(y = x^{2} - 2x\\). A sensor must be placed strictly below the curve. Which location \\((x, y)\\) works?","opts":["\\((3, 1)\\)","\\((2, 0)\\)","\\((1, 0)\\)","\\((0, 1)\\)"],"a":0,"sol":"Test each point in \\(y < x^{2} - 2x\\). For \\((3, 1)\\): \\(1 < 9 - 6 = 3\\) is true. For \\((2, 0)\\): \\(0 < 0\\) is false because the point is on the curve. For \\((1, 0)\\): \\(0 < -1\\) is false. For \\((0, 1)\\): \\(1 < 0\\) is false. Only \\((3, 1)\\) works.","proc":"employ","band":"standard","comp":"","two":true},{"id":"R10-67","stem":"A zoning rule applies to all points where \\(y > 2x - 3\\). How should the region be graphed on a map?","opts":["A solid line, shaded below the line","A dashed line, shaded above the line","A solid line, shaded above the line","A dashed line, shaded below the line"],"a":1,"sol":"The symbol \\(>\\) is strict, so points on the line are excluded and the boundary is dashed. \\(y\\) greater than the line means the region above it; testing \\((0, 0)\\) gives \\(0 > -3\\), which is true, and the origin lies above the line.","proc":"reason","band":"standard","comp":"","two":true},{"id":"R10-68","stem":"A calibration device shows an error reading of \\(|2x - 3|\\) mm at setting \\(x\\). Which settings produce exactly 7 mm of error?","opts":["\\(\\{5\\}\\)","\\(\\{-5, 2\\}\\)","\\(\\{-2, 5\\}\\)","\\(\\{-7, 7\\}\\)"],"a":2,"sol":"Solving \\(2x - 3 = 7\\) gives \\(x = 5\\), and \\(2x - 3 = -7\\) gives \\(x = -2\\).
