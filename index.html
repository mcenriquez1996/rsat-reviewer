 An absolute value equation usually has two solutions, so choice A is incomplete, and B comes from sign errors.","proc":"employ","band":"standard","comp":"","two":true},{"id":"R10-69","stem":"A cooler is set at \\(2\\ ^\\circ\\)C, and its temperature \\(T\\) must stay less than 5 degrees away from the setting: \\(|T - 2| < 5\\). Which interval gives the allowable temperatures?","opts":["\\((-3, 7)\\)","\\([-3, 7]\\)","\\((-\\infty, -3) \\cup (7, \\infty)\\)","\\((-7, 3)\\)"],"a":0,"sol":"The condition \\(|T - 2| < 5\\) means \\(-5 < T - 2 < 5\\), so \\(-3 < T < 7\\). The inequality is strict, so the endpoints are excluded. Choice C describes temperatures more than 5 degrees away.","proc":"reason","band":"standard","comp":"","two":true},{"id":"R10-70","stem":"A teacher says a student's score falls at the 5th decile (D5). Which measure is equivalent?","opts":["First quartile (Q1)","25th percentile (P25)","50th percentile (P50)","Third quartile (Q3)"],"a":2,"sol":"The 5th decile \\(D_5\\) divides the data into two equal halves, so \\(D_5 = Q_2 = P_{50}\\), which is the median.","proc":"interpret","band":"basic","comp":"","two":true},{"id":"R10-71","stem":"A box-and-whisker plot of daily commute times (in minutes) has min \\(= 12\\), \\(Q_1 = 20\\), median \\(= 28\\), \\(Q_3 = 40\\), and max \\(= 55\\). Which interpretation is correct?","opts":["The IQR is 43.","About 25% of commutes are longer than 55 minutes.","The median commute is 40 minutes.","The IQR is 20 minutes, and about half of the commutes lie between 20 and 40 minutes."],"a":3,"sol":"The IQR \\(= Q_3 - Q_1 = 40 - 20 = 20\\), and the box holds the middle 50% of the data, so about half the commutes lie between 20 and 40 minutes. The value 43 is the range, not the IQR. The commutes are also more spread out above the median (\\(40 - 28 = 12\\)) than below it (\\(28 - 20 = 8\\)).","proc":"reason","band":"standard","comp":""},{"id":"R10-72","stem":"A principal draws a \"less than\" cumulative frequency polygon (ogive) of test scores. On the horizontal axis, where is each cumulative frequency plotted?","opts":["At the class marks","At the upper class boundaries","At the lower class limits","At the class frequencies"],"a":1,"sol":"A \"less than\" cumulative frequency counts all values below an upper boundary, so each point is plotted at the upper class boundary.","proc":"interpret","band":"basic","comp":"","two":true},{"id":"R10-73","stem":"A store's daily sales (in thousand pesos) over ten days are 3, 5, 6, 8, 9, 11, 12, 14, 15, 38. The manager wants the IQR and any outlier (use the medians of the lower and upper halves for the quartiles). Which result is correct?","opts":["IQR \\(= 8\\); no outliers","IQR \\(= 9\\); outlier \\(= 3\\)","IQR \\(= 8\\); outlier \\(= 38\\)","IQR \\(= 35\\); outlier \\(= 38\\)"],"a":2,"sol":"\\(Q_1 = 6\\) (the median of 3, 5, 6, 8, 9) and \\(Q_3 = 14\\) (the median of 11, 12, 14, 15, 38), so IQR \\(= 8\\). The upper fence is \\(14 + 1.5(8) = 26\\), and since \\(38 > 26\\), 38 is an outlier. The lower fence is \\(6 - 12 = -6\\), so there is no low outlier. Choice D is the range.","proc":"reason","band":"stretch","comp":"","two":true},{"id":"R10-74","stem":"Ten learners scored 12, 15, 18, 20, 22, 25, 27, 30, 32, 35. Using \\(\\text{PR} = \\left(\\dfrac{\\text{number of scores below}}{N}\\right) \\times 100\\), what is the percentile rank of the score 25?","opts":["60","50","55","25"],"a":1,"sol":"Five scores (12, 15, 18, 20, 22) are below 25 and \\(N = 10\\), so \\(\\text{PR} = \\dfrac{5}{10} \\times 100 = 50\\). This means the score 25 is higher than 50% of the scores. Choice D confuses the score with its rank.","proc":"employ","band":"standard","comp":"","two":true},{"id":"R10-75","stem":"A parent says, \"My child got 80% of the items right.\" The report card actually says the child is at the 80th percentile. Which statement correctly interprets the report?","opts":["The child scored higher than about 80% of the examinees.","The child answered 80% of the items correctly.","The child ranked 80th among all examinees.","The child got a raw score of 80."],"a":0,"sol":"A percentile shows relative standing: about 80% of examinees scored lower than this child. It does not tell the percent of items answered correctly or the raw score.","proc":"reason","band":"standard","comp":""}]}]}];
  function itype(it){return it.type||'mc';}
  function prepItem(it){
    var o={},k;for(k in it)if(Object.prototype.hasOwnProperty.call(it,k))o[k]=it[k];
    o.type=itype(it);
    if((o.type==='mc'||o.type==='claim'||o.type==='repr')&&!o.fixOrder){
      var idx=shuffle(it.opts.map(function(x,i){return i;}));
      o.opts=idx.map(function(i){return it.opts[i];});
      if(it.why)o.why=idx.map(function(i){return it.why[i];});
      if(it.optFig)o.optFig=idx.map(function(i){return it.optFig[i];});
      o.a=idx.indexOf(it.a);o._ord=idx;
    }
    return o;
  }
  function blankResp(it){var t=itype(it);if(t==='grid')return it.rows.map(function(){return null;});if(t==='match')return it.parts.map(function(){return '';});if(t==='num'||t==='open')return '';return null;}
  function parseNum(s){
    s=String(s==null?'':s).trim().replace(/\s+/g,'').replace(/[\u2212\u2012\u2013\u2014]/g,'-');if(!s)return null;
    if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,'');
    else if(/^-?\d+,\d+$/.test(s))s=s.replace(',','.');
    if(!/^-?(\d+\.?\d*|\.\d+)$/.test(s))return NaN;
    return parseFloat(s);
  }
  function isComplete(it,r){
    var t=itype(it);
    if(t==='grid')return !!r&&r.every(function(v){return v!==null;});
    if(t==='match')return !!r&&r.every(function(v){return v!=='';});
    if(t==='num')return String(r==null?'':r).trim()!=='';
    if(t==='open')return String(r==null?'':r).trim().length>=15;
    return r!==null&&r!==undefined;
  }
  function answerState(it,r){
    var t=itype(it);
    if(isComplete(it,r))return 'full';
    if(t==='grid'&&r&&r.some(function(v){return v!==null;}))return 'part';
    if(t==='match'&&r&&r.some(function(v){return v!=='';}))return 'part';
    return 'none';
  }
  function partialCredit(c,n){return c===n?1:(n>=3&&c===n-1?0.5:0);}
  function scoreItem(it,r){
    var t=itype(it);if(r===null||r===undefined)return 0;
    if(t==='grid'){var c=0;it.rows.forEach(function(row,k){if(r[k]===row.a)c++;});return partialCredit(c,it.rows.length);}
    if(t==='match'){var m=0;it.parts.forEach(function(p,k){if(r[k]!==''&&+r[k]===p.a)m++;});return partialCredit(m,it.parts.length);}
    if(t==='num'){var v=parseNum(r);return (v!==null&&!isNaN(v)&&v>=it.lo&&v<=it.hi)?1:0;}
    if(t==='open')return 0;
    return r===it.a?1:0;
  }
  function stimLabel(it){return it.unitRange?'For items '+it.unitRange[0]+' to '+it.unitRange[1]+', study the situation below':'Study the situation';}
  function stimBlock(it){
    if(!it.stim&&!it.fig)return '';
    var s=it.stim||'';if(s&&s.charAt(0)!=='<')s='<p>'+s+'</p>';
    return '<div class="stimulus"><span class="s-label">'+stimLabel(it)+'</span>'+s+figHtml(it.fig)+'</div>';
  }
  function skillChip(it){return it.proc&&PROC_LABEL[it.proc]?'<span class="pchip">'+PROC_LABEL[it.proc]+'</span>':'';}

  /* response area. mode: 'answer' (interactive), 'show' (locked, marks right and wrong) */
  function respHtml(it,r,mode){
    var t=itype(it),show=(mode==='show'),h='';
    function optCls(i){var c='opt';if(show){if(i===it.a)c+=' correct';else if(r===i)c+=' wrong';}return c;}
    if(t==='mc'||t==='claim'){
      h+='<div class="options'+(it.two?' two':'')+'">';
      it.opts.forEach(function(o,i){h+='<button class="'+optCls(i)+'" data-pick="'+i+'" aria-pressed="'+(r===i)+'"'+(show?' disabled':'')+'><span class="lett">'+LETT[i]+'.</span><span class="otext">'+o+'</span></button>';});
      h+='</div>';
    } else if(t==='repr'){
      h+='<div class="figopts">';
      it.opts.forEach(function(o,i){var c=optCls(i).replace('opt','figopt');h+='<button class="'+c+'" data-pick="'+i+'" aria-pressed="'+(r===i)+'" aria-label="Option '+LETT[i]+': '+esc(String(o).replace(/<[^>]*>/g,''))+'"'+(show?' disabled':'')+'><span class="lett">'+LETT[i]+'</span>'+(it.optFig&&it.optFig[i]?FIGS[it.optFig[i].n](it.optFig[i].a||{}):o)+'</button>';});
      h+='</div>';
    } else if(t==='spot'){
      h+='<ol class="steps">';
      it.steps.forEach(function(s,k){var bad=show&&k===it.a;h+='<li class="'+(bad?'bad':'')+'"><b>Step '+(k+1)+'</b><span class="sl">'+s+'</span>'+(bad&&it.fix?'<span class="fix">'+it.fix+'</span>':'')+'</li>';});
      h+='</ol><div class="options two" style="margin-top:12px">';
      it.steps.forEach(function(s,k){h+='<button class="'+optCls(k)+'" data-pick="'+k+'" aria-pressed="'+(r===k)+'"'+(show?' disabled':'')+'><span class="lett">'+LETT[k]+'.</span><span class="otext">Step '+(k+1)+'</span></button>';});
      h+='</div>';
    } else if(t==='hotspot'){
      h+=figHtml(it.hs,{sel:r,checked:show,key:it.a})+'<div class="hsbtns">';
      it.labels.forEach(function(l,k){h+='<button class="'+optCls(k)+'" data-pick="'+k+'" aria-pressed="'+(r===k)+'"'+(show?' disabled':'')+'>'+l+'</button>';});
      h+='</div>';
    } else if(t==='grid'){
      h+='<div class="grows">';
      it.rows.forEach(function(row,k){
        var v=r?r[k]:null,ok=show&&v===row.a;
        h+='<div class="grow'+(show?(ok?' ok':' no'):'')+'" role="group" aria-label="Statement '+(k+1)+'"><div class="gtext"><b>'+(k+1)+'.</b> '+row.t+'</div><div class="pills">';
        it.cols.forEach(function(c,ci){h+='<button data-row="'+k+'" data-col="'+ci+'" aria-pressed="'+(v===ci)+'"'+(show?' disabled':'')+'>'+c+'</button>';});
        h+='</div>'+(show?'<div class="rowfb"><span class="mark">'+(ok?'&#10003; Right.':'&#10007; Answer: '+it.cols[row.a]+'.')+'</span> '+(row.why||'')+'</div>':'')+'</div>';
      });
      h+='</div>';
    } else if(t==='match'){
      h+='<div class="mrows">';
      it.parts.forEach(function(p,k){
        var v=r?r[k]:'',ok=show&&v!==''&&+v===p.a;
        h+='<div class="mrow'+(show?(ok?' ok':' no'):'')+'"><label for="m-'+it.id+'-'+k+'">'+p.label+'</label><select id="m-'+it.id+'-'+k+'" data-part="'+k+'"'+(show?' disabled':'')+'><option value="">Choose one</option>';
        it.choices.forEach(function(c,ci){h+='<option value="'+ci+'"'+(String(v)===String(ci)?' selected':'')+'>'+c+'</option>';});
        h+='</select>'+(show?'<div class="rowfb"><span class="mark">'+(ok?'&#10003; Right.':'&#10007; Answer: '+it.choices[p.a]+'.')+'</span> '+(p.why||'')+'</div>':'')+'</div>';
      });
      h+='</div>';
    } else if(t==='num'){
      h+='<div class="numrow"><label class="sr" for="num-'+it.id+'">Your answer</label><input id="num-'+it.id+'" data-num="1" type="text" inputmode="decimal" autocomplete="off" value="'+esc(r==null?'':r)+'"'+(show?' disabled':'')+'>'+(show?'':'<button type="button" class="negbtn" data-neg="1" aria-label="Switch between positive and negative">&plusmn;</button>')+'<span class="unit">'+(it.unit||'')+'</span></div>';
    } else if(t==='open'){
      h+='<label class="sr" for="ta-'+it.id+'">Your explanation</label><textarea id="ta-'+it.id+'" data-open="1" maxlength="600" placeholder="Write your answer and your reason here."'+(show?' readonly':'')+'>'+esc(r==null?'':r)+'</textarea><div class="counter" id="cnt-'+it.id+'">'+String(r==null?'':r).length+' / 600</div>';
    }
    return h;
  }
  function whyText(it,r){
    var t=itype(it);
    if(t==='num'){
      if(!isComplete(it,r))return 'No answer was typed. Accepted: '+it.lo+' to '+it.hi+' '+(it.unit||'')+'.';
      var v=parseNum(r),msg='You typed '+esc(r)+' '+(it.unit||'')+'. Accepted: '+it.lo+' to '+it.hi+' '+(it.unit||'')+'.';
      (it.errs||[]).forEach(function(e){if(!isNaN(v)&&Math.abs(v-e.v)<0.5)msg+=' '+e.msg;});
      return msg;
    }
    if(t==='grid'||t==='match'){var list=it.rows||it.parts,c=0;list.forEach(function(x,k){if(r&&r[k]!==null&&r[k]!==''&&+r[k]===x.a)c++;});return c+' of '+list.length+' '+(it.rows?'rows':'parts')+' right.';}
    if(r===null||r===undefined)return 'Not answered.';
    if(it.why&&it.why[r]!==undefined)return (r===it.a?'':'<b>Why not:</b> ')+it.why[r];
    return '';
  }
  function verdictHtml(score,body,label){
    var cls=score===1?'ok':(score===0.5?'part':'no');
    var txt=label||(score===1?'&#10003; Correct':(score===0.5?'Partly correct &middot; 0.5 point':'&#10005; Not quite'));
    return '<div class="solution '+cls+'"><div class="verdict">'+txt+'</div><div class="body">'+body+'</div></div>';
  }
  function solBody(it,r,extra){var w=whyText(it,r);return (w?'<p class="why">'+w+'</p>':'')+(extra||'')+'<p><b>Solution.</b> '+it.sol+'</p>';}

  function refocus(root,sel){try{var x=root.querySelector(sel);if(x&&x.focus)x.focus({preventScroll:true});}catch(err){}}
  /* binds the interactive response area; ctl = {get, set(v), redraw(), soft(), enter()} */
  function bindResp(el,it,ctl){
    qa(el,'[data-pick]').forEach(function(b){b.addEventListener('click',function(){if(b.disabled)return;var k=b.getAttribute('data-pick');ctl.set(+k);ctl.redraw();refocus(el,'[data-pick="'+k+'"]');});});
    qa(el,'[data-hs]').forEach(function(g){
      g.addEventListener('click',function(){ctl.set(+g.getAttribute('data-hs'));ctl.redraw();});
    });
    qa(el,'[data-row]').forEach(function(b){b.addEventListener('click',function(){if(b.disabled)return;var r=(ctl.get()||blankResp(it)).slice();r[+b.getAttribute('data-row')]=+b.getAttribute('data-col');ctl.set(r);ctl.redraw();refocus(el,'[data-row="'+b.getAttribute('data-row')+'"][data-col="'+b.getAttribute('data-col')+'"]');});});
    qa(el,'select[data-part]').forEach(function(s){s.addEventListener('change',function(){var r=(ctl.get()||blankResp(it)).slice();r[+s.getAttribute('data-part')]=s.value;ctl.set(r);ctl.soft();});});
    qa(el,'[data-neg]').forEach(function(b){b.addEventListener('click',function(){var v=String(ctl.get()==null?'':ctl.get()).trim();v=v.charAt(0)==='-'?v.slice(1):'-'+v;ctl.set(v);var inp=el.querySelector('input[data-num]');if(inp){inp.value=v;inp.focus();}ctl.soft();});});
    qa(el,'input[data-num]').forEach(function(inp){
      inp.addEventListener('input',function(){ctl.set(inp.value);ctl.soft();});
      inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();if(ctl.enter)ctl.enter();}});
    });
    qa(el,'textarea[data-open]').forEach(function(ta){ta.addEventListener('input',function(){ctl.set(ta.value);var c=document.getElementById('cnt-'+it.id);if(c)c.textContent=ta.value.length+' / 600';ctl.soft();});});
  }
  function breakdownHtml(items,scores){
    var by={};items.forEach(function(it,i){if(!it.proc||itype(it)==='open')return;if(!by[it.proc])by[it.proc]={p:0,n:0};by[it.proc].p+=scores[i]||0;by[it.proc].n++;});
    var rows=PROC_ORDER.filter(function(k){return by[k];}).map(function(k){return '<div class="bk"><span>'+PROC_LABEL[k]+'</span><b>'+fmtPts(by[k].p)+' / '+by[k].n+'</b></div>';}).join('');
    return rows?'<div class="breakdown"><div class="s-label">By skill</div>'+rows+'</div>':'';
  }

  /* ---------- stages and progress ---------- */
  function stagesFor(id){return STAGE_DEFS[id]||[];}
  function scoredCount(st){return st.items.filter(function(it){return itype(it)!=='open';}).length;}
  function passMark(len){return Math.max(1,Math.round(len*0.7));}
  function stageKey(id,i){return id+'-s'+i;}
  function stageCleared(id,i){var st=stagesFor(id)[i];if(!st)return false;var d=load(),k=stageKey(id,i);return !!(d[k]&&d[k].cleared)||best(k)>=passMark(scoredCount(st));}
  function markCleared(key){var d=load();if(!d[key])d[key]={};d[key].cleared=true;save(d);}
  function stageUnlocked(id,i){return i===0||stageCleared(id,i-1);}
  function topicProgress(id){var st=stagesFor(id);var c=0;for(var i=0;i<st.length;i++)if(stageCleared(id,i))c++;return {cleared:c,total:st.length};}
  function nextIncomplete(){for(var i=0;i<TOPICS.length;i++){var id=TOPICS[i].id;var st=stagesFor(id);for(var j=0;j<st.length;j++){if(stageUnlocked(id,j)&&!stageCleared(id,j))return{id:id,j:j};}}return null;}
  function migrate(){
    var d=load();if(d.bank===BANK_VERSION)return;
    TOPICS.forEach(function(t){stagesFor(t.id).forEach(function(st,i){var k=stageKey(t.id,i);if(d[k]&&+d[k].best>=passMark(scoredCount(st)))d[k].cleared=true;});});
    d.bank=BANK_VERSION;save(d);
  }

  var app=document.getElementById('app');
  var state={view:'home',topic:null,sub:'path',stageIndex:0,quiz:null,mock:null,updateReady:false,note:''};

  function render(){
    if(state.view==='home')return renderHome();
    if(state.view==='topic')return renderTopic();
    if(state.view==='mocksections')return renderMockSections();
    if(state.view==='pthub')return renderPtHub();
    if(state.view==='ptrun')return renderPtRun();
    if(state.view==='mock')return renderMock();
    if(state.view==='preview')return renderPreview();
    if(state.view==='audit')return renderAudit();
    if(state.view==='teacher')return renderTeacher();
    if(state.view==='print')return renderPrint();
  }
  function clearHash(){try{if(location.hash)history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
  function go(view){state.view=view;render();window.scrollTo(0,0);}
  function updateBanner(){return state.updateReady?'<div class="update" role="status"><span>A new version of the reviewer is ready.</span><button class="cta" id="updbtn">Refresh</button></div>':'';}
  function bindUpdate(){var b=document.getElementById('updbtn');if(b)b.addEventListener('click',function(){location.reload();});}

  function renderHome(){
    var started=0;var tm=themeMeta(getTheme());
    var cards=TOPICS.map(function(t){

  function newQuizItem(q){q.resp=blankResp(q.items[q.i]||{});q.checked=false;q.tries=0;q.hint='';q.secondOk=false;q.score=0;q.lastV=null;q.firstResp=null;}
  function setupQuiz(items,saveKey,title,context,explain){

  function quizCheck(pane){
    var q=state.quiz,it=q.items[q.i];if(q.checked||!isComplete(it,q.resp))return;
    if(itype(it)==='num'){
      var v=parseNum(q.resp);
      if(v===null||isNaN(v)){q.hint='Type a number only, like 45 or 12.5.';renderQuiz(pane);var i0=document.getElementById('num-'+it.id);if(i0)i0.focus();return;}
      if(q.tries===1&&v===q.lastV){q.hint='Change your answer, then check again.';renderQuiz(pane);var i2=document.getElementById('num-'+it.id);if(i2){i2.focus();i2.select();}return;}
      q.tries++;q.lastV=v;var ok=v>=it.lo&&v<=it.hi;
      if(q.tries===1){q.score=ok?1:0;q.firstResp=q.resp;}
      if(ok){q.secondOk=q.tries>1;q.checked=true;q.hint='';}
      else if(q.tries===1){var msg=it.generic||'Not yet. Check your work once more.';(it.errs||[]).forEach(function(e){if(Math.abs(v-e.v)<0.5)msg=e.msg;});q.hint=msg+' Try once more.';}
      else{q.checked=true;q.hint='';}
      renderQuiz(pane);
      if(!q.checked){var inp=document.getElementById('num-'+it.id);if(inp){inp.focus();inp.select();}}
      else window.scrollTo(0,document.body.scrollHeight);
      return;
    }
    q.score=scoreItem(it,q.resp);q.checked=true;renderQuiz(pane);window.scrollTo(0,document.body.scrollHeight);
  }
  function renderQuiz(pane){
    var q=state.quiz;
    if(!q){pane.innerHTML='';return;}
    if(!q.started){
      pane.innerHTML='<div class="panel quiz-intro"><div class="big">'+q.items.length+'</div>'+
        '<p style="margin:8px 0 0;font-weight:600">'+(q.context==='preview'?'Sample questions':'Practice questions')+'</p>'+

      typeset(pane);return;

    if(q.i>=q.items.length){if(q.explain&&!q.explainDone)return renderExplain(pane);return renderResult(pane);}

      fb=verdictHtml(q.score,solBody(it,q.resp,extra));

      '<button class="cta" id="act" '+(!q.checked&&!isComplete(it,q.resp)?'disabled':'')+'>'+
        (q.checked?(q.i===q.items.length-1?(q.explain?'Continue':'See results'):'Next question'):'Check answer')+'</button>';

  function renderResult(pane){
    var q=state.quiz;var n=q.items.length;var pts=q.scores.reduce(function(a,b){return a+b;},0);var pct=n?Math.round(pts/n*100):0;

  /* ---------- mock test: timed sections with a saved snapshot ---------- */
  function fmtTime(ms){var s=Math.max(0,Math.floor(ms/1000));var m=Math.floor(s/60);var ss=s%60;return m+':'+(ss<10?'0':'')+ss;}
  function stopTimer(){if(state.mock&&state.mock.timerId){clearInterval(state.mock.timerId);state.mock.timerId=null;}}
  function tickTimer(){if(!state.mock||state.mock.submitted)return;var rem=state.mock.endTime-Date.now();if(rem<=0){submitMock();return;}var el=document.getElementById('timer');if(el){el.textContent=fmtTime(rem);el.className='timer'+(rem<300000?' low':'');}}
  function mockSectTime(id){
    var sets={},m=0;MOCK[id].forEach(function(it){m+=TYPE_MIN[itype(it)]||1;if(it.set)sets[it.set]=1;});
    return Math.max(10,Math.ceil(m+Object.keys(sets).length));
  }
  function mockSectKey(id){return 'mock-'+id;}
  function mockSectDone(id){var d=load();return !!d['md_'+id];}
  function mockSectUnlocked(i){return i===0||mockSectDone(TOPICS[i-1].id);}
  function mockProgress(){var done=0,score=0,total=0;for(var i=0;i<TOPICS.length;i++){var id=TOPICS[i].id;total+=MOCK[id].length;if(mockSectDone(id)){done++;score+=best(mockSectKey(id));}}return{done:done,sections:TOPICS.length,score:score,total:total};}
  function loadSnap(){try{var s=JSON.parse(localStorage.getItem(SNAP));return s&&s.items&&s.resp?s:null;}catch(e){return null;}}
  function saveSnap(){var m=state.mock;if(!m||m.submitted)return;try{localStorage.setItem(SNAP,JSON.stringify({v:BANK_VERSION,s:m.sectionIndex,items:m.items,resp:m.resp,i:m.i,endTime:m.endTime,title:m.title,saveKey:m.saveKey}));}catch(e){}}
  function clearSnap(){try{localStorage.removeItem(SNAP);}catch(e){}}
  function assembleSection(list){
    var groups=[],bySet={};
    list.forEach(function(it){var k=it.set;if(k){if(!bySet[k]){bySet[k]=[];groups.push(bySet[k]);}bySet[k].push(it);}else groups.push([it]);});
    groups=shuffle(groups);
    var bi=0,br=99;groups.forEach(function(g,k){var r=BAND_RANK[g[0].band];if(r===undefined)r=1;if(r<br){br=r;bi=k;}});
    if(bi>0)groups.unshift(groups.splice(bi,1)[0]);
    var out=[];groups.forEach(function(g){var start=out.length+1;g.forEach(function(it){var p=prepItem(it);if(g.length>1)p.unitRange=[start,start+g.length-1];out.push(p);});});
    return out;
  }

    var sc=scoreSnap(s.items,s.resp);setBest(s.saveKey,sc);var d=load();d['md_'+TOPICS[s.s].id]=1;save(d);
    try{saveCode(s.saveKey,makeCode('m',TOPICS[s.s].id,s.items,s.resp,s.items.map(function(it,i){return scoreItem(it,s.resp[i]);})));}catch(err){}
    clearSnap();
    state.note='Time ran out on Section '+(s.s+1)+'. It was submitted with your saved answers: '+fmtPts(sc)+'/'+s.items.length+'.';
  }
  function renderMockSections(){
    finishExpiredSnap();var mp=mockProgress();var snap=loadSnap();
    if(state.hubTimer){clearTimeout(state.hubTimer);state.hubTimer=null;}
    if(snap)state.hubTimer=setTimeout(function(){state.hubTimer=null;if(state.view==='mocksections')render();},Math.max(0,snap.endTime-Date.now())+250);
    var resume='';
    if(snap){resume='<div class="section-label">In progress</div><div class="cards"><button class="card-btn" id="resume"><span class="badge">&#9654;</span><span class="card-body"><h3>Resume Section '+(snap.s+1)+'</h3><p>'+snap.title+' &middot; time left '+fmtTime(snap.endTime-Date.now())+'</p></span><span class="chip live">Resume</span></button></div>';}
    var cards=TOPICS.map(function(t,i){
      var done=mockSectDone(t.id);var unlocked=mockSectUnlocked(i)&&!snap;var bs=best(mockSectKey(t.id));var n=MOCK[t.id].length;
      var chip=done?'<span class="chip done">&#10003; '+fmtPts(bs)+'/'+n+'</span>':(unlocked?'<span class="chip live">Start</span>':'<span class="chip soon">&#128274; '+(snap&&mockSectUnlocked(i)?'Finish the open section':'Locked')+'</span>');
      var badge=done?'&#10003;':(''+(i+1));
      return '<button class="card-btn" data-sect="'+i+'" '+(unlocked?'':'disabled')+'><span class="badge">'+badge+'</span>'+
        '<span class="card-body"><h3>Section '+(i+1)+': '+t.title+'</h3><p>'+t.sub+' &middot; '+n+' items &middot; '+mockSectTime(t.id)+' min</p></span>'+chip+'</button>';

  /* ---------- audit view for the teacher (open the app with #audit) ---------- */
  function keyText(it){
    var t=itype(it);
    if(t==='mc'||t==='claim'||t==='repr')return LETT[it.a]+'. '+it.opts[it.a];
    if(t==='spot')return 'Step '+(it.a+1);
    if(t==='hotspot')return it.labels[it.a];
    if(t==='grid')return it.rows.map(function(r,k){return (k+1)+' '+it.cols[r.a];}).join('; ');
    if(t==='match')return it.parts.map(function(p){return p.label+': '+it.choices[p.a];}).join('; ');
    if(t==='num')return it.ans+' '+(it.unit||'')+' (accepted '+it.lo+' to '+it.hi+')';
    return 'Model answer';
  }
  function auditItem(it){
    var t=itype(it),opts='';
    if(t==='mc'||t==='claim'||t==='repr')opts='<ol class="aopts">'+it.opts.map(function(o,i){return '<li'+(i===it.a?' class="key"':'')+'>'+o+'</li>';}).join('')+'</ol>';
    return '<div class="aitem"><div class="ameta"><b>'+(it.id||'')+'</b> <span>'+t+'</span> <span>'+(it.proc||'')+'</span> <span>'+(it.band||'')+'</span> <span>'+(it.comp||'')+'</span></div>'+
      (it.stim?'<div class="astim">'+(it.stim.charAt(0)==='<'?it.stim:'<p>'+it.stim+'</p>')+'</div>':'')+'<div class="astem">'+it.stem+'</div>'+opts+
      '<div class="akey"><b>Key:</b> '+keyText(it)+'</div>'+(it.sol?'<div class="asol"><b>Solution.</b> '+it.sol+'</div>':'')+'</div>';
  }

  function cksum(s){var h=7;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%1679616;return ('0000'+h.toString(36)).slice(-4);}

  function encodeResp(it,r){
    var t=itype(it);if(r===null||r===undefined)return '';

  function makeCode(kind,key,items,resps,scores){

  function cleanText(s){return String(s==null?'':s).replace(/[​-‍﻿­]/g,'').replace(/ /g,' ');}
  function validCode(o){return !!o&&(o.k==='p'||o.k==='m'||o.k==='t')&&typeof o.s==='string'&&typeof o.b==='string'&&Array.isArray(o.r)&&o.r.every(function(r){return Array.isArray(r)&&r.length>=3&&typeof r[0]==='string';});}
  /* s starts at 'RSAT-'; finds the split whose checksum is valid, so text stuck to the end is harmless */
  function scanCode(s){
    var m=/^RSAT-([A-Za-z0-9_-]+)/.exec(s);if(!m)return null;var run=m[1];

  function readCode(text){

  function copyText(text,btn,box){

  /* ---------- results analysis for the teacher (open the app with #teacher) ---------- */
  function groupTitle(k,s){
    if(k==='m'){var t=topicById(s);return 'Mock Section '+(TOPICS.indexOf(t)+1)+': '+(t?t.title:esc(s));}
    var mm=/^(.*)-s(\d+)$/.exec(s||'');if(mm){var tp=topicById(mm[1]);return (tp?tp.title:esc(mm[1]))+', practice Stage '+(+mm[2]+1);}
    return esc(s);
  }
  function cleanLabel(s){
    return String(s||'').replace(/["“”]/g,'').replace(/[\t,;|]+/g,' ')
      .replace(/^\s*\d{1,4}[\/.-]\d{1,2}[\/.-]\d{1,4}(\s+\d{1,2}:\d{2}(:\d{2})?(\s*[AP]M)?)?\s*/i,'').replace(/\s+/g,' ').trim();
  }
  function itemFlag(it,n,p,D,opt){
    if(!it)return 'Not in this version';
    if(n<10)return 'Too few answers';
    var tag;
    if(p>0.90||p<0.20)tag='Check: '+(p<0.20?'very hard':'very easy');
    else if(D===null)tag='Check: every student has the same score';
    else if(D<0.10)tag='Reject or rewrite';
    else if(D<0.20)tag=(it.band==='entry'&&p>=0.70)?'Retain':'Revise';
    else tag='Retain';
    if(tag==='Retain'&&opt){var tot=opt.reduce(function(a,b){return a+b;},0);for(var j=0;j<opt.length;j++){if(j!==it.a&&tot&&opt[j]/tot<0.05){tag='Revise: a wrong option chosen by under 5%';break;}}}
    if(tag==='Retain'&&it.band==='entry'&&p<0.70)tag='Revise: entry question below 0.70';
    return tag+(n<60?' (provisional)':'');
  }
  /* upper and lower 27% by total; students tied at a cut count with a fractional weight, so paste order never matters */
  function splitGroups(sorted){
    var n=sorted.length;if(n<4||sorted[0].total===sorted[n-1].total)return null;var cut=Math.max(1,Math.round(n*0.27));
    function band(isUp){
      var edge=isUp?sorted[cut-1].total:sorted[n-cut].total,beyond=0,tied=0,w=[];
      sorted.forEach(function(st){if(isUp?st.total>edge:st.total<edge)beyond++;else if(st.total===edge)tied++;});
      var f=(cut-beyond)/tied;
      sorted.forEach(function(st){if(isUp?st.total>edge:st.total<edge)w.push([st,1]);else if(st.total===edge)w.push([st,f]);});

  function wmean(list,id){var s=0,c=0;list.forEach(function(e){var r=e[0].map[id];if(r){s+=e[1]*r[2];c+=e[1];}});return c?s/c:null;}
  function analyzeCodes(text){
    var ix=bankIndex(),bankOrder=Object.keys(ix),groups={},order=[],seen={},res={bad:0,other:{},changedRows:0,dup:0,retake:0,used:0,groups:[]};
    var lines=cleanText(text).split(/\r?\n/);
    function accept(o,label){
      if(seen[o.raw]){res.dup++;return;}seen[o.raw]=1;
      var rows=o.r.filter(function(r){
        var it=ix[r[0]];if(!it){res.changedRows++;return false;}
        if(o.b!==BANK_VERSION&&(r[3]===undefined||r[3]!==itemFp(it))){res.changedRows++;return false;}
        return true;
      }).map(function(r){return [r[0],String(r[1]==null?'':r[1]),Math.max(0,Math.min(1,+r[2]||0))];});
      if(o.b!==BANK_VERSION)res.other[o.b]=(res.other[o.b]||0)+1;
      if(!rows.length)return;
      var key=o.k+':'+o.s;if(!groups[key]){groups[key]={k:o.k,s:o.s,students:[],byLabel:{}};order.push(key);}
      var g=groups[key],map={};rows.forEach(function(r){map[r[0]]=r;});
      var st={label:label||('Student '+(g.students.length+1)),rows:rows,map:map,t:+o.t||0,total:rows.reduce(function(a,r){return a+r[2];},0)};
      var lk=label?label.toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim():'';
      if(lk&&g.byLabel[lk]){res.retake++;var old=g.byLabel[lk];if(st.t<old.t){g.students[g.students.indexOf(old)]=st;g.byLabel[lk]=st;}return;}
      if(lk)g.byLabel[lk]=st;

    }

      var line=lines[li];if(line.indexOf('RSAT-')<0)continue;
      var first=line.indexOf('RSAT-'),pos=first,found=[],lastEnd=-1,damaged=0;
      while(pos>=0&&pos<line.length){
        var i=line.indexOf('RSAT-',pos);if(i<0)break;
        var next=line.indexOf('RSAT-',i+5),piece=next>0?line.slice(i,next):line.slice(i);
        var r=scanCode(piece);
        if(r){found.push(r.o);lastEnd=i+r.len;pos=i+r.len;continue;}
        var r2=scanCode(piece.replace(/\s+/g,''));
        if(r2){found.push(r2.o);lastEnd=-1;pos=next>0?next:line.length;continue;}
        if(next<0&&li+1<lines.length&&lines[li+1].indexOf('RSAT-')<0){
          var r3=scanCode((piece+lines[li+1]).replace(/\s+/g,''));

      var g=groups[key],n=g.students.length,ids=[];
      g.students.forEach(function(st){st.rows.forEach(function(r){if(ids.indexOf(r[0])<0)ids.push(r[0]);});});
      ids.sort(function(a,b){var x=bankOrder.indexOf(a),y=bankOrder.indexOf(b);return (x<0?1e9:x)-(y<0?1e9:y);});
      var sorted=g.students.slice().sort(function(a,b){return b.total-a.total;}),split=splitGroups(sorted);
      var items=ids.map(function(id){

        var p=taken.length?taken.reduce(function(a,st){return a+st.map[id][2];},0)/taken.length:null;
        var D=null;if(split){var u=wmean(split.up,id),l=wmean(split.lo,id);if(u!==null&&l!==null)D=u-l;}

        if(it&&(t==='mc'||t==='claim'||t==='repr'||t==='spot'||t==='hotspot')){
          var k=(t==='spot'?it.steps:(t==='hotspot'?it.labels:it.opts)).length;opt=[];for(var j=0;j<k;j++)opt.push(0);
          taken.forEach(function(st){var v=st.map[id][1];if(v!==''&&opt[+v]!==undefined)opt[+v]++;});
        }
        if(it&&(t==='grid'||t==='match')){
          var list=it.rows||it.parts;
          rowsPct=list.map(function(row,ri){var c=0;taken.forEach(function(st){var v=st.map[id][1],parts=t==='grid'?v.split(''):v.split('.');if(parts[ri]!==undefined&&parts[ri]!=='-'&&parts[ri]!==''&&+parts[ri]===row.a)c++;});return taken.length?c/taken.length:0;});
        }

        var by={};st.rows.forEach(function(r){var it=ix[r[0]];if(!it||!it.proc)return;if(!by[it.proc])by[it.proc]={p:0,n:0};by[it.proc].p+=r[2];by[it.proc].n++;});

      res.groups.push({key:key,title:groupTitle(g.k,g.s),n:n,maxPts:ids.length,mean:n?g.students.reduce(function(a,s){return a+s.total;},0)/n:0,items:items,students:studs});

  function f2(x){return x===null||x===undefined||isNaN(x)?'-':(Math.round(x*100)/100).toFixed(2);}

    else if(t==='hotspot')h+=figHtml(it.hs,{sel:null,off:true})+'<ol class="popts two" type="A">'+it.labels.map(function(l){return '<li>'+l+'</li>';}).join('')+'</ol>';
    else if(t==='grid')h+='<table class="pgrid"><tr><th>Statement</th>'+it.cols.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr>'+it.rows.map(function(r,k){return '<tr><td>'+(k+1)+'. '+r.t+'</td>'+it.cols.map(function(){return '<td class="box">&#9744;</td>';}).join('')+'</tr>';}).join('')+'</table><p class="pdir">Check one box in each row.</p>';
    else if(t==='match')h+='<ol class="popts" type="A">'+it.choices.map(function(c){return '<li>'+c+'</li>';}).join('')+'</ol>'+it.parts.map(function(p){return '<div class="pline">'+p.label+': ______</div>';}).join('')+'<p class="pdir">Write the letter of the answer for each part.</p>';
    else if(t==='num')h+='<div class="pline">Answer: ______________ '+(it.unit||'')+'</div>';
    return h+'</div></div>';
  }
  function sheetLine(it,num){
    var t=itype(it);
    if(t==='mc'||t==='claim'||t==='repr'||t==='spot'||t==='hotspot'){var k=t==='spot'?it.steps.length:(t==='hotspot'?it.labels.length:it.opts.length),b='';for(var j=0;j<k;j++)b+='<span class="bub">'+LET[j]+'</span>';return '<div class="sline"><b>'+num+'.</b> '+b+'</div>';}
    if(t==='grid')return '<div class="sline"><b>'+num+'.</b> '+it.rows.map(function(r,k){return 'Row '+(k+1)+': '+it.cols.map(function(c){return '<span class="bub w">'+c+'</span>';}).join(' ');}).join('<br>')+'</div>';
    if(t==='match')return '<div class="sline"><b>'+num+'.</b> '+it.parts.map(function(p){return p.label+': ____';}).join(' &nbsp; ')+'</div>';
    if(t==='num')return '<div class="sline"><b>'+num+'.</b> ______________ '+(it.unit||'')+'</div>';
    return '';
  }
  function printKey(it){
    var t=itype(it);
    if(t==='mc'||t==='claim'||t==='repr'||t==='spot'||t==='hotspot')return LET[it.a];
    if(t==='grid')return it.rows.map(function(r,k){return (k+1)+' '+it.cols[r.a];}).join(', ');
    if(t==='match')return it.parts.map(function(p){return p.label+' '+LET[p.a];}).join(', ');
    if(t==='num')return it.ans+' '+(it.unit||'')+' (accept '+it.lo+' to '+it.hi+')';
    return '';
  }
  function renderPrint(){
    var si=state.printSect||0,t=TOPICS[si],items=MOCK[t.id],n=items.length;
    var fields='<div class="pfields"><span>Name: ____________________________</span><span>Grade and section: ____________</span>';
    var booklet='<section class="paper"><div class="phead"><div class="pschool">Sta. Elena High School &middot; Marikina City</div><div class="ptitle">RSAT Reviewer Mock Test</div><div class="psub">Section '+(si+1)+': '+t.title+' &middot; '+n+' items &middot; '+mockSectTime(t.id)+' minutes</div>'+fields+'<span>Date: __________</span><span>Score: _____ / '+n+'</span></div></div>'+
      '<p class="pdir"><b>Directions.</b> Read each situation carefully. For multiple-choice items, write the letter of the best answer on your answer sheet. For other items, follow the directions given with the item.</p>'+
      items.map(function(it,i){return printItem(it,i+1);}).join('')+'</section>';
    var sheet='<section class="paper pbreak"><div class="phead"><div class="ptitle">Answer sheet</div><div class="psub">Section '+(si+1)+': '+t.title+'</div>'+fields+'</div></div><div class="scols">'+items.map(function(it,i){return sheetLine(it,i+1);}).join('')+'</div></section>';
    var key='<section class="paper pbreak"><div class="phead"><div class="ptitle">Answer key (for the teacher)</div><div class="psub">Section '+(si+1)+': '+t.title+' &middot; bank '+BANK_VERSION+'</div></div><div class="tbl-wrap"><table class="pkey"><tr><th>No.</th><th>Key</th><th>Skill</th><th>Band</th><th>Competency</th></tr>'+
      items.map(function(it,i){return '<tr><td>'+(i+1)+'</td><td>'+printKey(it)+'</td><td>'+(it.proc?PROC_LABEL[it.proc]:'')+'</td><td>'+(it.band||'')+'</td><td>'+(it.comp||'')+'</td></tr>';}).join('')+'</table></div></section>';
    app.innerHTML='<div class="topbar noprint"><button class="iconbtn" id="back" aria-label="Back">&larr;</button><div><div class="brand" style="font-size:15px">Print a mock section</div><div class="tag">Test booklet, answer sheet and answer key</div></div></div>'+
      '<p class="note noprint">Choose a section, then use your browser&rsquo;s Print command (Ctrl+P on a computer) to print it or save it as PDF. Printing does not work inside the Claude preview; use the app link.</p>'+
      '<div class="psel noprint"><span>Section</span><div class="seg">'+TOPICS.map(function(tt,i){return '<button data-ps="'+i+'" aria-label="Section '+(i+1)+': '+tt.title+'" aria-selected="'+(i===si)+'">'+(i+1)+'</button>';}).join('')+'</div></div><div class="print">'+booklet+sheet+key+'</div>';
    document.getElementById('back').addEventListener('click',function(){clearHash();go('home');});
    qa(app,'[data-ps]').forEach(function(b){b.addEventListener('click',function(){state.printSect=+b.getAttribute('data-ps');renderPrint();window.scrollTo(0,0);});});
    typeset(app);
  }

  /* ---------- start-up ---------- */
  function route(){
    var h=(location.hash||'').replace('#','');
    if(h==='preview'){stopTimer();state.mock=null;return openPreview();}
    if(h==='audit'){stopTimer();state.mock=null;return go('audit');}
    if(h==='teacher'){stopTimer();state.mock=null;return go('teacher');}
    if(h==='print'){stopTimer();state.mock=null;return go('print');}
    if(state.view==='preview'||state.view==='audit'||state.view==='teacher'||state.view==='print'){state.quiz=null;go('home');}
  }
  migrate();
  applyTheme(getTheme());
  document.addEventListener('visibilitychange',function(){if(!document.hidden){applyTheme(getTheme());if(state.view==='mock'&&state.mock&&!state.mock.submitted)tickTimer();}});
  try{
    if('serviceWorker' in navigator){
      var hadSW=!!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange',function(){
        if(!hadSW)return;state.updateReady=true;
        if(state.view==='home'||state.view==='mocksections'||(state.view==='topic'&&state.sub==='path'))render();
      });
    }
  }catch(e){}
  window.addEventListener('hashchange',route);
  try{if(window.__RSAT_TEST__)window.__RSAT__={BANK_VERSION:BANK_VERSION,STAGE_DEFS:STAGE_DEFS,MOCK:MOCK,PREVIEW:PREVIEW,PRACTICE_TESTS:PRACTICE_TESTS,ptProgress:ptProgress,ptSectDone:ptSectDone,startPtSection:startPtSection,submitPtSection:submitPtSection,ptById:ptById,TOPICS:TOPICS,LESSONS:LESSONS,prepItem:prepItem,scoreItem:scoreItem,isComplete:isComplete,answerState:answerState,parseNum:parseNum,assembleSection:assembleSection,passMark:passMark,scoredCount:scoredCount,stageCleared:stageCleared,migrate:migrate,mockSectTime:mockSectTime,respHtml:respHtml,whyText:whyText,keyText:keyText,makeCode:makeCode,readCode:readCode,encodeResp:encodeResp,analyzeCodes:analyzeCodes,tsvFor:tsvFor,printKey:printKey,itemFp:itemFp,cksum:cksum,storedCode:storedCode,state:state,render:render,load:load,save:save};}catch(e){}
  render();
  route();
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){});});}</script>
</body>
