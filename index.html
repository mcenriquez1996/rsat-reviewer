  var MOCK={
    g9q1:[
      {id:'M-g9q1-01',two:false,stem:'A Marikina shoe stall models a curved sales trend. Which of these is a quadratic equation?',opts:['\\(2x + 5 = 0\\)','\\(3x^2 - x + 4 = 0\\)','\\(x^3 + 1 = 0\\)','\\(5 = 0\\)'],a:1,sol:'A quadratic equation has degree 2.',proc:'employ',band:'entry',comp:'M9AL-Ia-1'},
      {id:'M-g9q1-02',two:true,stim:'Each stall in a new row of the Marikina public market is a square. Each stall has a floor area of \\(6.25\\ \\text{m}^2\\).',stem:'How long is one side of a stall?',opts:['\\(\\pm 2.5\\) m','\\(3.125\\) m','\\(25\\) m','\\(2.5\\) m'],a:3,sol:'The side \\(s\\) satisfies \\(s^2 = 6.25\\), so \\(s = \\pm 2.5\\) because \\(2.5 \\times 2.5 = 6.25\\). A length cannot be negative, so only the positive root fits, and \\(\\pm 2.5\\) m is not a length. Halving the area to get 3.125 m confuses squaring with doubling. Each side of the stall is 2.5 m.',proc:'employ',band:'basic',comp:'M9AL-Ia-b-1'},
      {id:'M-g9q1-03',two:true,stim:'A footbridge model gives \\((x - 3)(x - 4) = 0\\) for where it meets the posts.',stem:'What are the \\(x\\)-values?',opts:['\\(x = 3, 4\\)','\\(x = -3, -4\\)','\\(x = 2, 6\\)','\\(x = 1, 12\\)'],a:0,sol:'Set each factor to 0.',proc:'employ',band:'entry',comp:'M9AL-Ia-b-1'},
      {id:'M-g9q1-04',two:true,stem:'What is the discriminant of \\(x^2 + 5x + 6 = 0\\)?',opts:['\\(49\\)','\\(-1\\)','\\(1\\)','\\(25\\)'],a:2,sol:'\\(25 - 24 = 1\\).',proc:'employ',band:'basic',comp:'M9AL-Ic-1'},
      {id:'M-g9q1-05',two:false,stim:'At the Marikina Sports Center, Bea tosses a volleyball up to serve. Its height is \\(h(t) = -5t^2 + 6t + 2\\) meters after \\(t\\) seconds.',stem:'Coach Dan wants to know if the ball reaches 4 m. What does the discriminant of \\(-5t^2 + 6t + 2 = 4\\) show?',opts:['\\(b^2 - 4ac = 76\\), so the ball passes 4 m twice','\\(b^2 - 4ac = -4\\), so the ball reaches 4 m only at a negative time','\\(b^2 - 4ac = -4\\), so the ball never reaches 4 m','\\(b^2 - 4ac = 156\\), so the ball passes 4 m twice'],a:2,sol:'Moving 4 to the left gives \\(-5t^2 + 6t - 2 = 0\\), so \\(b^2 - 4ac = 6^2 - 4(-5)(-2) = 36 - 40 = -4\\). A negative discriminant means there is no real time at all when the ball is 4 m high; it does not mean a negative time. Using \\(c = 2\\) without moving the 4 gives 76, which answers a different question (when the ball hits the floor). So the ball never reaches 4 m.',proc:'interpret',band:'standard',comp:'M9AL-Ic-1'},
      {id:'M-g9q1-06',two:false,stim:'During a fire drill at Sta. Elena High School, water from a hose follows \\(y = -0.1x^2 + x + 1.4\\). Here \\(y\\) is the height (m) and \\(x\\) is the distance (m) from the nozzle. A 3 m wall stands 4 m away.',stem:'Which statement checks whether the water clears the wall?',opts:['\\(-0.1(4)^2 + 4 + 1.4 > 3\\)','\\(-0.1(3)^2 + 3 + 1.4 > 4\\)','\\(-0.1x^2 + x + 1.4 = 0\\)','\\(-0.1(4) + 4^2 + 1.4 > 3\\)'],a:0,sol:'The wall is at \\(x = 4\\), so substitute 4 for every \\(x\\) and compare the water height with 3 m: \\(-0.1(4)^2 + 4 + 1.4 > 3\\). This gives \\(-1.6 + 4 + 1.4 = 3.8 > 3\\), so the water clears the wall. Putting 3 in for \\(x\\) mixes up the wall&rsquo;s height with its distance, and setting the expression to 0 finds where the water lands instead. The correct check is \\(-0.1(4)^2 + 4 + 1.4 > 3\\).',proc:'formulate',band:'standard',comp:'M9AL-If-g-1'},
      {id:'M-g9q1-07',two:false,stim:'At the Sta. Elena High School science fair, Migo launches a foam rocket from the ground. Its height is \\(h(t) = -5t^2 + 12t\\) meters after \\(t\\) seconds.',stem:'Which statement about \\(h(2)\\) is correct?',opts:['\\(h(2) = 14\\), so the rocket is 14 m high 2 seconds after launch','\\(h(2) = 4\\), so the rocket is at its highest point, 4 m','\\(h(2) = 44\\), so the rocket is 44 m high 2 seconds after launch','\\(h(2) = 4\\), so the rocket is 4 m high 2 seconds after launch'],a:3,sol:'\\(h(2) = -5(2)^2 + 12(2) = -20 + 24 = 4\\), so 2 seconds after launch the rocket is 4 m above the ground. This is not the highest point: the peak is at \\(t = -\\dfrac{12}{2(-5)} = 1.2\\) s, where \\(h(1.2) = 7.2\\) m, so at \\(t = 2\\) the rocket is already coming down. Forgetting to square the 2 gives the wrong value 14. The rocket is 4 m high 2 seconds after launch.',proc:'interpret',band:'standard',comp:'M9AL-Ii-j-2'},
      {id:'M-g9q1-08',two:false,stem:'Rico solves \\(x^2 = 25\\) and writes only \\(x = 5\\). Which values of \\(x\\) satisfy the equation?',opts:['Only \\(x = 5\\)','Both \\(x = 5\\) and \\(x = -5\\)','\\(x = 12.5\\) and \\(x = -12.5\\)','There are no real solutions'],a:1,sol:'Both \\(5^2 = 25\\) and \\((-5)^2 = 25\\), so the equation has two solutions. Rico&rsquo;s answer misses the negative root; dropping it is only right when \\(x\\) is a length or a count, and here it is a plain equation. Halving 25 to get 12.5 confuses squaring with doubling. The solutions are \\(x = 5\\) and \\(x = -5\\).',proc:'reason',band:'basic',comp:'M9AL-Ia-b-1'},
      {id:'M-g9q1-09',two:true,stem:'Solve \\(x^2 = 81\\).',opts:['\\(x = \\pm 9\\)','\\(x = 9\\)','\\(x = \\pm 40.5\\)','\\(x = 81\\)'],a:0,sol:'\\(\\pm\\sqrt{81} = \\pm 9\\).',proc:'employ',band:'entry',comp:'M9AL-Ia-b-1'},
      {id:'M-g9q1-10',two:true,stem:'Solve \\((x - 2)^2 = 16\\).',opts:['\\(x = 4 \\text{ or } -4\\)','\\(x = 18\\)','\\(x = 6 \\text{ or } -2\\)','\\(x = 2 \\text{ or } 16\\)'],a:2,sol:'\\(x - 2 = \\pm 4\\).',proc:'employ',band:'basic',comp:'M9AL-Ia-b-1'},
      {id:'M-g9q1-11',two:false,stem:'Which method best solves \\(x^2 + x - 1 = 0\\), which has no integer factors?',opts:['Factoring','The quadratic formula','Extracting square roots','Setting each term equal to \\(0\\)'],a:1,sol:'Since \\(x^2 + x - 1\\) has no integer factors, factoring fails, and extracting square roots works only when there is no \\(x\\) term. Setting each term equal to 0 misuses the zero-product property, which needs a product equal to 0, not a sum. The quadratic formula works for every quadratic, so it is the best method here.',proc:'reason',band:'basic',comp:'M9AL-Ia-b-1'},
      {id:'M-g9q1-12',two:true,stem:'The sum of the roots of \\(x^2 - 9x + 20 = 0\\) is:',opts:['\\(20\\)','\\(-9\\)','\\(5\\)','\\(9\\)'],a:3,sol:'\\(-\\dfrac{b}{a} = 9\\).',proc:'employ',band:'basic',comp:'M9AL-Ic-2'},
      {id:'M-g9q1-13',two:true,stem:'The product of the roots of \\(x^2 - 9x + 20 = 0\\) is:',opts:['\\(9\\)','\\(-20\\)','\\(4\\)','\\(20\\)'],a:3,sol:'\\(\\dfrac{c}{a} = 20\\).',proc:'employ',band:'basic',comp:'M9AL-Ic-2'},
      {id:'M-g9q1-14',two:false,stem:'If the discriminant equals 0, the roots are:',opts:['Two real and unequal','Two real and equal','Not real','Both equal to \\(0\\)'],a:1,sol:'When \\(b^2 - 4ac = 0\\), the quadratic formula gives \\(x = -\\dfrac{b}{2a}\\) twice, so the roots are real and equal. They are not always 0: \\(x^2 - 2x + 1 = 0\\) has discriminant 0 and the double root 1. So the roots are two real and equal numbers.',proc:'reason',band:'basic',comp:'M9AL-Ic-1'},
      {id:'M-g9q1-15',two:true,stim:'Sample model: a drainage canal in Tumana has the cross-section \\(y = 0.5(x + 3)^2 - 2\\). Here \\(y\\) is the height (m) relative to the ground, and \\(x\\) is the position (m) from a marker post.',stem:'What is the vertex, the deepest point of the canal?',opts:['\\((3, -2)\\)','\\((-3, 2)\\)','\\((-3, -2)\\)','\\((-2, -3)\\)'],a:2,sol:'In \\(y = a(x - h)^2 + k\\), write \\(x + 3\\) as \\(x - (-3)\\), so \\(h = -3\\) and \\(k = -2\\). Taking \\(h = 3\\) is the common sign slip, since the sign inside the brackets flips. The vertex is \\((-3, -2)\\): the deepest point is 2 m below the ground, 3 m on the negative side of the marker.',proc:'employ',band:'basic',comp:'M9AL-Ig-h-i-1'},
      {id:'M-g9q1-16',two:false,stem:'A profit parabola \\(P = ax^2 + bx + c\\) opens downward (a maximum profit) when:',opts:['\\(a < 0\\)','\\(a > 0\\)','\\(a = 0\\)','\\(b < 0\\)'],a:0,sol:'A negative leading coefficient opens downward.',proc:'employ',band:'basic',comp:'M9AL-Ig-h-i-1'},
      {id:'M-g9q1-17',two:true,stem:'Completing the square, \\(y = x^2 + 8x\\) becomes:',opts:['\\(y = (x + 4)^2 + 16\\)','\\(y = (x + 4)^2 - 16\\)','\\(y = (x - 4)^2 - 16\\)','\\(y = (x + 8)^2\\)'],a:1,sol:'Add and subtract 16.',proc:'employ',band:'basic',comp:'M9AL-Ih-1'},
      {id:'M-g9q1-18',two:false,stim:'A basketball court at the Marikina Sports Center is a rectangle. Its length is 13 m more than its width \\(x\\). Its area is \\(420\\ \\text{m}^2\\).',stem:'Which equation models the court?',opts:['\\(2x + 2(x + 13) = 420\\)','\\(x + (x + 13) = 420\\)','\\(x(x - 13) = 420\\)','\\(x(x + 13) = 420\\)'],a:3,sol:'Area is length times width, so \\(x(x + 13) = 420\\). The equation \\(2x + 2(x + 13) = 420\\) uses the perimeter, adding the sides instead of multiplying them. The length is longer than the width, so it is \\(x + 13\\), not \\(x - 13\\). The model is \\(x(x + 13) = 420\\), which fits a 15 m by 28 m court.',proc:'formulate',band:'basic',comp:'M9AL-Ie-1'}
    ],
    g9q2:[
      {id:'M-g9q2-01',two:false,stim:'At a bakery in Barangay Concepcion, the cost \\(C\\) of pandesal varies directly as the number \\(n\\) of pieces (sample prices). Lorna pays ₱45 for 15 pieces.',stem:'What is the constant of variation, and what does it mean here?',opts:['\\(k = 3\\): each peso buys 3 pieces of pandesal','\\(k = 3\\): each piece of pandesal costs ₱3','\\(k = \\dfrac{1}{3}\\): each piece costs one third of a peso','\\(k = 45\\): every purchase costs ₱45'],a:1,sol:'Since \\(C = kn\\), the constant is \\(k = \\dfrac{C}{n} = \\dfrac{45}{15} = 3\\), measured in pesos per piece. Reading 3 as pieces per peso swaps the ratio, since one peso cannot buy 3 pieces at this price. So \\(k = 3\\) means each pandesal costs ₱3.',proc:'interpret',band:'basic',comp:'M9AL-IIb-c-1'},
      {id:'M-g9q2-02',two:true,stim:'Lito rides the same bike-lane route in Marikina every Saturday. His travel time \\(t\\) (minutes) varies inversely as his average speed \\(s\\) (km per hour). At \\(14\\ \\text{km}\\) per hour, the ride takes 42 minutes.',stem:'How long will the ride take at \\(21\\ \\text{km}\\) per hour?',opts:['\\(63\\) min','\\(35\\) min','\\(588\\) min','\\(28\\) min'],a:3,sol:'Inverse variation means \\(t = \\dfrac{k}{s}\\), so \\(k = ts = 42 \\times 14 = 588\\), and then \\(t = \\dfrac{588}{21} = 28\\). Treating it as direct variation gives 63 minutes, but a faster ride cannot take longer. At \\(21\\ \\text{km}\\) per hour, Lito&rsquo;s ride takes 28 minutes.',proc:'employ',band:'standard',comp:'M9AL-IIb-c-1'},
      {id:'M-g9q2-03',two:true,stim:'Mang Ben rents a square stall with area \\(11\\ \\text{m}^2\\) at the Marikina public market. To find its side length, he uses a phone calculator with an exponent key but no square-root key.',stem:'Which entry gives the side length of the stall, in meters?',opts:['\\(11^{\\frac{1}{2}}\\)','\\(11^{2}\\)','\\(11^{-\\frac{1}{2}}\\)','\\(11 \\cdot \\dfrac{1}{2}\\)'],a:0,sol:'The side of a square is the square root of its area, \\(s = \\sqrt{11}\\), and a square root is the same as a one-half power, so \\(s = 11^{\\frac{1}{2}} \\approx 3.32\\). The entry \\(11^{2} = 121\\) squares the area instead of undoing the square, and \\(11^{-\\frac{1}{2}}\\) gives a reciprocal. Mang Ben should enter \\(11^{\\frac{1}{2}}\\) to get a side of about \\(3.32\\ \\text{m}\\).',proc:'formulate',band:'basic',comp:'M9AL-IIf-1'},
      {id:'M-g9q2-04',two:true,stim:'A Marikina shoe factory dilutes leather dye before use. Each dilution step leaves the dye at \\(4^{-1}\\), or one fourth, of its strength.',stem:'After 3 dilution steps, what fraction of the original strength is left?',opts:['\\(-12\\)','\\(\\dfrac{1}{12}\\)','\\(\\dfrac{1}{64}\\)','\\(-64\\)'],a:2,sol:'Three steps multiply the strength by \\(4^{-1}\\) three times, so the fraction left is \\((4^{-1})^3 = 4^{-3} = \\dfrac{1}{4^3} = \\dfrac{1}{64}\\). A negative exponent means a reciprocal, not a negative number, so \\(-64\\) is wrong, and \\(\\dfrac{1}{12}\\) multiplies 4 by 3 instead of using 4 as a factor three times. After 3 steps, only \\(\\dfrac{1}{64}\\) of the dye&rsquo;s original strength is left.',proc:'employ',band:'standard',comp:'M9AL-IId-1'},
      {id:'M-g9q2-05',two:true,stem:'Simplify \\(\\sqrt{72}\\).',opts:['\\(36\\sqrt{2}\\)','\\(2\\sqrt{6}\\)','\\(6\\sqrt{2}\\)','\\(8\\sqrt{3}\\)'],a:2,sol:'\\(\\sqrt{36 \\cdot 2}\\).',proc:'employ',band:'basic',comp:'M9AL-IIg-1'},
      {id:'M-g9q2-06',two:true,stem:'Multiply \\(\\sqrt{2} \\cdot \\sqrt{8}\\).',opts:['\\(4\\)','\\(\\sqrt{10}\\)','\\(16\\)','\\(2\\sqrt{2}\\)'],a:0,sol:'\\(\\sqrt{16} = 4\\).',proc:'employ',band:'basic',comp:'M9AL-IIh-1'},
      {id:'M-g9q2-07',two:true,stem:'\\(y\\) varies directly as \\(x\\) with \\(k = 3\\). Find \\(y\\) when \\(x = 6\\).',opts:['\\(9\\)','\\(2\\)','\\(63\\)','\\(18\\)'],a:3,sol:'\\(3 \\times 6 = 18\\).',proc:'employ',band:'entry',comp:'M9AL-IIb-c-1'},
      {id:'M-g9q2-08',two:true,stem:'Simplify \\(5^0 + 2^0\\).',opts:['\\(0\\)','\\(2\\)','\\(1\\)','\\(7\\)'],a:1,sol:'\\(1 + 1 = 2\\).',proc:'employ',band:'entry',comp:'M9AL-IId-1'},
      {id:'M-g9q2-09',two:true,stem:'Simplify \\(\\sqrt{12} + \\sqrt{27}\\).',opts:['\\(5\\sqrt{3}\\)','\\(\\sqrt{39}\\)','\\(6\\sqrt{3}\\)','\\(5\\sqrt{6}\\)'],a:0,sol:'\\(2\\sqrt{3} + 3\\sqrt{3}\\).',proc:'employ',band:'standard',comp:'M9AL-IIh-1'},
      {id:'M-g9q2-10',two:true,stem:'Simplify \\((a^3)^2\\).',opts:['\\(a^5\\)','\\(a^9\\)','\\(a^6\\)','\\(a^8\\)'],a:2,sol:'Multiply the exponents.',proc:'employ',band:'entry',comp:'M9AL-IId-1'},
      {id:'M-g9q2-11',two:false,stem:'\\(z\\) varies directly as \\(x\\) and inversely as \\(y\\). Which equation models this?',opts:['\\(z = kxy\\)','\\(z = \\dfrac{kx}{y}\\)','\\(z = \\dfrac{ky}{x}\\)','\\(z = kx + y\\)'],a:1,sol:'Direct in \\(x\\), inverse in \\(y\\).',proc:'formulate',band:'basic',comp:'M9AL-IIa-b-1'},
      {id:'M-g9q2-12',two:false,stim:'Joel, a Marikina River Park groundskeeper, lists four sample relationships about the park sprinklers.',stem:'Which relationship is a joint variation?',opts:['Water used varies directly as the minutes one sprinkler runs','Watering time varies directly as the lawn area and inversely as the number of sprinklers','Total water equals the north sprinkler&rsquo;s water plus the south sprinkler&rsquo;s water','Water used varies directly as the number of sprinklers times the minutes they run'],a:3,sol:'Joint variation means one quantity varies directly as the product of two others, like \\(W = knm\\) for the water used by \\(n\\) sprinklers running \\(m\\) minutes. The watering-time rule also uses two quantities, but \\(T = \\dfrac{kA}{n}\\) mixes direct and inverse, so it is combined variation, and the one-sprinkler rule is only direct variation. A plain sum of the north and south sprinklers&rsquo; water is not a variation at all. So Joel&rsquo;s joint variation is the water used, which varies as the number of sprinklers times the minutes they run.',proc:'formulate',band:'standard',comp:'M9AL-IIa-1'},
      {id:'M-g9q2-13',two:false,stim:'A sample community garden in Barangay Tumana has a square plot with area \\(75\\ \\text{m}^2\\). Carlo says its side is \\(25\\sqrt{3}\\ \\text{m}\\). His classmate Joy says the side is \\(5\\sqrt{3}\\ \\text{m}\\).',stem:'Who is right, and why?',opts:['Carlo; \\(75 = 25 \\times 3\\), so \\(\\sqrt{75} = 25\\sqrt{3}\\)','Joy; Carlo&rsquo;s value is correct but not fully simplified','Carlo; 25 is the largest perfect-square factor of 75','Joy; \\(\\sqrt{75} = \\sqrt{25} \\cdot \\sqrt{3} = 5\\sqrt{3}\\), about \\(8.66\\ \\text{m}\\)'],a:3,sol:'Only the perfect-square factor leaves the radical, and it leaves as its square root: \\(\\sqrt{75} = \\sqrt{25} \\cdot \\sqrt{3} = 5\\sqrt{3} \\approx 8.66\\). Carlo&rsquo;s value is not just unsimplified, it is a different number, since \\((25\\sqrt{3})^2 = 1875\\), not 75. Joy is right: each side of the plot is \\(5\\sqrt{3}\\ \\text{m}\\), about \\(8.66\\ \\text{m}\\).',proc:'interpret',band:'standard',comp:'M9AL-IIg-1'},
      {id:'M-g9q2-14',two:true,stem:'Rationalize \\(\\dfrac{1}{\\sqrt{5}}\\).',opts:['\\(\\dfrac{1}{5}\\)','\\(\\dfrac{\\sqrt{5}}{5}\\)','\\(\\sqrt{5}\\)','\\(2\\sqrt{5}\\)'],a:1,sol:'Multiply by \\(\\dfrac{\\sqrt{5}}{\\sqrt{5}}\\).',proc:'employ',band:'basic',comp:'M9AL-IIg-1'}
    ],
    g9q3:[
      {id:'M-g9q3-01',two:true,stem:'In parallelogram \\(ABCD\\), \\(\\angle A = 70^\\circ\\). Find \\(\\angle C\\).',opts:['\\(110^\\circ\\)','\\(70^\\circ\\)','\\(20^\\circ\\)','\\(140^\\circ\\)'],a:1,sol:'Opposite angles are congruent.',proc:'employ',band:'basic',comp:'M9GE-IIIb-1'},
      {id:'M-g9q3-02',two:true,stem:'In parallelogram \\(ABCD\\), \\(\\angle A = 70^\\circ\\). Find \\(\\angle B\\).',opts:['\\(70^\\circ\\)','\\(20^\\circ\\)','\\(140^\\circ\\)','\\(110^\\circ\\)'],a:3,sol:'Consecutive angles are supplementary.',proc:'employ',band:'basic',comp:'M9GE-IIIb-1'},
      {id:'M-g9q3-03',two:false,stem:'The diagonals of a parallelogram always:',opts:['bisect each other','are equal in length','are perpendicular','are parallel'],a:0,sol:'They bisect each other.',proc:'employ',band:'entry',comp:'M9GE-IIIa-2'},
      {id:'M-g9q3-04',two:true,stem:'The diagonals of a rhombus are always:',opts:['equal','parallel','perpendicular','horizontal'],a:2,sol:'Perpendicular.',proc:'employ',band:'entry',comp:'M9GE-IIIc-1'},
      {id:'M-g9q3-05',two:false,stim:'The new canteen at Sta. Elena High School has triangular roof trusses. In each truss, a tie beam joins the midpoints of the two slanted rafters. The bottom beam of each truss is \\(9.6\\ \\text{m}\\) long.',stem:'Carlo has a \\(5\\ \\text{m}\\) board for one tie beam. Is it long enough, and by how much?',opts:['No; it is \\(4.6\\ \\text{m}\\) short','Yes; \\(2.6\\ \\text{m}\\) is left over','Yes; \\(0.2\\ \\text{m}\\) is left over','No; it is \\(14.2\\ \\text{m}\\) short'],a:2,sol:'By the Midline Theorem, the tie beam is half the bottom beam: \\(\\dfrac{9.6}{2} = 4.8\\ \\text{m}\\). The board is long enough, with \\(5 - 4.8 = 0.2\\ \\text{m}\\) left over. Saying it is 4.6 m short treats the tie beam as equal to the bottom beam, but a segment joining two midpoints is only half the third side. Carlo&rsquo;s board works, with 0.2 m to cut off.',proc:'interpret',band:'standard',comp:'M9GE-IIId-1'},
      {id:'M-g9q3-06',two:true,stem:'A trapezoid has bases 8 cm and 16 cm. Its median is:',opts:['\\(12\\) cm','\\(24\\) cm','\\(4\\) cm','\\(128\\) cm'],a:0,sol:'Average of the bases.',proc:'employ',band:'basic',comp:'M9GE-IIId-2'},
      {id:'M-g9q3-07',two:true,stem:'\\(\\triangle ABC \\sim \\triangle DEF\\) with \\(\\dfrac{AB}{DE} = \\dfrac{2}{3}\\) and \\(AB = 8\\). Find \\(DE\\).',opts:['\\(5.3\\)','\\(16\\)','\\(10\\)','\\(12\\)'],a:3,sol:'\\(8 \\div \\tfrac{2}{3} = 12\\).',proc:'employ',band:'basic',comp:'M9GE-IIIf-2'},
      {id:'M-g9q3-08',two:true,stem:'A right triangle has legs 8 and 15. The hypotenuse is:',opts:['\\(23\\)','\\(17\\)','\\(\\sqrt{161}\\)','\\(7\\)'],a:1,sol:'\\(\\sqrt{289} = 17\\).',proc:'employ',band:'basic',comp:'M9GE-IIIj-1'},
      {id:'M-g9q3-09',two:true,stem:'In parallelogram \\(ABCD\\), \\(AB = 12\\). Find \\(CD\\).',opts:['\\(12\\)','\\(6\\)','\\(24\\)','Cannot be determined'],a:0,sol:'Opposite sides are congruent.',proc:'employ',band:'entry',comp:'M9GE-IIIb-1'},
      {id:'M-g9q3-10',two:true,stem:'The diagonals of a rectangle are:',opts:['perpendicular','parallel','equal in length','unequal'],a:2,sol:'Congruent diagonals.',proc:'employ',band:'entry',comp:'M9GE-IIIc-1'},
      {id:'M-g9q3-11',two:false,stem:'A quadrilateral with four congruent sides and four right angles is a:',opts:['rectangle','square','rhombus','trapezoid'],a:1,sol:'A square.',proc:'employ',band:'entry',comp:'M9GE-IIIc-1'},
      {id:'M-g9q3-12',two:true,stem:'The diagonals of a kite are:',opts:['parallel','equal','bisecting each other','perpendicular'],a:3,sol:'Perpendicular.',proc:'employ',band:'entry',comp:'M9GE-IIId-2'},
      {id:'M-g9q3-13',two:false,stim:'A tricycle TODA in Nangka has two triangular signs of different sizes. Sign A has angles of \\(35^\\circ\\) and \\(80^\\circ\\). Sign B has angles of \\(80^\\circ\\) and \\(65^\\circ\\).',stem:'Leah says the two signs are similar triangles. Which evaluation is correct?',opts:['No; the listed angles are different (\\(35^\\circ\\) and \\(80^\\circ\\) versus \\(80^\\circ\\) and \\(65^\\circ\\))','Yes; both signs have an \\(80^\\circ\\) angle, and one matching angle is enough','No; similar triangles need proportional sides, and no side lengths are given','Yes; Sign A&rsquo;s third angle is \\(65^\\circ\\), so two pairs of angles match (AA)'],a:3,sol:'Sign A&rsquo;s third angle is \\(180^\\circ - 35^\\circ - 80^\\circ = 65^\\circ\\), and Sign B&rsquo;s third angle is \\(180^\\circ - 80^\\circ - 65^\\circ = 35^\\circ\\). Both signs have angles \\(35^\\circ\\), \\(80^\\circ\\) and \\(65^\\circ\\), so they are similar by AA. Side lengths are not needed because two matching angle pairs are enough, while one matching angle alone is not. Leah is right: the signs are similar.',proc:'reason',band:'standard',comp:'M9GE-IIIi-1'},
      {id:'M-g9q3-14',two:true,stem:'Two similar triangles have sides in ratio \\(3 : 4\\). Their perimeters are in ratio:',opts:['\\(9 : 16\\)','\\(3 : 4\\)','\\(4 : 3\\)','\\(1 : 1\\)'],a:1,sol:'Same as the side ratio.',proc:'employ',band:'basic',comp:'M9GE-IIIg-1'},
      {id:'M-g9q3-15',two:true,stem:'A right triangle has leg 7 and hypotenuse 25. The other leg is:',opts:['\\(18\\)','\\(32\\)','\\(24\\)','\\(\\sqrt{674}\\)'],a:2,sol:'\\(\\sqrt{576} = 24\\).',proc:'employ',band:'basic',comp:'M9GE-IIIj-1'},
      {id:'M-g9q3-16',two:true,stim:'At 3:00 p.m., Jessa stands beside the Sta. Elena High School building. Jessa is \\(1.5\\ \\text{m}\\) tall and casts a \\(1.8\\ \\text{m}\\) shadow. At the same moment, the building casts a \\(13.2\\ \\text{m}\\) shadow.',stem:'Which equation gives the height \\(h\\) of the building, in meters?',opts:['\\(\\dfrac{h}{13.2} = \\dfrac{1.5}{1.8}\\)','\\(\\dfrac{h}{13.2} = \\dfrac{1.8}{1.5}\\)','\\(h - 1.5 = 13.2 - 1.8\\)','\\(\\dfrac{h}{1.5} = \\dfrac{1.8}{13.2}\\)'],a:0,sol:'The sun&rsquo;s rays hit Jessa and the building at the same angle, so the two height-and-shadow triangles are similar and height over shadow is the same: \\(\\dfrac{h}{13.2} = \\dfrac{1.5}{1.8}\\). This gives \\(h = 13.2 \\times \\dfrac{1.5}{1.8} = 11\\ \\text{m}\\). The equation \\(h - 1.5 = 13.2 - 1.8\\) is tempting, but similar triangles keep ratios equal, not differences. The building is 11 m tall.',proc:'formulate',band:'basic',comp:'M9GE-IIIj-1'}
    ],
    g9q4:[{"id":"M-g9q4-U1-1","type":"hotspot","set":"M-g9q4-U1","proc":"interpret","band":"entry","comp":"M9GE-IVd-1","stim":"<p>At a rescue drill on the Sto. Nino footbridge, Rhea looks down at a banca (small boat) on the river. Her eyes are 6 m above the water. The angle of depression from her eyes to the banca is \\(25^\\circ\\). The sketch is not drawn to scale.</p>","hs":{"n":"depscene"},"stem":"Tap the angle of depression of the banca.","labels":["Angle 1","Angle 2","Angle 3","Angle 4"],"a":0,"why":["Correct. The angle of depression is measured downward from the horizontal line through the eyes to the line of sight, which is this angle.","This is measured from the vertical post, so it is the complement of the depression, not the depression itself.","This is at the banca and opens upward, so it is the angle of elevation of Rhea as seen from the boat; it equals the depression but is named for looking up.","This is on the far side of the boat, so it is the supplement of the elevation; the depression equals the elevation as equal alternate interior angles, not this angle."],"sol":"An angle of depression is measured downward from the horizontal line through the observer's eyes, so its vertex is at Rhea's eye and it opens from that horizontal line down to the line of sight: angle 1. Angle 3 equals it as alternate interior angles, but its vertex is at the banca, where it is the angle of elevation; angle 2 is measured from the vertical, and angle 4, on the far side of the boat, is the supplement of the elevation, not an equal angle."},{"id":"M-g9q4-U1-2","type":"mc","set":"M-g9q4-U1","two":true,"proc":"formulate","band":"basic","comp":"M9GE-IVe-1","stim":"<p>At a rescue drill on the Sto. Nino footbridge, Rhea looks down at a banca (small boat) on the river. Her eyes are 6 m above the water. The angle of depression from her eyes to the banca is \\(25^\\circ\\). The sketch is not drawn to scale.</p>","fig":{"n":"rtri","a":{"opp":"6 m","base":"d","ang":"25°","aria":"Right triangle: 6 m vertical to the eye, horizontal distance d, 25 degree angle at the banca. Not drawn to scale."}},"stem":"Which expression gives the horizontal distance \\(d\\) from the point directly below Rhea to the banca?","opts":["\\(\\dfrac{6}{\\tan 25^\\circ}\\)","\\(6\\,\\tan 25^\\circ\\)","\\(\\dfrac{6}{\\sin 25^\\circ}\\)","\\(\\dfrac{6}{\\cos 25^\\circ}\\)"],"a":0,"why":["Correct. The 6 m height is opposite the \\(25^\\circ\\) angle at the banca and the distance \\(d\\) is adjacent, so \\(\\tan 25^\\circ = \\dfrac{6}{d}\\) rearranges to \\(d = \\dfrac{6}{\\tan 25^\\circ}\\).","This multiplies when it should divide. In \\(\\tan 25^\\circ = \\dfrac{6}{d}\\) the unknown \\(d\\) is in the denominator, so divide to get \\(d = \\dfrac{6}{\\tan 25^\\circ}\\).","This uses \\(\\sin\\), which pairs the 6 m with the slanted line of sight. The height and the flat distance are the two legs, so their relationship is a tangent.","This uses cosine, but the 6 m is opposite the \\(25^\\circ\\) angle and \\(d\\) is adjacent, so the ratio of opposite to adjacent is the tangent. Cosine compares the adjacent side with the slanted line of sight, so \\(d = \\dfrac{6}{\\tan 25^\\circ}\\)."],"sol":"The 6 m height is opposite the \\(25^\\circ\\) angle at the banca, where the elevation equals the depression, and the horizontal distance \\(d\\) is adjacent to it, so \\(\\tan 25^\\circ = \\dfrac{6}{d}\\). Since \\(d\\) is in the denominator, solve by dividing, which gives \\(d = \\dfrac{6}{\\tan 25^\\circ}\\). Multiplying by \\(\\tan 25^\\circ\\) instead makes \\(d\\) far too small, and using \\(\\sin 25^\\circ\\) would measure the slanted line of sight rather than the flat distance across the water."},{"id":"M-g9q4-U1-3","type":"claim","set":"M-g9q4-U1","two":false,"proc":"reason","band":"standard","comp":"M9GE-IVe-1","stim":"<p>At a rescue drill on the Sto. Nino footbridge, Rhea looks down at a banca (small boat) on the river. Her eyes are 6 m above the water. The angle of depression from her eyes to the banca is \\(25^\\circ\\). The sketch is not drawn to scale.</p>","fig":{"n":"fbcompare"},"stem":"In a later drill the river rises 1.5 m. Rhea's eyes are now 4.5 m above the water, and the banca stays at the same place. Paolo says the angle of depression is now bigger. Is Paolo correct?","opts":["Paolo is wrong. The banca has not moved, so the horizontal distance stays the same while the height falls from 6 m to 4.5 m, and a shorter opposite side with the same adjacent side makes \\(\\tan\\theta\\) smaller, so the angle of depression shrinks.","Paolo is wrong, because the height drops to three quarters of 6 m, so the angle drops to three quarters of \\(25^\\circ\\), to about \\(19^\\circ\\).","Paolo is right, because as the water rises the angle at Rhea's eye between the vertical post and her line of sight opens wider.","Paolo is right, because the angle of depression equals the angle of elevation at the banca, and her lower eyes are now nearer the water, so that angle grows."],"a":0,"why":["Correct. With the horizontal distance fixed, \\(\\tan\\theta = \\dfrac{\\text{height}}{\\text{distance}}\\) gets smaller as the height drops from 6 m to 4.5 m, so \\(\\theta\\) falls from \\(25^\\circ\\) to about \\(19^\\circ\\).","The verdict is right but the reasoning is not. The angle is not proportional to the height, so three quarters of the height does not give three quarters of the angle; using \\(\\tan\\theta = \\dfrac{4.5}{\\text{distance}}\\) gives about \\(19^\\circ\\), close here only by chance.","That angle, measured from the vertical post, does open wider, but the angle of depression is measured from the horizontal eye line, and it gets smaller.","The depression does equal the elevation at the banca, but with the horizontal distance unchanged a lower eye makes that shared angle smaller, not larger."],"sol":"The banca does not move, so the horizontal distance stays the same. The height of the eye above the water, which is the side opposite the angle, drops from 6 m to 4.5 m, so \\(\\tan\\theta\\) is smaller and the angle falls from \\(25^\\circ\\) to about \\(19^\\circ\\). Paolo is wrong: only the angle measured from the vertical post grows wider, while the angle of depression, measured from the horizontal, shrinks."},{"id":"M-g9q4-U2-1","type":"hotspot","set":"M-g9q4-U2","proc":"formulate","band":"entry","comp":"M9GE-IVa-1","stim":"<p>At Sta. Elena High School, four groups used a clinometer to find a building&rsquo;s height. Each group stood \\(20\\) m from the building with an eye height of \\(1.5\\) m and read the top at \\(31^\\circ\\), using \\(\\tan 31^\\circ \\approx 0.6009\\) and \\(\\sin 31^\\circ \\approx 0.5150\\). Their reported heights are shown below.</p><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Group</th><th>Reported height</th></tr></thead><tbody><tr><td>A</td><td>13.5 m</td></tr><tr><td>B</td><td>12.0 m</td></tr><tr><td>C</td><td>34.8 m</td></tr><tr><td>D</td><td>11.8 m</td></tr></tbody></table></div>","hs":{"n":"clinohs","a":{"ang":"31°"}},"stem":"The diagram shows the right triangle a group used. Tap the side opposite the \\(31^\\circ\\) angle at the clinometer.","labels":["Side 1","Side 2","Side 3","Side 4"],"a":1,"why":["This slanted line is the line of sight. It lies across from the right angle, so it is the hypotenuse, not the side opposite the \\(31^\\circ\\) angle.","Correct. The side across from the \\(31^\\circ\\) angle at the eye is the vertical part of the building above eye level.","This horizontal side forms the \\(31^\\circ\\) angle together with the line of sight, so it is adjacent to that angle, not opposite it.","The triangle begins at eye level, so its vertical side is only the part above \\(1.5\\) m, not the whole building down to the ground."],"sol":"Mark the \\(31^\\circ\\) angle at the eye first. The side opposite that angle is the one that does not touch it, which is the vertical part of the building above eye level. The horizontal \\(20\\) m leg forms the angle, so it is adjacent, and the slanted line of sight is the hypotenuse. The opposite side is the building's height above eye level."},{"id":"M-g9q4-U2-2","type":"mc","set":"M-g9q4-U2","two":false,"fixOrder":true,"proc":"interpret","band":"basic","comp":"M9GE-IVe-1","stim":"<p>At Sta. Elena High School, four groups used a clinometer to find a building&rsquo;s height. Each group stood \\(20\\) m from the building with an eye height of \\(1.5\\) m and read the top at \\(31^\\circ\\), using \\(\\tan 31^\\circ \\approx 0.6009\\) and \\(\\sin 31^\\circ \\approx 0.5150\\). Their reported heights are shown below.</p><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Group</th><th>Reported height</th></tr></thead><tbody><tr><td>A</td><td>13.5 m</td></tr><tr><td>B</td><td>12.0 m</td></tr><tr><td>C</td><td>34.8 m</td></tr><tr><td>D</td><td>11.8 m</td></tr></tbody></table></div>","stem":"Using \\(\\tan 31^\\circ \\approx 0.6009\\), which group forgot to add the \\(1.5\\) m eye height?","opts":["Group A","Group B","Group C","Group D"],"a":1,"why":["Group A reported \\(20 \\times 0.6009 + 1.5 \\approx 13.5\\) m, so it added the \\(1.5\\) m eye height and did not forget it.","Correct. Group B reported \\(20 \\times 0.6009 \\approx 12.0\\) m and stopped there, leaving out the \\(1.5\\) m eye height.","Group C reported \\(\\dfrac{20}{0.6009} + 1.5 \\approx 34.8\\) m, dividing \\(20\\) by \\(0.6009\\) instead of multiplying but still adding the \\(1.5\\) m eye height, so it did not forget the eye height.","Group D reported \\(20 \\times \\sin 31^\\circ + 1.5 \\approx 11.8\\) m, adding the \\(1.5\\) m eye height but treating the \\(20\\) m as the line of sight, so it did not forget the eye height."],"sol":"The correct height is \\(20 \\times \\tan 31^\\circ + 1.5 \\approx 20 \\times 0.6009 + 1.5 \\approx 13.5\\) m, which is Group A. Group B's \\(12.0\\) m is exactly \\(20 \\times 0.6009\\) with the \\(1.5\\) m eye height left off, so Group B forgot it. Group C's \\(34.8\\) m comes from dividing \\(20\\) by \\(0.6009\\) and Group D's \\(11.8\\) m from using \\(\\sin 31^\\circ\\), but both still added the \\(1.5\\) m eye height, so their errors lie elsewhere. Group B is the group that forgot the eye height."},{"id":"M-g9q4-U2-3","type":"grid","set":"M-g9q4-U2","proc":"reason","band":"standard","comp":"M9GE-IVe-1","stim":"<p>At Sta. Elena High School, four groups used a clinometer to find a building&rsquo;s height. Each group stood \\(20\\) m from the building with an eye height of \\(1.5\\) m and read the top at \\(31^\\circ\\), using \\(\\tan 31^\\circ \\approx 0.6009\\) and \\(\\sin 31^\\circ \\approx 0.5150\\). Their reported heights are shown below.</p><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Group</th><th>Reported height</th></tr></thead><tbody><tr><td>A</td><td>13.5 m</td></tr><tr><td>B</td><td>12.0 m</td></tr><tr><td>C</td><td>34.8 m</td></tr><tr><td>D</td><td>11.8 m</td></tr></tbody></table></div>","stem":"Decide whether to accept or reject each statement about how the groups got their numbers.","cols":["Accept","Reject"],"rows":[{"t":"Group C&rsquo;s \\(34.8\\) m came from dividing \\(20\\) by \\(\\tan 31^\\circ\\) instead of multiplying, then adding \\(1.5\\) m.","a":0,"why":"Checking, \\(\\dfrac{20}{0.6009} + 1.5 \\approx 34.8\\) m, which matches Group C, so accept it; the distance should be multiplied by \\(\\tan 31^\\circ\\), not divided."},{"t":"Group D&rsquo;s \\(11.8\\) m came from multiplying \\(20\\) by \\(\\sin 31^\\circ\\), then adding \\(1.5\\) m.","a":0,"why":"Checking, \\(20 \\times 0.5150 + 1.5 \\approx 11.8\\) m, which matches Group D; using the sine wrongly treats the \\(20\\) m ground run as the line of sight, when it is a leg and the tangent is needed."},{"t":"Group A should have subtracted the \\(1.5\\) m eye height to get the true building height.","a":1,"why":"The eye height is added, not subtracted, because the triangle sits \\(1.5\\) m above the ground, and Group A&rsquo;s \\(13.5\\) m already adds it correctly."},{"t":"A group standing \\(40\\) m away would still read the same \\(31^\\circ\\) angle to the top.","a":1,"why":"Standing farther back makes the top look lower, so the angle of elevation would be smaller than \\(31^\\circ\\), not the same."}],"sol":"The correct height is \\(20 \\times \\tan 31^\\circ + 1.5 \\approx 13.5\\) m, which is Group A. Group C&rsquo;s \\(34.8\\) m matches \\(\\dfrac{20}{0.6009} + 1.5\\), a divide-for-multiply slip, and Group D&rsquo;s \\(11.8\\) m matches \\(20 \\times 0.5150 + 1.5\\), a sine-for-tangent slip, so both statements are accepted. The eye height is added and Group A already added it, so subtracting it is rejected. Standing \\(40\\) m back would lower the line of sight and shrink the angle below \\(31^\\circ\\), so that statement is rejected too."},{"id":"M-g9q4-07","type":"mc","two":false,"proc":"interpret","band":"entry","comp":"M9GE-IVb-c-1","stim":"<p>Nards fixes a stall awning at the palengke (public market). A metal brace forms a right triangle with a vertical drop and a horizontal reach. The brace makes a \\(45^\\circ\\) angle with the horizontal reach, and \\(\\tan 45^\\circ = 1\\).</p>","fig":{"n":"rtri","a":{"ang":"45°","aria":"Right triangle: slanted brace hypotenuse, vertical drop and horizontal reach legs, 45 degree angle at the horizontal reach. Not drawn to scale."}},"stem":"Which statement must be true about the brace?","opts":["The vertical drop equals the horizontal reach.","The brace equals the vertical drop plus the horizontal reach.","The horizontal reach is longer than the vertical drop.","The brace is twice its horizontal reach."],"a":0,"why":["Because \\(\\tan 45^\\circ = \\dfrac{\\text{drop}}{\\text{reach}} = 1\\), the vertical drop and the horizontal reach are equal.","The brace is the hypotenuse, so \\(\\text{brace} = \\sqrt{\\text{drop}^2 + \\text{reach}^2}\\), which is shorter than adding the two legs.","At \\(45^\\circ\\) the opposite leg (the drop) and the adjacent leg (the reach) are equal, so neither is longer; calling the reach longer swaps how the two legs sit against the angle.","The brace is \\(\\sqrt{2}\\) times a leg, not twice it; halving the hypotenuse belongs to a \\(60^\\circ\\) angle, not \\(45^\\circ\\)."],"sol":"The \\(45^\\circ\\) angle sits between the brace and the horizontal reach, so \\(\\tan 45^\\circ\\) is the vertical drop divided by the horizontal reach. Since \\(\\tan 45^\\circ = 1\\), the drop and the reach must be the same length. It is tempting to say the brace is twice a leg, but a \\(45^\\circ\\) right triangle makes the brace \\(\\sqrt{2}\\) times a leg, not twice it. So the vertical drop equals the horizontal reach."},{"id":"M-g9q4-08","type":"num","proc":"employ","band":"basic","comp":"M9GE-IVb-c-1","stim":"<p>Liza climbs a straight playground slide that is \\(4\\) m long. The slide makes a \\(30^\\circ\\) angle with the ground.</p>","fig":{"n":"rtri","a":{"hyp":"4 m","ang":"30°","aria":"Right triangle: 4 m slide hypotenuse at 30 degrees to the ground. Not drawn to scale."}},"stem":"Using \\(\\cos 30^\\circ \\approx 0.866\\) and \\(\\sin 30^\\circ = \\dfrac{1}{2}\\), how far does the slide reach along the ground, to the nearest \\(0.1\\) m?","ans":3.5,"lo":3.4,"hi":3.5,"unit":"m","errs":[{"v":2,"msg":"\\(2\\) m is \\(4 \\times \\sin 30^\\circ\\). That length is the slide's height above the ground. The ground reach is next to the \\(30^\\circ\\) angle, so use the cosine."},{"v":4.6,"msg":"\\(4.6\\) m divides \\(4\\) by \\(0.866\\). The \\(4\\) m slide is the hypotenuse, so multiply by \\(\\cos 30^\\circ\\) instead of dividing."}],"generic":"Not yet. The ground reach is next to the \\(30^\\circ\\) angle, so multiply the \\(4\\) m slide by \\(\\cos 30^\\circ\\).","sol":"The \\(4\\) m slide is the hypotenuse, and the ground reach lies next to the \\(30^\\circ\\) angle, so it is the adjacent side. The adjacent side is the hypotenuse times the cosine, giving \\(4 \\times 0.866 \\approx 3.5\\) m. Using \\(\\sin 30^\\circ\\) instead gives \\(2\\) m, which is the slide's height, not its ground reach. The slide reaches about \\(3.5\\) m along the ground."},{"id":"M-g9q4-09","type":"match","proc":"formulate","band":"basic","comp":"M9GE-IVf-g-1","stim":"<p>A barangay fiesta committee rigs a tent. (Barangay: a village or district.) Three triangle measurements come up. For each, pick the first tool to use.</p>","stem":"Choose the first tool to use for each task.","choices":["Law of Sines","Law of Cosines","a right-triangle ratio (SOH-CAH-TOA)","the Pythagorean theorem only"],"parts":[{"label":"Two ropes of 4 m and 5 m meet at a 70° angle; find the distance between the two ground stakes.","a":1,"why":"Two sides with the angle between them (SAS) and no right angle: the Law of Cosines gives the third side. The Pythagorean theorem would work only if the angle were \\(90^\\circ\\)."},{"label":"Two angles and one side that is not between them are known; find another side.","a":0,"why":"A side with its opposite angle plus a second angle (AAS) fits the Law of Sines, which pairs each side with the sine of the angle across from it."},{"label":"A 3 m vertical pole has a guy rope reaching the ground at 50°; find the rope length.","a":2,"why":"The pole meets the ground at a right angle, so this is a right triangle and one ratio such as \\(\\sin 50^\\circ\\) finds the rope; no law of triangles is needed yet."}],"sol":"Task one gives two sides and the included angle (SAS) in a triangle with no right angle, so the Law of Cosines finds the missing distance; reaching for the Pythagorean theorem there would ignore that it needs a right angle. Task two gives two angles and a non-included side (AAS), the setup the Law of Sines is built for. Task three has a vertical pole meeting the ground at a right angle, so a single right-triangle ratio does the job."},{"id":"M-g9q4-10","type":"claim","two":false,"proc":"reason","band":"stretch","comp":"M9GE-IVa-1","stim":"<p>Ben's science class laid a \\(1\\) m board on a tilt and measured the rise of its far end at four angles.</p><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Angle</th><th>Rise (m)</th></tr></thead><tbody><tr><td>\\(20^\\circ\\)</td><td>0.34</td></tr><tr><td>\\(40^\\circ\\)</td><td>0.64</td></tr><tr><td>\\(60^\\circ\\)</td><td>0.87</td></tr><tr><td>\\(80^\\circ\\)</td><td>0.98</td></tr></tbody></table></div><p>Carla says: doubling the angle doubles the rise, as \\(20^\\circ\\) to \\(40^\\circ\\) shows (\\(0.34\\) to \\(0.64\\), nearly double).</p>","stem":"Is Carla's claim correct, and why?","opts":["Carla is right. Doubling the angle doubles the rise, so \\(80^\\circ\\) must give about \\(1.28\\) m.","Carla is wrong. From \\(40^\\circ\\) to \\(80^\\circ\\) the rise climbs only from \\(0.64\\) to \\(0.98\\) m, not to \\(1.28\\) m, and it can never pass the \\(1\\) m board.","Carla is right, because a steeper board does rise higher as the angle grows.","Carla is wrong, because the rise just increases by a fixed \\(0.3\\) m for every \\(20^\\circ\\) step."],"a":1,"why":["The rise is a sine, which does not grow in proportion to the angle, and \\(1.28\\) m is impossible on a \\(1\\) m board since a sine is at most \\(1\\).","Correct: the jump from \\(40^\\circ\\) to \\(80^\\circ\\) falls far short of double, and the rise, being a sine, can never exceed the \\(1\\) m board length.","A steeper board does rise higher, but that does not mean the rise doubles when the angle doubles.","The verdict is right, yet the steps are not equal: \\(0.34\\) to \\(0.64\\) to \\(0.87\\) to \\(0.98\\) add \\(0.30\\), then \\(0.23\\), then \\(0.11\\)."],"sol":"The rises are the sines of the angles, and a sine does not grow in proportion to the angle. Doubling \\(40^\\circ\\) to \\(80^\\circ\\) lifts the rise only from \\(0.64\\) to \\(0.98\\) m, not to about \\(1.28\\) m, so the \"doubling\" pattern already fails. A sine is also at most \\(1\\), so the rise can never exceed the \\(1\\) m board, which rules out \\(1.28\\) m outright. Carla's claim is wrong."},{"id":"M-g9q4-11","type":"num","proc":"employ","band":"standard","comp":"M9GE-IVe-1","stim":"<p>Marikina River Park is a long riverside park where learners fly kites during a school activity. Dina lets out a straight \\(50\\) m string at a \\(52^\\circ\\) angle of elevation. She holds the reel \\(1\\) m above the ground.</p>","fig":{"n":"rtri","a":{"hyp":"50 m","ang":"52°","stub":"1 m","aria":"Right triangle: 50 m string hypotenuse at 52 degrees of elevation, reel held 1 m above the ground. Not drawn to scale."}},"stem":"Using \\(\\sin 52^\\circ \\approx 0.7880\\) and \\(\\cos 52^\\circ \\approx 0.6157\\), how high is the kite above the ground, to the nearest \\(0.1\\) m?","ans":40.4,"lo":40.3,"hi":40.5,"unit":"m","errs":[{"v":39.4,"msg":"\\(39.4\\) m is \\(50 \\times \\sin 52^\\circ\\) alone. The string is held \\(1\\) m up, so add that hand height to reach the kite's height above the ground."},{"v":31.8,"msg":"\\(31.8\\) m uses \\(\\cos 52^\\circ\\), which gives the horizontal distance. The height is opposite the \\(52^\\circ\\) angle, so use the sine."}],"generic":"Not yet. Find the vertical leg with \\(50 \\times \\sin 52^\\circ\\), then add the \\(1\\) m hand height.","sol":"The string is the hypotenuse, and the kite's height above Dina's hand is the side opposite the \\(52^\\circ\\) angle, so it is \\(50 \\times \\sin 52^\\circ \\approx 39.4\\) m. The reel sits \\(1\\) m above the ground, so add that to lift the triangle off the ground, giving \\(39.4 + 1 = 40.4\\) m. Using \\(\\cos 52^\\circ\\) would give the horizontal distance, not the height. The kite is about \\(40.4\\) m above the ground."},{"id":"M-g9q4-12","type":"num","proc":"employ","band":"stretch","comp":"M9GE-IVh-j-1","stim":"<p>Along the Marikina River in Tumana, two gauge markers \\(A\\) and \\(B\\) sit \\(30\\) m apart on the same bank. A lone tree \\(C\\) stands on the opposite bank. In triangle \\(ABC\\), the angle at \\(A\\) is \\(65^\\circ\\) and the angle at \\(B\\) is \\(75^\\circ\\).</p>","fig":{"n":"obtri","a":{"mode":"map","base":"30 m","angA":"65°","angB":"75°","ac":"?"}},"stem":"Using the Law of Sines with \\(\\sin 75^\\circ \\approx 0.9659\\), \\(\\sin 65^\\circ \\approx 0.9063\\), and \\(\\sin 40^\\circ \\approx 0.6428\\), find \\(AC\\) to the nearest \\(0.1\\) m.","ans":45.1,"lo":45,"hi":45.2,"unit":"m","errs":[{"v":20,"msg":"\\(20.0\\) m flips the ratio. \\(AC\\) is opposite the \\(75^\\circ\\) angle, so it must be longer than \\(AB\\); use \\(AC = 30 \\times \\dfrac{\\sin 75^\\circ}{\\sin 40^\\circ}\\)."},{"v":42.3,"msg":"\\(42.3\\) m pairs \\(AC\\) with the \\(65^\\circ\\) angle. \\(AC\\) sits across from \\(B = 75^\\circ\\), so pair it with \\(\\sin 75^\\circ\\), not \\(\\sin 65^\\circ\\)."}],"generic":"Not yet. First find the angle at \\(C = 40^\\circ\\); then \\(AC\\) is opposite \\(B\\), so \\(AC = 30 \\times \\dfrac{\\sin 75^\\circ}{\\sin 40^\\circ}\\).","sol":"The three angles sum to \\(180^\\circ\\), so the angle at \\(C\\) is \\(180^\\circ - 65^\\circ - 75^\\circ = 40^\\circ\\). Side \\(AC\\) lies opposite the \\(75^\\circ\\) angle at \\(B\\), and the known side \\(AB = 30\\) m lies opposite the \\(40^\\circ\\) angle at \\(C\\), so \\(\\dfrac{AC}{\\sin 75^\\circ} = \\dfrac{30}{\\sin 40^\\circ}\\). This gives \\(AC = \\dfrac{30 \\times 0.9659}{0.6428} \\approx 45.1\\) m; pairing \\(AC\\) with the \\(65^\\circ\\) angle instead would wrongly give about \\(42.3\\) m. So \\(AC\\) is about \\(45.1\\) m."}],
    g10t1:[
      {id:'M-g10t1-01',two:false,stem:'Knowing all three sides (SSS) of a surveying triangle, to find an angle you use:',opts:['The Law of Sines','The Law of Cosines','The Pythagorean theorem','SOH-CAH-TOA'],a:1,sol:'SSS calls for the Law of Cosines.',proc:'employ',band:'basic',comp:'G10T1-02'},
      {id:'M-g10t1-02',two:false,stem:'The Law of Cosines for side \\(a\\) is:',opts:['\\(a^2 = b^2 + c^2\\)','\\(a^2 = b^2 + c^2 + 2bc\\cos A\\)','\\(a = b + c - 2bc\\cos A\\)','\\(a^2 = b^2 + c^2 - 2bc\\cos A\\)'],a:3,sol:'Standard form.',proc:'employ',band:'entry',comp:'G10T1-02'},
      {id:'M-g10t1-03',two:false,stem:'With two sides and the included angle (SAS), you use:',opts:['The Law of Cosines','The Law of Sines','The Pythagorean theorem','None of these'],a:0,sol:'SAS calls for the Law of Cosines.',proc:'employ',band:'entry',comp:'G10T1-02'},
      {id:'M-g10t1-04',two:true,stem:'In \\(\\dfrac{a}{\\sin A} = \\dfrac{b}{\\sin B}\\), with \\(a = 8\\), \\(\\sin A = 0.5\\), \\(\\sin B = 0.25\\), find \\(b\\).',opts:['\\(16\\)','\\(2\\)','\\(4\\)','\\(8\\)'],a:2,sol:'\\(\\dfrac{8(0.25)}{0.5} = 4\\).',proc:'employ',band:'basic',comp:'G10T1-01'},
      {id:'M-g10t1-05',two:false,stem:'A bearing of N30&deg;E is measured as:',opts:['\\(30^\\circ\\) north from east','\\(30^\\circ\\) from due south','\\(30^\\circ\\) east from north','the same as due northeast'],a:2,sol:'East of the north line.',proc:'employ',band:'entry',comp:'G10T1-05'},
      {id:'M-g10t1-06',two:false,stem:'In \\(c^2 = a^2 + b^2 - 2ab\\cos C\\), if \\(C = 90^\\circ\\) it becomes:',opts:['\\(c^2 = a^2 + b^2\\)','\\(c^2 = a^2 - b^2\\)','\\(c = a + b\\)','\\(c^2 = 2ab\\)'],a:0,sol:'\\(\\cos 90^\\circ = 0\\).',proc:'reason',band:'basic',comp:'G10T1-02'},
      {id:'M-g10t1-07',two:true,stem:'A triangle has \\(a = 9\\), \\(b = 12\\), and included angle \\(C = 90^\\circ\\). Find \\(c\\).',opts:['\\(21\\)','\\(\\sqrt{63}\\)','\\(225\\)','\\(15\\)'],a:3,sol:'\\(\\sqrt{81 + 144} = 15\\).',proc:'employ',band:'basic',comp:'G10T1-02'},
      {id:'M-g10t1-08',two:true,stim:'A planner at Marikina River Park lists the angles of four sample triangular flower beds. Bed A: \\(42^\\circ, 48^\\circ, 90^\\circ\\). Bed B: \\(28^\\circ, 47^\\circ, 105^\\circ\\). Bed C: \\(60^\\circ, 60^\\circ, 60^\\circ\\). Bed D: \\(39^\\circ, 66^\\circ, 75^\\circ\\).',stem:'How many of the four flower beds are oblique triangles?',opts:['\\(1\\)','\\(3\\)','\\(2\\)','\\(4\\)'],a:1,sol:'An oblique triangle is any triangle with no right angle, so it may be acute or obtuse. Bed A has a \\(90^\\circ\\) angle, so it is a right triangle, while Beds B, C and D have no right angle. Answering \\(1\\) treats oblique as meaning obtuse only, and answering \\(2\\) wrongly leaves out the equilateral Bed C. So \\(3\\) of the flower beds are oblique.',proc:'employ',band:'basic',comp:'G10T1-01'},
      {id:'M-g10t1-09',two:true,stim:'On a sample grid map of Marikina River Park, the river runs along the x-axis. A food kiosk stands at \\((8, 1)\\). A twin kiosk will be built directly across the river, at the same distance from it.',stem:'Where should the twin kiosk be placed?',opts:['\\((8, -1)\\)','\\((-8, 1)\\)','\\((-8, -1)\\)','\\((1, 8)\\)'],a:0,sol:'Directly across the river at the same distance is a reflection over the x-axis, which keeps \\(x\\) and changes the sign of \\(y\\): \\((8, 1) \\to (8, -1)\\). The choice \\((-8, 1)\\) reflects over the y-axis instead, which keeps the kiosk on the same side of the river. The twin kiosk is at \\((8, -1)\\).',proc:'formulate',band:'basic',comp:'G10T1-04'},
      {id:'M-g10t1-10',two:true,stim:'A Marikina shoemaker draws a sample sandal pattern on a grid. The left half must be a mirror image of the right half across the y-axis. A buckle hole on the right half is at \\((6, -9)\\).',stem:'Where is the matching buckle hole on the left half?',opts:['\\((6, 9)\\)','\\((9, 6)\\)','\\((-6, -9)\\)','\\((-6, 9)\\)'],a:2,sol:'A mirror image across the y-axis keeps \\(y\\) and changes the sign of \\(x\\): \\((6, -9) \\to (-6, -9)\\). The choice \\((6, 9)\\) mirrors across the x-axis, which flips the pattern upside down instead of left to right. The matching buckle hole is at \\((-6, -9)\\).',proc:'formulate',band:'basic',comp:'G10T1-04'},
      {id:'M-g10t1-11',two:true,stim:'A rotating sign at Riverbanks Center turns about its center, which is the origin of a sample grid. A light bulb on the sign is at \\((-4, 10)\\). The sign makes a half turn.',stem:'Where is the bulb after the half turn?',opts:['\\((-4, -10)\\)','\\((4, -10)\\)','\\((4, 10)\\)','\\((-10, -4)\\)'],a:1,sol:'A half turn about the origin is a \\(180^\\circ\\) rotation, so \\((x, y) \\to (-x, -y)\\) and \\((-4, 10) \\to (4, -10)\\). Changing only one sign, as in \\((-4, -10)\\), is a reflection, not a turn, and \\((-10, -4)\\) is only a quarter turn. After the half turn the bulb is at \\((4, -10)\\).',proc:'formulate',band:'basic',comp:'G10T1-04'},
      {id:'M-g10t1-12',two:true,stem:'Translating \\((4, -1)\\) by \\((x - 3,\\ y + 6)\\) gives:',opts:['\\((7, -7)\\)','\\((1, -7)\\)','\\((7, 5)\\)','\\((1, 5)\\)'],a:3,sol:'\\((1, 5)\\).',proc:'employ',band:'entry',comp:'G10T1-04'},
      {id:'M-g10t1-13',two:false,stem:'Which rule moves a point 2 units left and 5 units up?',opts:['\\((x + 2,\\ y - 5)\\)','\\((x - 5,\\ y + 2)\\)','\\((x - 2,\\ y - 5)\\)','\\((x - 2,\\ y + 5)\\)'],a:3,sol:'Left subtracts from \\(x\\); up adds to \\(y\\).',proc:'employ',band:'basic',comp:'G10T1-04'},
      {id:'M-g10t1-14',two:false,stem:'A \\(90^\\circ\\) counterclockwise rotation about the origin maps \\((x, y)\\) to:',opts:['\\((y, -x)\\)','\\((-y, x)\\)','\\((-x, -y)\\)','\\((x, -y)\\)'],a:1,sol:'\\((-y, x)\\).',proc:'employ',band:'entry',comp:'G10T1-04'},
      {id:'M-g10t1-15',two:false,stem:'Which transformation keeps a figure&rsquo;s size and shape?',opts:['A dilation','A vertical stretch','A translation','A shear'],a:2,sol:'A rigid motion.',proc:'employ',band:'entry',comp:'G10T1-04'},
      {id:'M-g10t1-16',two:true,stem:'Translating \\((0, 0)\\) by \\((x + 7,\\ y - 4)\\) gives:',opts:['\\((7, -4)\\)','\\((-7, 4)\\)','\\((4, -7)\\)','\\((0, 0)\\)'],a:0,sol:'\\((7, -4)\\).',proc:'employ',band:'entry',comp:'G10T1-04'},
      {id:'M-g10t1-17',two:false,stem:'Solve \\(x^2 < 4\\).',opts:['\\(x < 2\\)','\\(-2 < x < 2\\)','\\(x > 2\\)','\\(x < -2\\) or \\(x > 2\\)'],a:1,sol:'Between the roots.',proc:'employ',band:'basic',comp:'G10T1-07'},
      {id:'M-g10t1-18',two:false,stim:'In a Sta. Elena High School quiz bee, Paolo solves \\(x^2 > 64\\). He writes \\(x > 8\\) as his final answer.',stem:'Which evaluation of Paolo&rsquo;s answer is correct?',opts:['He is right, because taking the square root of both sides gives \\(x > 8\\)','He is right, because \\(x = 9\\) works: \\(81 > 64\\)','His answer is incomplete; the full answer is \\(-8 < x < 8\\)','His answer is incomplete, because \\(x < -8\\) also works, for example \\((-10)^2 = 100 > 64\\)'],a:3,sol:'Any \\(x\\) farther than 8 from zero, on either side, makes \\(x^2 > 64\\); for example \\((-10)^2 = 100 > 64\\). So the full solution is \\(x < -8\\) or \\(x > 8\\), and Paolo missed the negative branch. The interval \\(-8 < x < 8\\) is wrong, since \\(x = 0\\) gives \\(0 > 64\\), which is false. Paolo&rsquo;s answer is incomplete because \\(x < -8\\) also satisfies the inequality.',proc:'reason',band:'standard',comp:'G10T1-07'},
      {id:'M-g10t1-19',two:false,stem:'Solve \\((x + 1)(x - 4) < 0\\).',opts:['\\(-1 < x < 4\\)','\\(x < -1\\) or \\(x > 4\\)','\\(x < 4\\)','\\(x > -1\\)'],a:0,sol:'Negative between the roots.',proc:'employ',band:'basic',comp:'G10T1-07'},
      {id:'M-g10t1-20',two:true,stem:'The critical values of \\(x^2 - 2x - 8 \\le 0\\) are:',opts:['\\(x = 2, -4\\)','\\(x = 8, 1\\)','\\(x = 4, -2\\)','\\(x = -8\\)'],a:2,sol:'\\((x - 4)(x + 2)\\).',proc:'employ',band:'basic',comp:'G10T1-07'},
      {id:'M-g10t1-21',two:true,stim:'At Sta. Elena High School, Ana shows her answer on a number line. She shades every number at or left of \\(-7\\). She also shades every number at or right of \\(7\\). The dots at \\(-7\\) and \\(7\\) are filled.',stem:'Which inequality did Ana solve?',opts:['\\(x^2 - 49 \\le 0\\)','\\(x^2 - 49 > 0\\)','\\(x^2 - 49 \\ge 0\\)','\\(x^2 - 7 \\ge 0\\)'],a:2,sol:'Filled dots mean \\(-7\\) and \\(7\\) are included, so the sign must be \\(\\ge\\) or \\(\\le\\). The expression \\(x^2 - 49 = (x + 7)(x - 7)\\) is zero at \\(\\pm 7\\) and positive outside them, so \\(x^2 - 49 \\ge 0\\) gives the two rays. The choice \\(x^2 - 49 \\le 0\\) would shade only the segment between \\(-7\\) and \\(7\\). Ana solved \\(x^2 - 49 \\ge 0\\).',proc:'interpret',band:'standard',comp:'G10T1-06'},
      {id:'M-g10t1-22',two:true,stem:'Which point satisfies \\(y > x^2\\)?',opts:['\\((0, 1)\\)','\\((1, 0)\\)','\\((0, -1)\\)','\\((2, 1)\\)'],a:0,sol:'\\(1 > 0^2\\) is true.',proc:'employ',band:'basic',comp:'G10T1-09'},
      {id:'M-g10t1-23',two:false,stem:'On a number line, the solution of \\(x^2 > 9\\) is:',opts:['the segment between \\(-3\\) and \\(3\\)','only \\(x > 3\\)','the whole line','the two rays outside \\(-3\\) and \\(3\\)'],a:3,sol:'\\(x < -3\\) or \\(x > 3\\).',proc:'employ',band:'basic',comp:'G10T1-06'},
      {id:'M-g10t1-24',two:false,stim:'The Gardening Club of Sta. Elena High School plans a rectangular vegetable plot. Its length is \\(5\\ \\text{m}\\) more than its width \\(w\\). The club needs a planting area greater than \\(14\\) square meters.',stem:'Which widths \\(w\\), in meters, meet the club&rsquo;s need?',opts:['\\(w < -7\\) or \\(w > 2\\)','\\(w > 2\\)','\\(-7 < w < 2\\)','\\(w > 7\\)'],a:1,sol:'The area is \\(w(w + 5) > 14\\), so \\(w^2 + 5w - 14 > 0\\), which factors as \\((w + 7)(w - 2) > 0\\). This holds for \\(w < -7\\) or \\(w > 2\\), and choosing \\(-7 < w < 2\\) would pick the region where the product is negative. Keeping \\(w < -7\\) ignores that a width must be positive, so only \\(w > 2\\) is kept. The plot must be wider than \\(2\\ \\text{m}\\).',proc:'formulate',band:'standard',comp:'G10T1-08'},
      {id:'M-g10t1-25',two:false,stem:'Solve \\(|x| > 3\\).',opts:['\\(x < -3\\) or \\(x > 3\\)','\\(-3 < x < 3\\)','\\(x > 3\\)','\\(x > -3\\)'],a:0,sol:'Outside the band.',proc:'employ',band:'basic',comp:'G10T1-12'},
      {id:'M-g10t1-26',two:true,stim:'Lito bikes on a straight bike lane along the Marikina River. The lane has km markers. He stops at the 6 km marker. Dina says a water station is exactly 1.5 km from him, but not in which direction.',stem:'Which equation gives the possible marker \\(x\\) of the water station?',opts:['\\(|x - 1.5| = 6\\)','\\(x - 6 = 1.5\\)','\\(|x - 6| = 1.5\\)','\\(|x + 6| = 1.5\\)'],a:2,sol:'The distance between marker \\(x\\) and marker \\(6\\) is \\(|x - 6|\\), and that distance is \\(1.5\\ \\text{km}\\), so \\(|x - 6| = 1.5\\). It gives \\(x = 7.5\\) or \\(x = 4.5\\), one station in each direction. Writing \\(x - 6 = 1.5\\) keeps only the station ahead of Lito and misses the one behind him. The model is \\(|x - 6| = 1.5\\).',proc:'formulate',band:'basic',comp:'G10T1-11'},
      {id:'M-g10t1-27',two:false,stem:'Solve \\(|x + 1| \\le 4\\).',opts:['\\(-3 \\le x \\le 5\\)','\\(-5 \\le x \\le 3\\)','\\(x \\le 3\\)','\\(x \\le -5\\) or \\(x \\ge 3\\)'],a:1,sol:'\\(-4 \\le x + 1 \\le 4\\).',proc:'employ',band:'basic',comp:'G10T1-12'},
      {id:'M-g10t1-28',two:false,stim:'At a Marikina shoe factory, the sample target insole length is \\(24\\ \\text{cm}\\). In his notes, Rico writes the equation \\(|L - 24| = -0.4\\), where \\(L\\) is an insole length in cm.',stem:'Which statement about Rico&rsquo;s equation is correct?',opts:['\\(L = 23.6\\) or \\(L = 24.4\\)','\\(L = 23.6\\) only','\\(L = 24\\), the target length','There is no solution, because \\(|L - 24|\\) is a distance and is never negative'],a:3,sol:'An absolute value is a distance, so \\(|L - 24|\\) can never be negative and cannot equal \\(-0.4\\). The equation has no solution, which means Rico&rsquo;s note contains an error. Answering \\(L = 23.6\\) or \\(L = 24.4\\) solves \\(|L - 24| = 0.4\\) instead and ignores the negative sign. No insole length fits Rico&rsquo;s equation.',proc:'reason',band:'standard',comp:'G10T1-11'},
      {id:'M-g10t1-29',two:false,stim:'During a review session at Sta. Elena High School, Kevin solves \\(|5x| = 45\\). He writes only \\(x = 9\\).',stem:'Which evaluation of Kevin&rsquo;s answer is correct?',opts:['He is right, because an absolute value equation has only one answer, the positive one','His answer is incomplete, because \\(x = -45\\) also works','He is right, because \\(5(9) = 45\\) checks','His answer is incomplete, because \\(x = -9\\) also works: \\(|5(-9)| = 45\\)'],a:3,sol:'\\(|5x| = 45\\) means \\(5x = 45\\) or \\(5x = -45\\), so \\(x = 9\\) or \\(x = -9\\). Kevin&rsquo;s check of \\(x = 9\\) is true, but it does not show that no other answer exists. The choice \\(x = -45\\) fails because \\(|5(-45)| = 225\\). His answer is incomplete, since \\(x = -9\\) also works.',proc:'reason',band:'standard',comp:'G10T1-11'},
      {id:'M-g10t1-30',two:false,stem:'\\(|x - 6| < 1\\) means:',opts:['\\(x < 5\\) or \\(x > 7\\)','\\(5 < x < 7\\)','\\(x < 7\\)','\\(x > 5\\)'],a:1,sol:'Within 1 unit of 6.',proc:'employ',band:'basic',comp:'G10T1-12'},
      {id:'M-g10t1-31',two:true,stim:'A Marikina bakery packs 3 pandesal in a sample pack that should weigh \\(96\\ \\text{g}\\). Each pandesal has mass \\(m\\) grams. The pack is off target by \\(|3m - 96|\\) grams.',stem:'For which mass \\(m\\) is the pack exactly on target, so that \\(|3m - 96| = 0\\)?',opts:['\\(m = \\pm 32\\)','\\(m = 96\\)','\\(m = 32\\)','\\(m = 288\\)'],a:2,sol:'An absolute value is zero only when the expression inside is zero, so \\(3m - 96 = 0\\) and \\(m = 32\\). There is only one answer, because \\(m = -32\\) gives \\(|-192| = 192\\), not 0. The choice \\(m = 96\\) forgets to divide by 3. Each pandesal should have a mass of \\(32\\ \\text{g}\\).',proc:'employ',band:'basic',comp:'G10T1-11'},
      {id:'M-g10t1-32',two:false,stim:'A water refilling station in Concepcion, Marikina, checks each 20-liter jug with a sample rule. A jug passes if its volume \\(V\\), in liters, satisfies \\(|V - 20| \\le 0.3\\).',stem:'Which volumes pass the check?',opts:['\\(19.7 \\le V \\le 20.3\\)','\\(V \\le 20.3\\)','\\(V \\le 19.7\\) or \\(V \\ge 20.3\\)','\\(-0.3 \\le V \\le 0.3\\)'],a:0,sol:'\\(|V - 20| \\le 0.3\\) means \\(V\\) is within \\(0.3\\ \\text{L}\\) of \\(20\\ \\text{L}\\), so \\(-0.3 \\le V - 20 \\le 0.3\\). Adding 20 to all parts gives \\(19.7 \\le V \\le 20.3\\). The choice \\(V \\le 20.3\\) forgets that an underfilled jug, such as one with \\(19\\ \\text{L}\\), also fails. A jug passes when it holds from 19.7 to 20.3 liters.',proc:'interpret',band:'standard',comp:'G10T1-12'},
      {id:'M-g10t1-33',two:true,stem:'The median of \\(3, 5, 7, 9, 11\\) is:',opts:['\\(5\\)','\\(7\\)','\\(9\\)','\\(35\\)'],a:1,sol:'The middle value.',proc:'employ',band:'entry',comp:'G10T1-15'},
      {id:'M-g10t1-34',two:true,stem:'If \\(Q_1 = 15\\) and \\(Q_3 = 27\\), the interquartile range is:',opts:['\\(42\\)','\\(21\\)','\\(6\\)','\\(12\\)'],a:3,sol:'\\(27 - 15 = 12\\).',proc:'employ',band:'entry',comp:'G10T1-15'},
      {id:'M-g10t1-35',two:false,stem:'The second quartile \\(Q_2\\) is the same as the:',opts:['median','mean','mode','range'],a:0,sol:'The median.',proc:'employ',band:'entry',comp:'G10T1-13'},
      {id:'M-g10t1-36',two:true,stem:'Percentiles divide ordered data into how many equal parts?',opts:['\\(4\\)','\\(10\\)','\\(100\\)','\\(2\\)'],a:2,sol:'100 parts.',proc:'employ',band:'entry',comp:'G10T1-13'},
      {id:'M-g10t1-37',two:false,stim:'On a Marikina class test, a score is at the 90th percentile.',stem:'This means the score is higher than about:',opts:['90 items','the top 10 students exactly','90% of the other scores','90% of the maximum score'],a:2,sol:'Percent of scores below it.',proc:'interpret',band:'basic',comp:'G10T1-17'},
      {id:'M-g10t1-38',two:false,stim:'A Marikina TODA records the number of trips made by 11 tricycle drivers in one day (sample data): \\(12, 14, 15, 15, 16, 17, 18, 18, 19, 20, 41\\).',stem:'Given \\(Q_1 = 15\\) and \\(Q_3 = 19\\), which values are outliers by the \\(1.5 \\times \\text{IQR}\\) rule?',opts:['\\(41\\) only','\\(20\\) and \\(41\\)','\\(12\\) and \\(41\\)','No value is an outlier'],a:0,sol:'The \\(\\text{IQR} = 19 - 15 = 4\\), so \\(1.5 \\times 4 = 6\\), and the fences are \\(15 - 6 = 9\\) and \\(19 + 6 = 25\\). Only \\(41\\) lies outside the fences; \\(12\\) is above \\(9\\), and \\(20\\) is above \\(Q_3\\) but still below \\(25\\). Choosing no outlier comes from using \\(1.5 \\times Q_3\\) instead of \\(1.5 \\times \\text{IQR}\\). The driver with 41 trips is the only outlier.',proc:'employ',band:'standard',comp:'G10T1-15'},

        {id:'P-g9q1-1-1',two:true,stim:'A Marikina shoe stall sells square tarpaulin signs. A sign has area \\(64\\ \\text{ft}^2\\), so its side \\(s\\) satisfies \\(s^2 = 64\\).',stem:'What is the side length?',opts:['\\(8\\) ft','\\(\\pm 8\\) ft','\\(32\\) ft','\\(16\\) ft'],a:0,sol:'\\(s = \\pm 8\\), but a side length is positive, so \\(8\\) ft.',proc:'employ',band:'entry',comp:'M9AL-Ia-b-1'},
        {id:'P-g9q1-1-2',two:false,stem:'A palengke vendor wants a quadratic equation to model a curved price-to-sales pattern. Which is written in standard quadratic form?',opts:['\\(y = mx + b\\)','\\(ax^2 + bx + c = 0,\\ a \\neq 0\\)','\\(x^3 - 1 = 0\\)','\\(y = \\dfrac{a}{x}\\)'],a:1,sol:'A quadratic equation has degree 2 with \\(a \\neq 0\\).',proc:'employ',band:'entry',comp:'M9AL-Ia-1'},

        {id:'P-g9q1-1-4',two:true,stim:'A jet from the Riverbanks Center fountain leaves its nozzle at a height of 0.5 m. Its height after \\(t\\) seconds is \\(h = -4.9(t - 1)^2 + 5.4\\) meters.',stem:'When does the water fall back to the height of the nozzle?',opts:['\\(t = 0\\) s','\\(t = 1\\) s','\\(t = \\pm 1\\) s','\\(t = 2\\) s'],a:3,sol:'Set \\(-4.9(t - 1)^2 + 5.4 = 0.5\\), so \\(-4.9(t - 1)^2 = -4.9\\) and \\((t - 1)^2 = 1\\). Then \\(t - 1 = \\pm 1\\), giving \\(t = 0\\) or \\(t = 2\\). The root \\(t = 0\\) is when the water leaves the nozzle, and \\(t = 1\\) is when it is highest. The water falls back to nozzle height at \\(t = 2\\) seconds.',proc:'employ',band:'standard',comp:'M9AL-Ii-j-2'},

        {id:'P-g9q1-1-6',two:true,stim:'At a barangay fun run in Concepcion, a volunteer tosses a ball up from a height of 1 m. Its height is \\(h(t) = -5t^2 + 10t + 1\\) meters after \\(t\\) seconds.',stem:'What is its height at \\(t = 1\\) second?',opts:['\\(16\\) m','\\(6\\) m','\\(5\\) m','\\(1\\) m'],a:1,sol:'\\(h(1) = -5(1)^2 + 10(1) + 1 = -5 + 10 + 1 = 6\\) m. Treating \\(-5t^2\\) as \\(+5\\) gives 16 m, and leaving out the 1 m release height gives 5 m. One second after the toss, the ball is 6 m high.',proc:'employ',band:'entry',comp:'M9AL-Ig-3'}

      {title:'Build',level:'Apply and model',items:[
        {id:'P-g9q1-2-1',two:false,stim:'At the Marikina River Park fun run, a participant tosses a water balloon upward from 1.5 m. Its height \\(h\\) (meters) after \\(t\\) seconds is \\(h(t) = -5t^2 + 11t + 1.5\\).',stem:'Which expression gives its height half a second after the toss, at \\(t = 0.5\\)?',opts:['\\(-5(0.5)^2 + 11(0.5) + 1.5\\)','\\(-5(0.5) + 11(0.5)^2 + 1.5\\)','\\(5(0.5)^2 + 11(0.5) + 1.5\\)','\\(-5(0.5^2) - 11(0.5) + 1.5\\)'],a:0,sol:'Replace every \\(t\\) with 0.5 and keep each sign and exponent: \\(-5(0.5)^2 + 11(0.5) + 1.5\\). Only the \\(t^2\\) term is squared, so \\(-5(0.5) + 11(0.5)^2 + 1.5\\) puts the square on the wrong term. The expression equals \\(-1.25 + 5.5 + 1.5 = 5.75\\), so the balloon is 5.75 m high half a second after the toss.',proc:'formulate',band:'basic',comp:'M9AL-Ig-3'},
        {id:'P-g9q1-2-2',two:true,stim:'At the Marikina River Park fun run, a participant tosses a water balloon upward from 1.5 m. Its height \\(h\\) (meters) after \\(t\\) seconds is \\(h(t) = -5t^2 + 11t + 1.5\\).',stem:'What is its height at \\(t = 2\\) seconds?',opts:['\\(43.5\\) m','\\(3.5\\) m','\\(2\\) m','\\(13.5\\) m'],a:1,sol:'\\(h(2) = -5(2)^2 + 11(2) + 1.5 = -20 + 22 + 1.5 = 3.5\\) m. Forgetting to square the 2 gives \\(-10 + 22 + 1.5 = 13.5\\) m, which is far too high for a tossed balloon. Two seconds after the toss, the balloon is 3.5 m above the ground.',proc:'employ',band:'basic',comp:'M9AL-Ig-3'},
        {id:'P-g9q1-2-3',two:true,stim:'A rectangular lot near the Marikina River has a width \\(x\\) and a length 4 m longer, with area \\(96\\ \\text{m}^2\\), so \\(x(x + 4) = 96\\).',stem:'What is the width?',opts:['\\(12\\) m','\\(6\\) m','\\(8\\) m','\\(10\\) m'],a:2,sol:'\\(x^2 + 4x - 96 = (x + 12)(x - 8) = 0\\); the positive width is \\(8\\) m.',proc:'employ',band:'standard',comp:'M9AL-Ie-1'},
        {id:'P-g9q1-2-4',two:true,stim:'A Marikina bag-maker&rsquo;s daily profit is \\(P = -2(x - 10)^2 + 50\\), where \\(x\\) is the number of extra bags sewn.',stem:'How many extra bags give the greatest profit?',opts:['\\(50\\)','\\(2\\)','\\(-10\\)','\\(10\\)'],a:3,sol:'The maximum of \\(y = a(x - h)^2 + k\\) with \\(a < 0\\) is at \\(x = h = 10\\).',proc:'employ',band:'basic',comp:'M9AL-Ii-j-2'},

      {title:'Challenge',level:'Interpret and reason',items:[
        {id:'P-g9q1-3-1',two:false,stim:'Sample model: in heavy rain, the Marikina River at the Sto. Nino gauge starts rising from 14 m. Its rise above 14 m is \\(r(t) = -0.02t^2 + 0.4t\\) meters, where \\(t\\) is hours after rising began. Alarm levels: 15 m (first), 16 m (second), 18 m (third).',stem:'The vertex of \\(r(t)\\) is \\((10, 2)\\). What does it tell flood responders?',opts:['The river peaks 10 hours after it began rising, at 16 m on the gauge, the second alarm level.','The river peaks at 10 m above 14 m, 2 hours after it began rising.','The river peaks at 2 m on the gauge, 10 hours after it began rising.','The river rises 2 m every 10 hours, so it keeps rising.'],a:0,sol:'The vertex \\((10, 2)\\) means that at \\(t = 10\\) hours the rise is largest, \\(r(10) = -2 + 4 = 2\\) m. Since \\(r\\) is measured above 14 m, the gauge reads \\(14 + 2 = 16\\) m, the second alarm, so residents should prepare to evacuate. Reading 2 m as the gauge level forgets the 14 m starting point. The river peaks at 16 m, 10 hours after it began rising.',proc:'interpret',band:'standard',comp:'M9AL-Ii-j-2'},
        {id:'P-g9q1-3-2',two:false,stim:'Sample model: in heavy rain, the Marikina River at the Sto. Nino gauge starts rising from 14 m. Its rise above 14 m is \\(r(t) = -0.02t^2 + 0.4t\\) meters, where \\(t\\) is hours after rising began. Alarm levels: 15 m (first), 16 m (second), 18 m (third).',stem:'The model gives \\(r = 0\\) at \\(t = 0\\) and at \\(t = 20\\). What does \\(t = 20\\) represent?',opts:['The river is at its highest level.','The river is back down to 14 m, 20 hours after it began rising.','The river has dried up completely.','The river has reached 20 m, above the third alarm.'],a:1,sol:'Since \\(r\\) is the rise above 14 m, \\(r = 0\\) means the river is back at 14 m, and \\(r(20) = -8 + 8 = 0\\). It does not mean the river is empty, because \\(r\\) is measured from 14 m, not from the riverbed. The highest level comes halfway, at \\(t = 10\\). So \\(t = 20\\) is when the river returns to 14 m, 20 hours after it began rising.',proc:'interpret',band:'standard',comp:'M9AL-Ii-j-2'},
        {id:'P-g9q1-3-3',two:false,stim:'At a barangay fun run in Nangka, Jomar tosses a ball straight up. Its height is \\(h(t) = -5t^2 + 8t + 1\\) meters after \\(t\\) seconds.',stem:'Jomar finds \\(h(0) = 1\\) and \\(h(1) = 4\\). He claims the ball is still rising at \\(t = 1\\) s. Which evaluation is correct?',opts:['Jomar is right, because \\(h(1) = 4\\) m is higher than the starting height \\(h(0) = 1\\) m.','Jomar is wrong, because \\(a = -5\\) is negative, so the ball falls the whole time.','Jomar is wrong, because the ball peaks at \\(t = 0.8\\) s, so it is already falling at \\(t = 1\\) s.','Jomar is right, because the ball peaks at \\(t = -\\dfrac{b}{a} = 1.6\\) s.'],a:2,sol:'The ball is highest at \\(t = -\\dfrac{b}{2a} = -\\dfrac{8}{2(-5)} = 0.8\\) s, where \\(h(0.8) = 4.2\\) m. Since \\(1 > 0.8\\), the ball is already falling at \\(t = 1\\) s, even though \\(h(1) = 4\\) m is still above the start; comparing with \\(h(0)\\) only shows it is higher than where it began. Using \\(-\\dfrac{b}{a} = 1.6\\) leaves out the 2, and a negative \\(a\\) does not mean the ball falls from the start. Jomar is wrong: the ball peaks at 0.8 s and is coming down at 1 s.',proc:'reason',band:'stretch',comp:'M9AL-Ii-j-2'},
        {id:'P-g9q1-3-4',two:false,stim:'For a dance contest, Sta. Elena High School buys a square floor mat with an area of \\(49\\ \\text{m}^2\\). Its side \\(s\\) satisfies \\(s^2 = 49\\).',stem:'Lea answers \\(s = 7\\) or \\(s = -7\\). Carlo answers only \\(s = 7\\). Which evaluation is correct?',opts:['Carlo is right, because \\(-7\\) never solves \\(s^2 = 49\\): a square root is always positive.','Lea is right, because the side can be \\(7\\) m or \\(-7\\) m, since both satisfy \\(s^2 = 49\\).','Neither is right: the side is \\(24.5\\) m, since \\(s^2 = 49\\) means \\(2s = 49\\).','Lea&rsquo;s roots both solve \\(s^2 = 49\\), but a side must be positive, so Carlo&rsquo;s \\(7\\) m is the side.'],a:3,sol:'Both \\(7^2 = 49\\) and \\((-7)^2 = 49\\), so Lea solved the equation correctly. A side length cannot be negative, so the mat&rsquo;s side is only \\(7\\) m, which is Carlo&rsquo;s answer. Saying \\(-7\\) never solves the equation is false, and keeping \\(-7\\) m as a side ignores the context. The mat measures 7 m by 7 m.',proc:'interpret',band:'standard',comp:'M9AL-Ie-1'},
        {id:'P-g9q1-3-5',two:false,stim:'Sample model: the arch of a Marikina River Park footbridge has height \\(y = -0.06x^2 + 1.2x\\) meters, where \\(x\\) is the distance (m) from its left foot.',stem:'Setting \\(y = 6.5\\) gives an equation with discriminant \\(-0.12\\). What does this tell you about the arch?',opts:['No point of the arch is 6.5 m high, so its top is below 6.5 m.','The arch is 6.5 m high at exactly one point, its top.','The arch is 6.5 m high at two points, one on each side of its top.','The top of the arch is 0.12 m below 6.5 m, at 6.38 m.'],a:0,sol:'Rearranging gives \\(-0.06x^2 + 1.2x - 6.5 = 0\\), with \\(b^2 - 4ac = 1.44 - 1.56 = -0.12\\). A negative discriminant means no real \\(x\\) makes \\(y = 6.5\\), so the arch never reaches 6.5 m; its top is actually \\(y(10) = -6 + 12 = 6\\) m. The discriminant is not a distance, so it does not place the top at 6.38 m. The whole arch stays below 6.5 m.',proc:'interpret',band:'stretch',comp:'M9AL-Ic-1'},
        {id:'P-g9q1-3-6',two:false,stim:'A learner models a stall&rsquo;s sales data \\((0, 3), (1, 2), (2, 3)\\) with \\(y = x^2 + 2x + 3\\).',stem:'Which analysis correctly fixes the model?',opts:['The model already fits every point','Change \\(+2x\\) to \\(-2x\\): \\(y = x^2 - 2x + 3\\)','Change the constant to 0','Use \\(y = -x^2 + 2x + 3\\)'],a:1,sol:'Testing \\(x = 1\\) gives 6, not 2. The data are symmetric about \\(x = 1\\) with minimum 2, so \\(y = x^2 - 2x + 3\\).',proc:'reason',band:'standard',comp:'M9AL-Ij-1'}
      ]}
